<!DOCTYPE html>
<html>
<head>

<style>
html,body{margin:0;padding:0;background:#0a0d13;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e5e9f0;}
*{box-sizing:border-box;}
a{color:#f97316;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}::-webkit-scrollbar-thumb{background:#1e2633;border-radius:4px;}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid #171d29;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-badge{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#f97316,#ea580c);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:16px;}
.logo-text{font-size:17px;font-weight:800;}
.logo-text span{color:#f97316;}
.voltar{font-size:13px;font-weight:700;color:#9aa4b2;}
.voltar:hover{color:#e5e9f0;}

.wrap{max-width:920px;margin:0 auto;padding:32px 20px 80px;}
.card{background:#10151f;border:1px solid #1a2130;border-radius:16px;padding:28px;}
h1{font-size:20px;font-weight:800;margin:0 0 6px;}
.sub{font-size:13.5px;color:#9aa4b2;margin:0 0 24px;}

.qtd-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:420px;}
.qtd-btn{background:#0d1119;border:1px solid #1e2633;border-radius:12px;padding:22px 0;text-align:center;font-size:22px;font-weight:800;color:#e5e9f0;}
.qtd-btn:hover{border-color:rgba(249,115,22,.45);color:#f97316;}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;border-bottom:1px solid #171d29;padding-bottom:0;}
.tab{padding:10px 16px;font-size:13.5px;font-weight:700;color:#9aa4b2;border-bottom:2px solid transparent;cursor:pointer;}
.tab.active{color:#f97316;border-color:#f97316;}

label{font-size:12px;font-weight:700;color:#9aa4b2;display:block;margin-bottom:6px;}
input,select,textarea{width:100%;background:#0d1119;border:1px solid #1e2633;border-radius:9px;padding:10px 13px;color:#e5e9f0;font-size:13.5px;outline:none;}
textarea{resize:vertical;min-height:52px;}
.counter{font-size:11px;color:#66707e;text-align:right;margin-top:3px;}

.dias-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:20px;}
.dia-btn{display:flex;align-items:center;justify-content:space-between;background:#0d1119;border:1px solid #1e2633;color:#9aa4b2;font-size:12.5px;font-weight:600;padding:9px 11px;border-radius:8px;}
.dia-btn.sel{background:rgba(249,115,22,.1);border-color:rgba(249,115,22,.4);color:#f97316;}

.ex-item{background:#0d1119;border:1px solid #1a2130;border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}
.ex-nome{font-size:14px;font-weight:700;}
.ex-meta{font-size:12px;color:#66707e;margin-top:3px;white-space:pre-line;}
.ex-obs{font-size:11.5px;color:#4a5364;margin-top:5px;font-style:italic;}
.ex-actions{display:flex;gap:2px;flex-shrink:0;}
.ex-icon-btn{background:none;border:none;color:#66707e;font-size:13px;padding:4px 6px;line-height:1;border-radius:6px;}
.ex-icon-btn:hover{color:#e5e9f0;background:#131a26;}
.ex-icon-btn:disabled{opacity:.3;cursor:default;}
.ex-icon-btn:disabled:hover{background:none;}
.ex-remove{background:none;border:none;color:#66707e;font-size:13px;padding:4px 6px;}
.ex-remove:hover{color:#f87171;background:#131a26;border-radius:6px;}

.combo-box{border:1px solid rgba(168,85,247,.3);border-radius:12px;padding:12px;margin-bottom:10px;background:rgba(168,85,247,.04);}
.combo-label{font-size:10.5px;font-weight:800;color:#a855f7;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;}
.combo-box .ex-item{padding:9px 11px;margin-bottom:6px;}
.combo-box .ex-item:last-child{margin-bottom:0;}
.combo-box .ex-nome{font-size:12.5px;}
.combo-box .ex-meta{font-size:11px;margin-top:2px;}
.combo-box .ex-obs{font-size:11px;}
.combo-box .ex-icon-btn,.combo-box .ex-remove{font-size:11.5px;padding:3px 5px;}
.combinar-btn{background:none;border:none;color:#a855f7;font-size:12px;font-weight:700;padding:4px 0;}
.combinar-btn:hover{text-decoration:underline;}

.ex-search-wrap{position:relative;}
.ex-search-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#131a26;border:1px solid #1e2633;border-radius:10px;max-height:230px;overflow-y:auto;z-index:30;box-shadow:0 10px 28px rgba(0,0,0,.45);}
.ex-search-item{padding:9px 13px;font-size:13px;font-weight:600;cursor:pointer;}
.ex-search-item:hover,.ex-search-item.active{background:rgba(249,115,22,.12);color:#f97316;}
.ex-search-empty{padding:9px 13px;font-size:12px;color:#66707e;}

.btn{border:none;border-radius:10px;padding:11px 18px;font-size:13.5px;font-weight:700;cursor:pointer;}
.btn-primary{background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;}
.btn-secondary{background:#1e2633;color:#e5e9f0;}
.btn:disabled{opacity:.55;cursor:default;}

.add-ex-form{background:#0d1119;border:1px dashed #1e2633;border-radius:12px;padding:18px;margin-top:14px;display:flex;flex-direction:column;gap:12px;}
.add-ex-form-inline{border:1px solid rgba(249,115,22,.35);border-top:none;border-radius:0 0 12px 12px;margin-top:-10px;margin-bottom:10px;}

.aplicar-box{margin-top:28px;padding-top:24px;border-top:1px solid #171d29;}
.erro{color:#f87171;font-size:12.5px;margin-top:8px;}
.ok{color:#4ade80;font-size:12.5px;margin-top:8px;}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:24px;}
.stat-box{background:#0d1119;border:1px solid #1a2130;border-radius:12px;padding:14px 16px;}
.stat-num{font-size:22px;font-weight:800;}
.stat-label{font-size:11.5px;color:#66707e;margin-top:2px;}

.dist-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.dist-label{flex:0 0 130px;font-size:12.5px;color:#e5e9f0;}
.dist-bar-track{flex:1;height:8px;background:#0d1119;border-radius:999px;overflow:hidden;}
.dist-bar-fill{height:100%;background:#f97316;border-radius:999px;}
.dist-count{flex:0 0 60px;text-align:right;font-size:12px;color:#66707e;}

.detalhe-treino{background:#0d1119;border:1px solid #1a2130;border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.detalhe-nome{font-size:13.5px;font-weight:700;display:flex;justify-content:space-between;cursor:pointer;}
.detalhe-tags{font-size:12px;color:#66707e;margin-top:4px;}

.toggle-switch{width:44px;height:26px;border-radius:999px;background:#1e2633;border:none;position:relative;flex-shrink:0;padding:0;}
.toggle-switch.on{background:#f97316;}
.toggle-knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;}
.toggle-switch.on .toggle-knob{left:21px;}

.quick-ex{background:#0a0d13;border:1px solid #171d29;border-radius:9px;padding:10px 12px;margin-top:8px;}
.quick-ex-nome{font-size:12.5px;font-weight:700;margin-bottom:6px;}
.quick-ex-fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.quick-ex-fields label{margin-bottom:3px;}
.quick-ex-fields input{font-size:12.5px;padding:7px 9px;}

.template-item{width:100%;text-align:left;background:#0d1119;border:1px solid #1e2633;border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;color:#e5e9f0;font-size:13.5px;font-weight:700;margin-bottom:8px;}
.template-item:hover{border-color:rgba(249,115,22,.45);}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-box{background:#10151f;border:1px solid #1a2130;border-radius:16px;padding:24px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto;}
.modal-box h2{font-size:16px;font-weight:800;margin:0 0 16px;}
.tecnica-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;background:#0d1119;border:1px solid #1a2130;border-radius:10px;padding:10px 13px;margin-bottom:8px;}
.tecnica-row-nome{font-size:13px;font-weight:700;}
.tecnica-row-obs{font-size:11.5px;color:#66707e;margin-top:2px;}
.tecnica-row-actions{display:flex;gap:2px;flex-shrink:0;}

.serie-tmpl-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#0d1119;border:1px solid #1a2130;border-radius:10px;padding:10px 13px;margin-bottom:8px;cursor:pointer;}
.serie-tmpl-row:hover{border-color:rgba(249,115,22,.35);}
.serie-tmpl-nome{font-size:13px;font-weight:700;}
.serie-tmpl-sub{font-size:11.5px;color:#66707e;margin-top:2px;}
.serie-tmpl-actions{display:flex;gap:2px;flex-shrink:0;}
.serie-tmpl-linha{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.serie-tmpl-linha input{flex:1;}
.add-serie-btn{background:none;border:1px dashed #1e2633;color:#9aa4b2;font-size:12px;font-weight:700;padding:9px;border-radius:8px;width:100%;}
.add-serie-btn:hover{border-color:rgba(249,115,22,.45);color:#f97316;}
.serie-tmpl-link{background:none;border:none;color:#f97316;font-size:12px;font-weight:700;padding:2px 0;}
.serie-tmpl-link:hover{text-decoration:underline;}
</style>

<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-badge">E</div>
    <div class="logo-text">Elo <span>Fitness</span></div>
  </div>
  <a class="voltar" id="voltar-link" href="acervo.html">← Voltar pro acervo</a>
</div>

<div class="wrap">
  <div class="card" id="app">Carregando…</div>
  <div class="card" id="analise" style="margin-top:20px;display:none;"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const splitIdParam = params.get('split_id');
const clienteIdParam = params.get('cliente_id');
const clienteNomeParam = params.get('cliente_nome');
const app = document.getElementById('app');
const analise = document.getElementById('analise');

const DIAS = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const LETRAS = ['A','B','C','D','E','F'];

let userId = null;
let treinos = [];
let exerciciosLib = [];
let tecnicasLib = [];
let seriesTemplatesLib = [];
let clientes = [];
let activeIndex = 0;
let formMode = { type: 'add' };
let splitId = splitIdParam;
let templates = [];
let expandedTreinos = new Set();

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function tecnicaPorId(id) {
  if (!id || id === 'nenhuma') return null;
  return tecnicasLib.find(t => t.id === id) || null;
}

function abrirModalTecnica({ tecnica, onSaved }) {
  const overlay = el('<div class="modal-overlay"></div>');
  const box = el('<div class="modal-box"></div>');
  box.appendChild(el('<h2>' + (tecnica ? 'Editar técnica' : 'Criar nova técnica') + '</h2>'));

  const nomeWrap = el('<div><label>Nome da técnica</label></div>');
  const nomeInput = el('<input maxlength="60" placeholder="Ex: Rest-Pause, Cluster Set, Drop Set Duplo…">');
  nomeInput.value = tecnica ? tecnica.nome : '';
  nomeWrap.appendChild(nomeInput);
  box.appendChild(nomeWrap);

  const obsWrap = el('<div style="margin-top:12px;"><label>Como realizar / Observação</label></div>');
  const obsTa = el('<textarea maxlength="500" placeholder="Ex: Realizar as repetições até próximo da falha, descansar 15 segundos e executar mais algumas repetições mantendo a execução controlada."></textarea>');
  obsTa.value = tecnica ? (tecnica.observacao || '') : '';
  obsWrap.appendChild(obsTa);
  box.appendChild(obsWrap);

  const erro = el('<div class="erro" style="display:none;"></div>');
  box.appendChild(erro);

  const btnRow = el('<div style="display:flex;gap:10px;margin-top:16px;"></div>');
  const cancelBtn = el('<button type="button" class="btn btn-secondary" style="flex:1;">Cancelar</button>');
  const saveBtn = el('<button type="button" class="btn btn-primary" style="flex:1;">Salvar técnica</button>');
  cancelBtn.addEventListener('click', () => overlay.remove());
  overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) overlay.remove(); });

  saveBtn.addEventListener('click', async () => {
    const nome = nomeInput.value.trim();
    if (!nome) { erro.textContent = 'Digite um nome pra técnica.'; erro.style.display = ''; return; }
    erro.style.display = 'none';
    saveBtn.disabled = true;
    saveBtn.textContent = 'Salvando…';

    const payload = { nome, observacao: obsTa.value.trim() || null };
    const result = tecnica
      ? await supabaseClient.from('tecnicas_avancadas').update(payload).eq('id', tecnica.id).select().single()
      : await supabaseClient.from('tecnicas_avancadas').insert({ ...payload, trainer_id: userId }).select().single();

    if (result.error) {
      erro.textContent = result.error.message;
      erro.style.display = '';
      saveBtn.disabled = false;
      saveBtn.textContent = 'Salvar técnica';
      return;
    }

    if (tecnica) Object.assign(tecnica, result.data);
    else tecnicasLib.push(result.data);

    overlay.remove();
    onSaved && onSaved(result.data);
  });

  btnRow.appendChild(cancelBtn);
  btnRow.appendChild(saveBtn);
  box.appendChild(btnRow);

  overlay.appendChild(box);
  document.body.appendChild(overlay);
  nomeInput.focus();
}

function abrirGerenciarTecnicas(onChange) {
  const overlay = el('<div class="modal-overlay"></div>');
  const box = el('<div class="modal-box" style="max-width:480px;"></div>');
  box.appendChild(el('<h2>Técnicas avançadas</h2>'));

  const list = el('<div></div>');

  const renderList = () => {
    list.innerHTML = '';
    if (!tecnicasLib.length) {
      list.appendChild(el('<div class="sub" style="margin:0 0 12px;">Nenhuma técnica cadastrada ainda.</div>'));
    }
    tecnicasLib.forEach(t => {
      const row = el('<div class="tecnica-row"></div>');
      const info = el('<div style="min-width:0;"></div>');
      info.appendChild(el('<div class="tecnica-row-nome"></div>')).textContent = t.nome;
      if (t.observacao) info.appendChild(el('<div class="tecnica-row-obs"></div>')).textContent = t.observacao;
      row.appendChild(info);

      const actions = el('<div class="tecnica-row-actions"></div>');
      const editBtn = el('<button type="button" class="ex-icon-btn" title="Editar">✎</button>');
      editBtn.addEventListener('click', () => abrirModalTecnica({
        tecnica: t,
        onSaved: () => { renderList(); onChange && onChange(); }
      }));
      const delBtn = el('<button type="button" class="ex-remove">remover</button>');
      delBtn.addEventListener('click', async () => {
        if (!window.confirm('Remover a técnica "' + t.nome + '"? Exercícios que já usam ela vão ficar sem técnica vinculada.')) return;
        await supabaseClient.from('tecnicas_avancadas').delete().eq('id', t.id);
        tecnicasLib = tecnicasLib.filter(x => x.id !== t.id);
        renderList();
        onChange && onChange();
      });
      actions.appendChild(editBtn);
      actions.appendChild(delBtn);
      row.appendChild(actions);
      list.appendChild(row);
    });
  };
  renderList();
  box.appendChild(list);

  const novaBtn = el('<button type="button" class="btn btn-secondary" style="width:100%;margin-top:6px;">+ Criar nova técnica</button>');
  novaBtn.addEventListener('click', () => abrirModalTecnica({
    tecnica: null,
    onSaved: () => { renderList(); onChange && onChange(); }
  }));
  box.appendChild(novaBtn);

  const fecharBtn = el('<button type="button" class="btn btn-primary" style="width:100%;margin-top:10px;">Fechar</button>');
  fecharBtn.addEventListener('click', () => overlay.remove());
  box.appendChild(fecharBtn);

  overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) overlay.remove(); });
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

// Templates antigos não têm `tipo` gravado — infere pelo nome da linha
// (a convenção já usada era nomear a linha como "Aquecimento").
function tipoDaLinha(l) {
  if (l.tipo === 'aquecimento' || l.tipo === 'valida') return l.tipo;
  return /aquec/i.test(l.nome || '') ? 'aquecimento' : 'valida';
}

function formatarSerieTemplatePorTipo(tmpl, tipo) {
  return (tmpl.linhas || [])
    .filter(l => tipoDaLinha(l) === tipo)
    .filter(l => (l.nome || '').trim() || (l.reps || '').trim())
    .map(l => (l.nome || '').trim() ? (l.nome.trim() + ': ' + (l.reps || '').trim()) : (l.reps || '').trim())
    .join('\n');
}

// Cada linha já preenchida num textarea de séries (aquecimento ou válidas)
// vira uma linha do modelo tal como está — sem tentar separar nome/reps,
// que na prática vêm misturados no texto livre do treinador.
function parseSeriesTextoParaLinhas(texto, tipo) {
  return (texto || '')
    .split('\n')
    .map(l => l.trim())
    .filter(Boolean)
    .map(l => ({ nome: '', reps: l, tipo: tipo || 'valida' }));
}

function abrirModalSalvarSerieRapido({ linhas, onSaved }) {
  const overlay = el('<div class="modal-overlay"></div>');
  const box = el('<div class="modal-box" style="max-width:380px;"></div>');
  box.appendChild(el('<h2>Salvar como série pré-definida</h2>'));

  const nomeWrap = el('<div><label>Nome da série pré-definida</label></div>');
  const nomeInput = el('<input maxlength="60" placeholder="Ex: Protocolo Padrão">');
  nomeWrap.appendChild(nomeInput);
  box.appendChild(nomeWrap);

  const erro = el('<div class="erro" style="display:none;"></div>');
  box.appendChild(erro);

  const btnRow = el('<div style="display:flex;gap:10px;margin-top:16px;"></div>');
  const cancelBtn = el('<button type="button" class="btn btn-secondary" style="flex:1;">Cancelar</button>');
  const saveBtn = el('<button type="button" class="btn btn-primary" style="flex:1;">Salvar</button>');
  cancelBtn.addEventListener('click', () => overlay.remove());
  overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) overlay.remove(); });

  saveBtn.addEventListener('click', async () => {
    const nome = nomeInput.value.trim();
    if (!nome) { erro.textContent = 'Digite um nome pra série pré-definida.'; erro.style.display = ''; return; }
    if (!linhas.length) { erro.textContent = 'Preencha as séries do exercício antes de salvar como modelo.'; erro.style.display = ''; return; }
    erro.style.display = 'none';
    saveBtn.disabled = true;
    saveBtn.textContent = 'Salvando…';

    const result = await supabaseClient.from('series_predefinidas')
      .insert({ nome, linhas, trainer_id: userId }).select().single();

    if (result.error) {
      erro.textContent = result.error.message;
      erro.style.display = '';
      saveBtn.disabled = false;
      saveBtn.textContent = 'Salvar';
      return;
    }

    seriesTemplatesLib.push(result.data);
    overlay.remove();
    onSaved && onSaved(result.data);
  });

  btnRow.appendChild(cancelBtn);
  btnRow.appendChild(saveBtn);
  box.appendChild(btnRow);

  overlay.appendChild(box);
  document.body.appendChild(overlay);
  nomeInput.focus();
}

function abrirModalSerieTemplate({ template, linhasIniciais, onSaved }) {
  const overlay = el('<div class="modal-overlay"></div>');
  const box = el('<div class="modal-box" style="max-width:460px;"></div>');
  box.appendChild(el('<h2>' + (template ? 'Editar série pré-definida' : 'Criar nova série pré-definida') + '</h2>'));

  const nomeWrap = el('<div><label>Nome da série pré-definida</label></div>');
  const nomeInput = el('<input maxlength="60" placeholder="Ex: Protocolo Padrão, Hipertrofia, Força…">');
  nomeInput.value = template ? template.nome : '';
  nomeWrap.appendChild(nomeInput);
  box.appendChild(nomeWrap);

  const linhasWrap = el('<div style="margin-top:14px;"><label>Séries</label></div>');
  const linhasList = el('<div></div>');
  linhasWrap.appendChild(linhasList);
  box.appendChild(linhasWrap);

  const linhasIniciaisReais = template ? (template.linhas || []) : (linhasIniciais || [{ nome: '', reps: '', tipo: 'valida' }]);
  const linhas = linhasIniciaisReais.length ? linhasIniciaisReais.map(l => ({ ...l })) : [{ nome: '', reps: '', tipo: 'valida' }];

  const renderLinhas = () => {
    linhasList.innerHTML = '';
    linhas.forEach((l, i) => {
      const row = el('<div class="serie-tmpl-linha"></div>');
      const tipoSel = el('<select style="flex:0 0 118px;"><option value="valida">Válida</option><option value="aquecimento">Aquecimento</option></select>');
      tipoSel.value = tipoDaLinha(l);
      tipoSel.addEventListener('change', () => l.tipo = tipoSel.value);
      const nomeI = el('<input placeholder="Ex: Drop set, Variação…">');
      nomeI.value = l.nome || '';
      nomeI.addEventListener('input', () => l.nome = nomeI.value);
      const repsI = el('<input placeholder="Ex: 10 reps, 8-10, 12">');
      repsI.value = l.reps || '';
      repsI.addEventListener('input', () => l.reps = repsI.value);
      const rmBtn = el('<button type="button" class="ex-remove">✕</button>');
      rmBtn.addEventListener('click', () => { linhas.splice(i, 1); renderLinhas(); });
      row.appendChild(tipoSel);
      row.appendChild(nomeI);
      row.appendChild(repsI);
      row.appendChild(rmBtn);
      linhasList.appendChild(row);
    });
  };
  renderLinhas();

  const addLinhaBtn = el('<button type="button" class="add-serie-btn">+ Adicionar série</button>');
  addLinhaBtn.addEventListener('click', () => { linhas.push({ nome: '', reps: '', tipo: 'valida' }); renderLinhas(); });
  box.appendChild(addLinhaBtn);

  const erro = el('<div class="erro" style="display:none;"></div>');
  box.appendChild(erro);

  const btnRow = el('<div style="display:flex;gap:10px;margin-top:16px;"></div>');
  const cancelBtn = el('<button type="button" class="btn btn-secondary" style="flex:1;">Cancelar</button>');
  const saveBtn = el('<button type="button" class="btn btn-primary" style="flex:1;">Salvar série pré-definida</button>');
  cancelBtn.addEventListener('click', () => overlay.remove());
  overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) overlay.remove(); });

  saveBtn.addEventListener('click', async () => {
    const nome = nomeInput.value.trim();
    const linhasValidas = linhas
      .filter(l => (l.nome || '').trim() || (l.reps || '').trim())
      .map(l => ({ nome: l.nome || '', reps: l.reps || '', tipo: tipoDaLinha(l) }));
    if (!nome) { erro.textContent = 'Digite um nome pra série pré-definida.'; erro.style.display = ''; return; }
    if (!linhasValidas.length) { erro.textContent = 'Adicione ao menos uma série.'; erro.style.display = ''; return; }
    erro.style.display = 'none';
    saveBtn.disabled = true;
    saveBtn.textContent = 'Salvando…';

    const payload = { nome, linhas: linhasValidas };
    const result = template
      ? await supabaseClient.from('series_predefinidas').update(payload).eq('id', template.id).select().single()
      : await supabaseClient.from('series_predefinidas').insert({ ...payload, trainer_id: userId }).select().single();

    if (result.error) {
      erro.textContent = result.error.message;
      erro.style.display = '';
      saveBtn.disabled = false;
      saveBtn.textContent = 'Salvar série pré-definida';
      return;
    }

    if (template) Object.assign(template, result.data);
    else seriesTemplatesLib.push(result.data);

    overlay.remove();
    onSaved && onSaved(result.data);
  });

  btnRow.appendChild(cancelBtn);
  btnRow.appendChild(saveBtn);
  box.appendChild(btnRow);

  overlay.appendChild(box);
  document.body.appendChild(overlay);
  nomeInput.focus();
}

function abrirEscolherSerieTemplate({ onAplicar }) {
  const overlay = el('<div class="modal-overlay"></div>');
  const box = el('<div class="modal-box" style="max-width:480px;"></div>');
  box.appendChild(el('<h2>Séries pré-definidas</h2>'));

  const list = el('<div></div>');

  const renderList = () => {
    list.innerHTML = '';
    if (!seriesTemplatesLib.length) {
      list.appendChild(el('<div class="sub" style="margin:0 0 12px;">Nenhuma série pré-definida cadastrada ainda.</div>'));
    }
    seriesTemplatesLib.forEach(tmpl => {
      const row = el('<div class="serie-tmpl-row"></div>');
      const info = el('<div style="min-width:0;"></div>');
      info.appendChild(el('<div class="serie-tmpl-nome"></div>')).textContent = tmpl.nome;
      const nAquec = (tmpl.linhas || []).filter(l => tipoDaLinha(l) === 'aquecimento').length;
      const nValida = (tmpl.linhas || []).filter(l => tipoDaLinha(l) === 'valida').length;
      const subTexto = (nAquec ? nAquec + ' aquec. + ' : '') + nValida + (nValida === 1 ? ' válida' : ' válidas');
      info.appendChild(el('<div class="serie-tmpl-sub"></div>')).textContent = subTexto;
      row.appendChild(info);

      const actions = el('<div class="serie-tmpl-actions"></div>');
      const editBtn = el('<button type="button" class="ex-icon-btn" title="Editar">✎</button>');
      editBtn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        abrirModalSerieTemplate({ template: tmpl, onSaved: () => renderList() });
      });
      const delBtn = el('<button type="button" class="ex-remove">remover</button>');
      delBtn.addEventListener('click', async (ev) => {
        ev.stopPropagation();
        if (!window.confirm('Remover a série pré-definida "' + tmpl.nome + '"?')) return;
        await supabaseClient.from('series_predefinidas').delete().eq('id', tmpl.id);
        seriesTemplatesLib = seriesTemplatesLib.filter(x => x.id !== tmpl.id);
        renderList();
      });
      actions.appendChild(editBtn);
      actions.appendChild(delBtn);
      row.appendChild(actions);

      row.addEventListener('click', () => { onAplicar(tmpl); overlay.remove(); });
      list.appendChild(row);
    });
  };
  renderList();
  box.appendChild(list);

  const novaBtn = el('<button type="button" class="btn btn-secondary" style="width:100%;margin-top:6px;">+ Criar nova série pré-definida</button>');
  novaBtn.addEventListener('click', () => abrirModalSerieTemplate({
    template: null,
    onSaved: (nova) => { onAplicar(nova); overlay.remove(); }
  }));
  box.appendChild(novaBtn);

  const fecharBtn = el('<button type="button" class="btn btn-primary" style="width:100%;margin-top:10px;">Fechar</button>');
  fecharBtn.addEventListener('click', () => overlay.remove());
  box.appendChild(fecharBtn);

  overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) overlay.remove(); });
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

function extractYoutubeId(url) {
  if (!url) return null;
  try {
    const u = new URL(url.trim());
    const host = u.hostname.replace(/^www\./, '');
    if (host === 'youtu.be') return u.pathname.slice(1) || null;
    if (host === 'youtube.com' || host === 'm.youtube.com') {
      if (u.pathname === '/watch') return u.searchParams.get('v');
      if (u.pathname.startsWith('/embed/')) return u.pathname.split('/embed/')[1] || null;
      if (u.pathname.startsWith('/shorts/')) return u.pathname.split('/shorts/')[1] || null;
    }
  } catch (e) { /* not a valid URL */ }
  return null;
}

// Player embutido (iframe + link de fallback), usado tanto pela prévia de
// vídeo do form de adicionar/editar exercício quanto pelo "Ver vídeo" da
// lista de exercícios — um único componente, pra nunca abrir nova aba.
function buildVideoEmbedNode(url) {
  const wrap = el('<div></div>');
  const ytId = extractYoutubeId(url);
  const embedSrc = ytId ? 'https://www.youtube.com/embed/' + ytId : url;
  wrap.appendChild(el(
    '<iframe src="' + embedSrc.replace(/"/g, '&quot;') + '" width="100%" height="180" ' +
    'style="border:0;border-radius:10px;display:block;" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>'
  ));
  const link = el('<a target="_blank" rel="noopener" style="display:inline-block;margin-top:6px;font-size:11.5px;font-weight:700;color:#66707e;">Não carregou? Abrir vídeo em nova aba ↗</a>');
  link.href = url;
  wrap.appendChild(link);
  return wrap;
}

async function init() {
  if (clienteIdParam) {
    const link = document.getElementById('voltar-link');
    link.href = 'alunos.html';
    link.textContent = '← Voltar pro aluno';
  }

  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) return;
  userId = user.id;

  const { data: exs } = await supabaseClient.from('exercicios').select('id, nome, video_url').eq('trainer_id', userId).order('nome');
  exerciciosLib = exs || [];

  const { data: tecs } = await supabaseClient.from('tecnicas_avancadas').select('id, nome, observacao').eq('trainer_id', userId).order('created_at');
  tecnicasLib = tecs || [];

  const { data: sTmpls } = await supabaseClient.from('series_predefinidas').select('id, nome, linhas').eq('trainer_id', userId).order('created_at');
  seriesTemplatesLib = sTmpls || [];

  const { data: cls } = await supabaseClient.from('clientes').select('id, nome').eq('trainer_id', userId).order('nome');

async function carregarTemplates() {
  const { data } = await supabaseClient.from('treinos').select('*').eq('trainer_id', userId).is('cliente_id', null).order('ordem');
  const bySplit = {};
  (data || []).forEach(r => { if (!r.split_id) return; (bySplit[r.split_id] = bySplit[r.split_id] || []).push(r); });
  templates = Object.entries(bySplit).map(([sid, trs]) => {
    const ordenados = trs.sort((a, b) => a.ordem - b.ordem);
    return { splitId: sid, nome: ordenados.map(t => t.nome.replace(/^Treino\s*/i, '')).join('/'), treinos: ordenados };
  });
}

let cargasPorTreinoExercicio = {}; // treino_exercicio_id -> serie_index -> [{carga, data}, ...] desc por data

async function loadExerciciosDoTreino(treino) {
  const { data } = await supabaseClient
    .from('treino_exercicios')
    .select('*, exercicios(nome, categoria, video_url)')
    .eq('treino_id', treino.id)
    .order('ordem');
  treino._exercicios = data || [];
  if (!clienteIdParam || !treino._exercicios.length) return;
  treino._exercicios.forEach(te => { delete cargasPorTreinoExercicio[te.id]; });
  const { data: cargas } = await supabaseClient
    .from('serie_cargas')
    .select('treino_exercicio_id, serie_index, carga, data')
    .in('treino_exercicio_id', treino._exercicios.map(te => te.id))
    .order('data', { ascending: false });
  (cargas || []).forEach(c => {
    const porExercicio = cargasPorTreinoExercicio[c.treino_exercicio_id] || (cargasPorTreinoExercicio[c.treino_exercicio_id] = {});
    const lista = porExercicio[c.serie_index] || (porExercicio[c.serie_index] = []);
    if (lista.length < 2) lista.push(c);
  });
}

// "Série N — atual (anterior: X)": só aparece quando o aluno já registrou ao
// menos uma carga naquela série — nunca mostra algo que o aluno não digitou.
function renderCargasSerieList(te) {
  const cargasPorSerie = cargasPorTreinoExercicio[te.id];
  if (!cargasPorSerie || !Object.keys(cargasPorSerie).length) return null;
  const linhas = (te.series || '').split('\n').map(s => s.trim()).filter(Boolean);
  const wrap = el('<div style="margin-top:8px;padding-top:8px;border-top:1px dashed #1e2633;display:flex;flex-direction:column;gap:3px;"></div>');
  let alguma = false;
  linhas.forEach((texto, si) => {
    const historico = cargasPorSerie[si];
    if (!historico || !historico.length) return;
    alguma = true;
    const atual = historico[0];
    const anterior = historico[1];
    const fmt = (n) => String(n).replace('.', ',');
    let txt = 'Série ' + (si + 1) + ' — <b style="color:#4ade80;">' + fmt(atual.carga) + ' kg</b>';
    if (anterior && anterior.carga !== atual.carga) txt += ' <span style="color:#66707e;">(anterior: ' + fmt(anterior.carga) + ' kg)</span>';
    wrap.appendChild(el('<div style="font-size:11.5px;color:#9aa4b2;">' + txt + '</div>'));
  });
  return alguma ? wrap : null;
}

function gruposMusculares(treino) {
  const contagem = {};
  (treino._exercicios || []).forEach(te => {
    const cat = (te.exercicios || {}).categoria;
    if (!cat) return;
    contagem[cat] = (contagem[cat] || 0) + 1;
  });
  return Object.entries(contagem);
}

// Conta quantas séries um campo de texto livre (1 linha = 1 série) representa.
// Compat com notação antiga tipo "3x12" numa linha só = 3 séries.
function contarLinhasSerie(texto) {
  return (texto || '')
    .split('\n')
    .map(l => l.trim())
    .filter(Boolean)
    .reduce((total, linha) => {
      const m = linha.match(/^(\d+)\s*x\s*\d/i);
      return total + (m ? parseInt(m[1], 10) : 1);
    }, 0);
}

// Resumo compacto exibido na lista de exercícios (nunca o texto cru das
// séries, pra deixar claro o que é aquecimento e o que conta como volume).
function resumoSeries(te) {
  const validas = contarLinhasSerie(te.series);
  const aquecimento = contarLinhasSerie(te.series_aquecimento);
  if (!validas && !aquecimento) return 'sem séries definidas';
  const partes = [];
  if (aquecimento) partes.push(aquecimento + (aquecimento === 1 ? ' série de aquecimento' : ' séries de aquecimento'));
  partes.push(validas ? (validas + (validas === 1 ? ' série válida' : ' séries válidas')) : 'sem séries válidas');
  return partes.join(' + ');
}

// Volume de treinamento = soma das séries VÁLIDAS por grupamento muscular.
// Séries de aquecimento nunca entram aqui (regra central da feature).
function volumeSeriesPorGrupo(treinosArr) {
  const contagem = {};
  treinosArr.flatMap(t => t._exercicios || []).forEach(te => {
    const cat = (te.exercicios || {}).categoria;
    if (!cat) return;
    contagem[cat] = (contagem[cat] || 0) + contarLinhasSerie(te.series);
  });
  return contagem;
}

async function duplicarTreino(treino) {
  const usados = new Set(treinos.map(t => t.nome));
  let novoNome = null;
  const m = treino.nome.match(/^Treino ([A-Z])$/);
  if (m) {
    const livre = LETRAS.find(l => !usados.has('Treino ' + l));
    if (livre) novoNome = 'Treino ' + livre;
  }
  if (!novoNome) novoNome = treino.nome + ' (cópia)';

  const { data: novo, error } = await supabaseClient.from('treinos').insert({
    trainer_id: userId, cliente_id: treino.cliente_id, nome: novoNome,
    dias_semana: treino.dias_semana || [], habilitado: true,
    split_id: splitId, ordem: treinos.length
  }).select().single();
  if (error) { alert('Não foi possível duplicar: ' + error.message); return; }

  const exs = treino._exercicios || [];
  if (exs.length) {
    await supabaseClient.from('treino_exercicios').insert(exs.map((te, i) => ({
      treino_id: novo.id, exercicio_id: te.exercicio_id,
      ordem: i, series_aquecimento: te.series_aquecimento, series: te.series, intervalo_descanso: te.intervalo_descanso,
      tecnica_avancada: te.tecnica_avancada
    })));
  }

  novo._exercicios = [];
  await loadExerciciosDoTreino(novo);
  treinos.push(novo);
  activeIndex = treinos.length - 1;
  renderMontar();
}

async function criarDivisao(n) {
  app.innerHTML = '<div class="sub">Criando divisão…</div>';
  splitId = crypto.randomUUID();
  const rows = [];
  for (let i = 0; i < n; i++) {
    rows.push({
      trainer_id: userId, cliente_id: clienteIdParam || null, nome: 'Treino ' + LETRAS[i],
      dias_semana: [], habilitado: !clienteIdParam, split_id: splitId, ordem: i
    });
  }
  const { data, error } = await supabaseClient.from('treinos').insert(rows).select();
  if (error) {
    app.innerHTML = '<div class="erro">Não foi possível criar: ' + error.message + '</div>';
    return;
  }
  treinos = data.sort((a, b) => a.ordem - b.ordem);
  treinos.forEach(t => t._exercicios = []);
  activeIndex = 0;
  const novaUrl = 'montar-treino.html?split_id=' + splitId + (clienteIdParam ? '&cliente_id=' + clienteIdParam + '&cliente_nome=' + encodeURIComponent(clienteNomeParam || '') : '');
  history.replaceState(null, '', novaUrl);
  renderMontar();
}

async function usarTemplate(template) {
  app.innerHTML = '<div class="sub">Criando a partir do treino predefinido…</div>';
  const novoSplitId = crypto.randomUUID();
  const origem = template.treinos;

  const novasRows = origem.map((t, i) => ({
    trainer_id: userId, cliente_id: clienteIdParam, nome: t.nome,
    dias_semana: t.dias_semana || [], habilitado: false, split_id: novoSplitId, ordem: i
  }));
  const { data: novos, error } = await supabaseClient.from('treinos').insert(novasRows).select();
  if (error) {
    app.innerHTML = '<div class="erro">Não foi possível criar: ' + error.message + '</div>';
    return;
  }
  const novosOrdenados = novos.sort((a, b) => a.ordem - b.ordem);

  for (let i = 0; i < origem.length; i++) {
    const { data: exs } = await supabaseClient.from('treino_exercicios').select('*').eq('treino_id', origem[i].id).order('ordem');
    const lista = exs || [];
    if (!lista.length) continue;
    const grupoMap = {};
    await supabaseClient.from('treino_exercicios').insert(lista.map(te => {
      let novoGrupoId = null;
      if (te.grupo_id) {
        if (!grupoMap[te.grupo_id]) grupoMap[te.grupo_id] = crypto.randomUUID();
        novoGrupoId = grupoMap[te.grupo_id];
      }
      return {
        treino_id: novosOrdenados[i].id, exercicio_id: te.exercicio_id, ordem: te.ordem,
        series_aquecimento: te.series_aquecimento, series: te.series, intervalo_descanso: te.intervalo_descanso,
        tecnica_avancada: te.tecnica_avancada, observacoes: te.observacoes, grupo_id: novoGrupoId
      };
    }));
  }

  treinos = novosOrdenados;
  for (const tr of treinos) await loadExerciciosDoTreino(tr);
  activeIndex = 0;
  splitId = novoSplitId;
  const novaUrl = 'montar-treino.html?split_id=' + splitId + '&cliente_id=' + clienteIdParam + '&cliente_nome=' + encodeURIComponent(clienteNomeParam || '');
  history.replaceState(null, '', novaUrl);
  renderMontar();
}

  if (!clienteId) return;
  const nomeCliente = (clientes.find(c => c.id === clienteId) || {}).nome || clienteNomeParam || 'aluno';

  const box = el('<div style="display:flex;align-items:center;justify-content:space-between;gap:14px;background:#0d1119;border:1px solid #1a2130;border-radius:12px;padding:14px 16px;margin-bottom:20px;"></div>');

    '<div><div style="font-size:13.5px;font-weight:700;">Visível para ' + nomeCliente + '</div>' +
    '<div class="sub" style="margin:2px 0 0;">' + (habilitado ? 'O aluno já vê esse treino no app dele.' : 'Oculto — o aluno não vê esse treino até você habilitar.') + '</div></div>'
  );

function renderAnalise() {
  const todosExs = treinos.flatMap(t => t._exercicios || []);
  if (todosExs.length === 0) { analise.style.display = 'none'; return; }
  analise.style.display = '';
  analise.innerHTML = '';

  analise.appendChild(el('<h1>Análise do plano de treino</h1>'));
  analise.appendChild(el('<p class="sub">Visão geral da divisão inteira.</p>'));

  const contagem = {};
  todosExs.forEach(te => {
    const cat = (te.exercicios || {}).categoria;
    if (!cat) return;
    contagem[cat] = (contagem[cat] || 0) + 1;
  });
  const entradas = Object.entries(contagem).sort((a, b) => b[1] - a[1]);
  const totalCategorizado = entradas.reduce((s, [, n]) => s + n, 0);

  const stats = el('<div class="stat-grid"></div>');
  [
    [treinos.length, 'Treinos'],
    [todosExs.length, 'Exercícios'],
    [entradas.length, 'Agrupamentos'],
    [Math.round(todosExs.length / treinos.length * 10) / 10, 'Exerc. por treino']
  ].forEach(([num, label]) => {
    stats.appendChild(el('<div class="stat-box"><div class="stat-num">' + num + '</div><div class="stat-label">' + label + '</div></div>'));
  });
  analise.appendChild(stats);

  if (entradas.length) {
    analise.appendChild(el('<label>Distribuição por grupamento muscular</label>'));
    const distWrap = el('<div style="margin-bottom:24px;"></div>');
    const max = entradas[0][1];
    entradas.forEach(([cat, n]) => {
      const pct = totalCategorizado ? Math.round(n / totalCategorizado * 100) : 0;
      const row = el(
        '<div class="dist-row">' +
        '<div class="dist-label">' + cat + '</div>' +
        '<div class="dist-bar-track"><div class="dist-bar-fill" style="width:' + (n / max * 100) + '%;"></div></div>' +
        '<div class="dist-count">' + n + ' · ' + pct + '%</div>' +
        '</div>'
      );
      distWrap.appendChild(row);
    });
    analise.appendChild(distWrap);
  }

  const volumePorGrupo = volumeSeriesPorGrupo(treinos);
  const volumeEntradas = Object.entries(volumePorGrupo).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]);
  if (volumeEntradas.length) {
    analise.appendChild(el('<label>Volume de séries válidas por grupamento muscular</label>'));
    analise.appendChild(el('<p class="sub" style="margin-top:-8px;">Séries de aquecimento não entram nessa contagem.</p>'));
    const volWrap = el('<div style="margin-bottom:24px;"></div>');
    const maxVol = volumeEntradas[0][1];
    volumeEntradas.forEach(([cat, n]) => {
      const row = el(
        '<div class="dist-row">' +
        '<div class="dist-label">' + cat + '</div>' +
        '<div class="dist-bar-track"><div class="dist-bar-fill" style="width:' + (n / maxVol * 100) + '%;"></div></div>' +
        '<div class="dist-count">' + n + (n === 1 ? ' série' : ' séries') + '</div>' +
        '</div>'
      );
      volWrap.appendChild(row);
    });
    analise.appendChild(volWrap);
  }

  analise.appendChild(el('<label>Detalhamento por treino — clique pra expandir e ajustar rápido</label>'));
  treinos.forEach(tr => {
    const grupos = gruposMusculares(tr);
    const tags = grupos.length ? grupos.map(([cat, n]) => cat + ' (' + n + ')').join(' · ') : 'sem exercícios categorizados';
    const exs = tr._exercicios || [];
    const isOpen = expandedTreinos.has(tr.id);
    const wrap = el('<div class="detalhe-treino"></div>');
    const head = el(
      '<div class="detalhe-nome"><span>' + (isOpen ? '▾ ' : '▸ ') + tr.nome + '</span>' +
      '<span>' + exs.length + (exs.length === 1 ? ' exercício' : ' exercícios') + '</span></div>'
    );
    head.addEventListener('click', () => {
      if (expandedTreinos.has(tr.id)) expandedTreinos.delete(tr.id); else expandedTreinos.add(tr.id);
      renderAnalise();
    });
    wrap.appendChild(head);
    wrap.appendChild(el('<div class="detalhe-tags">' + tags + '</div>'));

    if (isOpen) {
      if (!exs.length) {
        wrap.appendChild(el('<div class="sub" style="margin:10px 0 0;">Nenhum exercício ainda.</div>'));
      } else {
        exs.forEach(te => wrap.appendChild(renderQuickEditItem(tr, te)));
      }
      const abrirBtn = el('<button type="button" class="btn btn-secondary" style="margin-top:10px;font-size:12px;padding:8px 14px;">Abrir treino completo</button>');
      abrirBtn.addEventListener('click', () => {
        activeIndex = treinos.indexOf(tr);
        formMode = { type: 'add' };
        renderMontar();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
      wrap.appendChild(abrirBtn);
    }

    analise.appendChild(wrap);
  });
}

function renderTreinoBody(treino) {
  const body = el('<div></div>');

  const nomeRow = el('<div style="display:flex;gap:10px;align-items:flex-end;"><div style="flex:1;"></div></div>');
  const nomeLabel = el('<label>Nome do treino</label>');

  nomeInput.addEventListener('change', async (e) => {

    await supabaseClient.from('treinos').update({ nome: treino.nome }).eq('id', treino.id);
    renderMontar();
  });

  nomeRow.firstElementChild.appendChild(nomeInput);
  const duplicarBtn = el('<button type="button" class="btn btn-secondary" style="white-space:nowrap;">⎘ Duplicar treino</button>');
  duplicarBtn.addEventListener('click', () => duplicarTreino(treino));
  nomeRow.appendChild(duplicarBtn);
  body.appendChild(nomeRow);

  const diasLabel = el('<label style="margin-top:16px;">Dias da semana</label>');
  body.appendChild(diasLabel);
  const diasGrid = el('<div class="dias-grid"></div>');
  DIAS.forEach((label, idx) => {
    const sel = (treino.dias_semana || []).includes(idx);
    const b = el('<button type="button" class="dia-btn' + (sel ? ' sel' : '') + '">' + label.slice(0, 3) + (sel ? ' ✓' : '') + '</button>');
    b.addEventListener('click', async () => {
      const cur = new Set(treino.dias_semana || []);
      if (cur.has(idx)) cur.delete(idx); else cur.add(idx);
      treino.dias_semana = Array.from(cur).sort((a, b) => a - b);
      await supabaseClient.from('treinos').update({ dias_semana: treino.dias_semana }).eq('id', treino.id);
      renderMontar();
    });
    diasGrid.appendChild(b);
  });
  body.appendChild(diasGrid);

  const exLabelRow = el('<div style="display:flex;align-items:center;justify-content:space-between;"></div>');
  exLabelRow.appendChild(el('<label style="margin-bottom:0;">Exercícios</label>'));
  const gerenciarTecBtn = el('<button type="button" class="combinar-btn" style="color:#9aa4b2;">Gerenciar técnicas avançadas</button>');
  gerenciarTecBtn.addEventListener('click', () => abrirGerenciarTecnicas(() => renderMontar()));
  exLabelRow.appendChild(gerenciarTecBtn);
  body.appendChild(exLabelRow);

  const grupos = gruposMusculares(treino);
  if (grupos.length) {
    const resumo = el('<div class="sub" style="margin:0 0 10px;"></div>');
    resumo.textContent = grupos.map(([cat, n]) => cat + ' (' + n + ')').join(' · ');
    body.appendChild(resumo);
  }

  if (!treino._exercicios || treino._exercicios.length === 0) {
    body.appendChild(el('<div class="sub" style="margin:0 0 10px;">Nenhum exercício ainda.</div>'));
  } else {
    const list = treino._exercicios;
    const rendered = new Set();

    const apendarComEdicaoInline = (container, m) => {
      container.appendChild(renderExItem(treino, m));
      if (formMode.type === 'edit' && formMode.te.id === m.id) {
        container.appendChild(renderAddExForm(treino));
      }
    };

    list.forEach(te => {
      if (rendered.has(te.id)) return;
      if (te.grupo_id) {
        const membros = list.filter(x => x.grupo_id === te.grupo_id);
        membros.forEach(m => rendered.add(m.id));
        const combo = el('<div class="combo-box"></div>');
        combo.appendChild(el('<div class="combo-label">' + ((tecnicaPorId(te.tecnica_avancada) || {}).nome || 'Combo') + '</div>'));
        membros.forEach(m => apendarComEdicaoInline(combo, m));
        const combinarBtn = el('<button type="button" class="combinar-btn">+ adicionar exercício ao combo</button>');
        combinarBtn.addEventListener('click', () => {
          formMode = { type: 'combo', grupoId: te.grupo_id };
          renderMontar();
        });
        combo.appendChild(combinarBtn);
        body.appendChild(combo);
      } else {
        rendered.add(te.id);
        apendarComEdicaoInline(body, te);
      }
    });
  }

  if (exerciciosLib.length === 0) {
    body.appendChild(el('<div class="sub" style="margin-top:10px;">Você ainda não tem exercícios no acervo. <a href="acervo.html">Crie um primeiro</a> e volte aqui.</div>'));
  } else if (formMode.type !== 'edit') {
    body.appendChild(renderAddExForm(treino));
  }

  app.appendChild(body);
}

async function moverExercicio(treino, te, direcao) {
  const list = treino._exercicios;
  const idx = list.findIndex(x => x.id === te.id);
  const alvo = idx + direcao;
  if (alvo < 0 || alvo >= list.length) return;
  const a = list[idx], b = list[alvo];
  const ordemA = a.ordem, ordemB = b.ordem;
  await Promise.all([
    supabaseClient.from('treino_exercicios').update({ ordem: ordemB }).eq('id', a.id),
    supabaseClient.from('treino_exercicios').update({ ordem: ordemA }).eq('id', b.id)
  ]);
  await loadExerciciosDoTreino(treino);
  renderMontar();
}

function renderAddExForm(treino) {
  const mode = formMode || { type: 'add' };
  const editTe = mode.type === 'edit' ? mode.te : null;
  const isCombo = mode.type === 'combo';

  const form = el('<div class="add-ex-form' + (editTe ? ' add-ex-form-inline' : '') + '"></div>');

  if (isCombo) form.appendChild(el('<div class="sub" style="margin:0;color:#a855f7;">Adicionando exercício combinado…</div>'));
  if (editTe) form.appendChild(el('<div class="sub" style="margin:0;color:#f97316;">Editando exercício…</div>'));

  const selWrap = el('<div><label>Exercício</label></div>');
  const nomeAtual = editTe ? (editTe.exercicios || {}).nome || '' : '';
  const searchWrap = el('<div class="ex-search-wrap"></div>');
  const sel = el('<input placeholder="Digite pra buscar…" autocomplete="off" value="' + nomeAtual.replace(/"/g, '&quot;') + '">');
  const dropdown = el('<div class="ex-search-dropdown" style="display:none;"></div>');
  let exercicioEscolhido = editTe ? exerciciosLib.find(e => e.id === editTe.exercicio_id) || null : null;

  const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

  const fecharDropdown = () => { dropdown.style.display = 'none'; dropdown.innerHTML = ''; };

  const abrirDropdown = () => {
    const q = norm(sel.value.trim());
    const matches = (q ? exerciciosLib.filter(e => norm(e.nome).includes(q)) : exerciciosLib).slice(0, 40);
    dropdown.innerHTML = '';
    if (!matches.length) {
      dropdown.appendChild(el('<div class="ex-search-empty">Nenhum exercício encontrado.</div>'));
    } else {
      matches.forEach(e => {
        const item = el('<div class="ex-search-item">' + e.nome + '</div>');
        item.addEventListener('mousedown', (ev) => {
          ev.preventDefault();
          sel.value = e.nome;
          exercicioEscolhido = e;
          renderVideoPreview();
          fecharDropdown();
        });
        dropdown.appendChild(item);
      });
    }
    dropdown.style.display = 'block';
  };

  const videoPreviewWrap = el('<div style="display:none;"></div>');

  const renderVideoPreview = () => {
    videoPreviewWrap.innerHTML = '';
    if (!exercicioEscolhido) { videoPreviewWrap.style.display = 'none'; return; }
    videoPreviewWrap.style.display = '';
    const url = exercicioEscolhido.video_url;
    if (url) {
      videoPreviewWrap.appendChild(buildVideoEmbedNode(url));
    } else {
      videoPreviewWrap.appendChild(el('<div style="font-size:12px;color:#66707e;">Vídeo não cadastrado</div>'));
    }
  };

  sel.addEventListener('input', () => { exercicioEscolhido = null; renderVideoPreview(); abrirDropdown(); });
  sel.addEventListener('focus', abrirDropdown);
  sel.addEventListener('blur', () => setTimeout(fecharDropdown, 120));

  searchWrap.appendChild(sel);
  searchWrap.appendChild(dropdown);
  selWrap.appendChild(searchWrap);
  form.appendChild(selWrap);
  form.appendChild(videoPreviewWrap);
  renderVideoPreview();
  const exercicioSelecionado = () => {
    if (exercicioEscolhido) return exercicioEscolhido;
    const nome = sel.value.trim().toLowerCase();
    return exerciciosLib.find(e => e.nome.toLowerCase() === nome);
  };

  const seriesAquecWrap = el('<div><label>Séries de aquecimento (opcional)</label></div>');
  const seriesAquecTa = el('<textarea maxlength="250" placeholder="Ex: 15 reps — 20kg (uma série por linha)"></textarea>');
  seriesAquecTa.value = editTe ? (editTe.series_aquecimento || '') : '';
  const seriesAquecCount = el('<div class="counter">' + seriesAquecTa.value.length + '/250</div>');
  seriesAquecTa.addEventListener('input', () => seriesAquecCount.textContent = seriesAquecTa.value.length + '/250');
  seriesAquecWrap.appendChild(seriesAquecTa);
  seriesAquecWrap.appendChild(seriesAquecCount);
  seriesAquecWrap.appendChild(el('<div class="sub" style="margin:4px 0 0;">Não conta no volume de séries por grupamento muscular.</div>'));
  form.appendChild(seriesAquecWrap);

  const seriesWrap = el('<div></div>');
  const seriesLabelRow = el('<div style="display:flex;align-items:center;justify-content:space-between;"></div>');
  seriesLabelRow.appendChild(el('<label style="margin-bottom:0;">Séries válidas</label>'));
  const escolherSerieBtn = el('<button type="button" class="serie-tmpl-link">+ Adicionar série pré-definida</button>');
  seriesLabelRow.appendChild(escolherSerieBtn);
  seriesWrap.appendChild(seriesLabelRow);
  const seriesTa = el('<textarea maxlength="250" placeholder="Ex: 10 reps (uma série por linha)"></textarea>');
  seriesTa.value = editTe ? (editTe.series || '') : '';
  const seriesCount = el('<div class="counter">' + seriesTa.value.length + '/250</div>');
  seriesTa.addEventListener('input', () => seriesCount.textContent = seriesTa.value.length + '/250');
  escolherSerieBtn.addEventListener('click', () => abrirEscolherSerieTemplate({
    onAplicar: (tmpl) => {
      seriesAquecTa.value = formatarSerieTemplatePorTipo(tmpl, 'aquecimento').slice(0, 250);
      seriesAquecCount.textContent = seriesAquecTa.value.length + '/250';
      seriesTa.value = formatarSerieTemplatePorTipo(tmpl, 'valida').slice(0, 250);
      seriesCount.textContent = seriesTa.value.length + '/250';
    }
  }));
  seriesWrap.appendChild(seriesTa);
  seriesWrap.appendChild(seriesCount);
  const salvarComoTemplateBtn = el('<button type="button" class="serie-tmpl-link" style="margin-top:4px;">Salvar como série pré-definida</button>');
  salvarComoTemplateBtn.addEventListener('click', () => abrirModalSalvarSerieRapido({
    linhas: [
      ...parseSeriesTextoParaLinhas(seriesAquecTa.value, 'aquecimento'),
      ...parseSeriesTextoParaLinhas(seriesTa.value, 'valida')
    ]
  }));
  seriesWrap.appendChild(salvarComoTemplateBtn);
  form.appendChild(seriesWrap);

  const cargaWrap = el('<div><label>Carga (opcional)</label></div>');
  const cargaInput = el('<input maxlength="60" placeholder="Ex: 20kg, barra livre, progressivo">');
  cargaInput.value = editTe ? (editTe.carga || '') : '';
  cargaWrap.appendChild(cargaInput);
  form.appendChild(cargaWrap);

  const descansoWrap = el('<div><label>Intervalo de descanso</label></div>');
  const descansoTa = el('<textarea maxlength="50" placeholder="Ex: 60s, 1-2min, 90 segundos"></textarea>');
  descansoTa.value = editTe ? (editTe.intervalo_descanso || '') : '';
  const descansoCount = el('<div class="counter">' + descansoTa.value.length + '/50</div>');
  descansoTa.addEventListener('input', () => descansoCount.textContent = descansoTa.value.length + '/50');
  descansoWrap.appendChild(descansoTa);
  descansoWrap.appendChild(descansoCount);
  form.appendChild(descansoWrap);

  const tecWrap = el('<div><label>Técnica avançada</label></div>');
  const tecSel = el('<select></select>');
  const tecObsWrap = el('<div style="display:none;"></div>');
  const tecObsLabel = el('<label style="margin-top:10px;display:block;">Como realizar esta técnica? (edite se, nesta prescrição, for diferente do padrão)</label>');
  const tecObsTa = el('<textarea maxlength="500" placeholder="Ex: realizar a série até a falha, reduzir a carga em 20% e continuar até a falha novamente…"></textarea>');
  tecObsWrap.appendChild(tecObsLabel);
  tecObsWrap.appendChild(tecObsTa);

  const NOVA_TECNICA_VALUE = '__nova__';

  const popularTecSel = (valorSelecionado) => {
    tecSel.innerHTML = '';
    tecSel.appendChild(el('<option value="nenhuma">Nenhuma técnica avançada</option>'));
    tecnicasLib.forEach(t => {
      const opt = el('<option></option>');
      opt.value = t.id;
      opt.textContent = t.nome;
      tecSel.appendChild(opt);
    });
    tecSel.appendChild(el('<option value="' + NOVA_TECNICA_VALUE + '">+ Criar nova técnica</option>'));
    tecSel.value = valorSelecionado;
    if (tecSel.value !== valorSelecionado) tecSel.value = 'nenhuma';
  };

  // Ao trocar de técnica, a caixa de instruções é reiniciada com o padrão
  // daquela técnica (o trainer pode editar livremente a partir daí). Só na
  // carga inicial de um exercício já salvo é que usamos o texto específico
  // já gravado nesta prescrição (editTe.tecnica_instrucoes), se houver.
  const atualizarObsBox = (usarInstrucoesSalvas) => {
    const t = tecnicaPorId(tecSel.value);
    if (!t) { tecObsWrap.style.display = 'none'; tecObsTa.value = ''; return; }
    tecObsWrap.style.display = '';
    if (usarInstrucoesSalvas && editTe && editTe.tecnica_instrucoes) {
      tecObsTa.value = editTe.tecnica_instrucoes;
    } else {
      tecObsTa.value = t.observacao || '';
    }
  };

  const isComboDefault = () => {
    const biSet = tecnicasLib.find(t => t.nome === 'Bi-set');
    return biSet ? biSet.id : 'nenhuma';
  };

  popularTecSel(editTe ? (editTe.tecnica_avancada || 'nenhuma') : (isCombo ? isComboDefault() : 'nenhuma'));
  atualizarObsBox(true);

  tecSel.addEventListener('change', () => {
    if (tecSel.value === NOVA_TECNICA_VALUE) {
      const valorAnterior = 'nenhuma';
      abrirModalTecnica({
        tecnica: null,
        onSaved: (nova) => { popularTecSel(nova.id); atualizarObsBox(false); }
      });
      tecSel.value = valorAnterior;
      return;
    }
    atualizarObsBox(false);
  });

  tecWrap.appendChild(tecSel);
  form.appendChild(tecWrap);
  form.appendChild(tecObsWrap);

  const obsWrap = el('<div><label>Observações (opcional)</label></div>');
  const obsTa = el('<textarea maxlength="250" placeholder="Ex: cuidado com o joelho, ajustar banco no nível 4…"></textarea>');
  obsTa.value = editTe ? (editTe.observacoes || '') : '';
  obsWrap.appendChild(obsTa);
  form.appendChild(obsWrap);

  const erro = el('<div class="erro" style="display:none;"></div>');
  form.appendChild(erro);

  const btnRow = el('<div style="display:flex;gap:10px;"></div>');
  const submitLabel = editTe ? 'Salvar alterações' : (isCombo ? 'Adicionar ao combo' : 'Adicionar exercício');
  const addBtn = el('<button type="button" class="btn btn-primary" style="flex:1;">' + submitLabel + '</button>');
  addBtn.addEventListener('click', async () => {
    const escolhido = exercicioSelecionado();
    if (!escolhido) {
      erro.textContent = 'Escolha um exercício da lista.';
      erro.style.display = '';
      return;
    }
    erro.style.display = 'none';
    addBtn.disabled = true;
    addBtn.textContent = 'Salvando…';

    const payload = {
      exercicio_id: escolhido.id,
      series_aquecimento: seriesAquecTa.value.trim() || null,
      series: seriesTa.value.trim() || null,
      carga: cargaInput.value.trim() || null,
      intervalo_descanso: descansoTa.value.trim() || null,
      tecnica_avancada: tecSel.value,
      tecnica_instrucoes: tecSel.value === 'nenhuma' ? null : (tecObsTa.value.trim() || null),
      observacoes: obsTa.value.trim() || null
    };

    let error;
    if (editTe) {
      ({ error } = await supabaseClient.from('treino_exercicios').update(payload).eq('id', editTe.id));
    } else if (isCombo) {
      if (mode.anchorTe) {
        const tecAnchor = mode.anchorTe.tecnica_avancada === 'nenhuma' ? tecSel.value : mode.anchorTe.tecnica_avancada;
        await supabaseClient.from('treino_exercicios').update({ grupo_id: mode.grupoId, tecnica_avancada: tecAnchor }).eq('id', mode.anchorTe.id);
      }
      payload.treino_id = treino.id;
      payload.ordem = (treino._exercicios || []).length;
      payload.grupo_id = mode.grupoId;
      ({ error } = await supabaseClient.from('treino_exercicios').insert(payload));
    } else {
      payload.treino_id = treino.id;
      payload.ordem = (treino._exercicios || []).length;
      ({ error } = await supabaseClient.from('treino_exercicios').insert(payload));
    }

    if (error) {
      erro.textContent = error.message;
      erro.style.display = '';
      addBtn.disabled = false;
      addBtn.textContent = submitLabel;
      return;
    }
    formMode = { type: 'add' };
    await loadExerciciosDoTreino(treino);
    renderMontar();
  });
  btnRow.appendChild(addBtn);

  if (editTe || isCombo) {
    const cancelBtn = el('<button type="button" class="btn btn-secondary">Cancelar</button>');
    cancelBtn.addEventListener('click', () => { formMode = { type: 'add' }; renderMontar(); });
    btnRow.appendChild(cancelBtn);
  }

  form.appendChild(btnRow);

  return form;
}

function renderAplicarBox(box) {
  box.innerHTML = '';
  box.appendChild(el('<div style="font-size:14px;font-weight:800;margin-bottom:4px;">Aplicar essa divisão a um aluno</div>'));

  const jaAplicado = treinos[0] && treinos[0].cliente_id;
  if (jaAplicado) {
    const cliente = clientes.find(c => c.id === treinos[0].cliente_id);
    box.appendChild(el('<div class="ok">Aplicado a ' + (cliente ? cliente.nome : 'um aluno') + '. O aluno já vê esses treinos no app dele.</div>'));
    return;
  }

  if (clientes.length === 0) {
    box.appendChild(el('<div class="sub" style="margin:0;">Você ainda não tem alunos cadastrados. <a href="alunos.html">Convide um aluno</a> primeiro.</div>'));
    return;
  }

  const row = el('<div style="display:flex;gap:10px;margin-top:12px;"></div>');
  const sel = el('<select style="flex:1;"><option value="">Escolha o aluno…</option></select>');
  clientes.forEach(c => sel.appendChild(el('<option value="' + c.id + '">' + c.nome + '</option>')));
  const btn = el('<button type="button" class="btn btn-primary">Enviar pro aluno</button>');
  const erro = el('<div class="erro" style="display:none;"></div>');

  btn.addEventListener('click', async () => {
    if (!sel.value) {
      erro.textContent = 'Escolha um aluno.';
      erro.style.display = '';
      return;
    }
    erro.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Enviando…';
    const { error } = await supabaseClient.from('treinos').update({ cliente_id: sel.value, habilitado: true }).eq('split_id', splitId);
    if (error) {
      erro.textContent = error.message;
      erro.style.display = '';
      btn.disabled = false;
      btn.textContent = 'Enviar pro aluno';
      return;
    }
    treinos.forEach(t => t.cliente_id = sel.value);
    renderMontar();
  });

  row.appendChild(sel);
  row.appendChild(btn);
  box.appendChild(row);
  box.appendChild(erro);
}

init();
</script>
</body>
</html>
