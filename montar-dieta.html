<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Montar dieta — Elo Fitness</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/food-measures.js"></script>
<style>
html,body{margin:0;padding:0;background:#0a0d13;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e5e9f0;}
*{box-sizing:border-box;}
a{color:#f97316;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}::-webkit-scrollbar-thumb{background:#1e2633;border-radius:4px;}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid #171d29;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-badge{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#f97316,#ea580c);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:16px;}
.logo-text{font-size:17px;font-weight:800;}
.logo-text span{color:#f97316;}
.voltar{font-size:13px;font-weight:700;color:#9aa4b2;}
.voltar:hover{color:#e5e9f0;}

.wrap{max-width:760px;margin:0 auto;padding:32px 20px 120px;}
.card{background:#10151f;border:1px solid #1a2130;border-radius:16px;padding:28px;}
h1{font-size:20px;font-weight:800;margin:0 0 6px;}
.sub{font-size:13.5px;color:#9aa4b2;margin:0 0 24px;}

label{font-size:12px;font-weight:700;color:#9aa4b2;display:block;margin-bottom:6px;}
input,select,textarea{width:100%;background:#0d1119;border:1px solid #1e2633;border-radius:9px;padding:10px 13px;color:#e5e9f0;font-size:13.5px;outline:none;}
.field{margin-bottom:14px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}

.chip-row{display:flex;gap:6px;flex-wrap:wrap;}
.chip{background:#131a26;border:1px solid #1e2633;color:#9aa4b2;font-size:12px;font-weight:700;padding:8px 13px;border-radius:8px;}
.chip.sel{background:rgba(249,115,22,.1);border-color:rgba(249,115,22,.4);color:#f97316;}

.meal{background:#0d1119;border:1px solid #1a2130;border-radius:14px;padding:18px 20px;margin-bottom:14px;}
.meal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.meal-nome{font-size:15px;font-weight:800;}
.meal-remove{background:none;border:none;color:#66707e;font-size:12px;font-weight:700;}
.meal-remove:hover{color:#f87171;}
.add-meal-btn{width:100%;background:none;border:1px dashed #1e2633;color:#66707e;font-size:12.5px;font-weight:700;padding:12px;border-radius:12px;margin-bottom:14px;}
.add-meal-btn:hover{border-color:rgba(249,115,22,.4);color:#f97316;}

.opcao{background:#131a26;border:1px solid #1e2633;border-radius:10px;padding:12px 14px;margin-bottom:10px;}
.opcao:last-child{margin-bottom:0;}
/* Opção 2+ : levemente menor e recuada, só pra sugerir "alternativa" sem prejudicar leitura. */
.opcao-alt{margin-left:16px;}
.opcao-alt .opcao-nome{font-size:11.5px;}
.opcao-alt .item-nome{font-size:12px;}
.opcao-alt .item-qtd{font-size:11px;}
.opcao-alt .item-macros{font-size:10.5px;}
.opcao-alt .item-sub-btn{font-size:10px;padding:3px 8px;}
.opcao-alt .totais-row .t{font-size:10.5px;}
.opcao-alt .totais-row .t b{font-size:12px;}
.opcao-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.opcao-nome{font-size:12.5px;font-weight:800;color:#f97316;text-transform:uppercase;letter-spacing:.03em;}
.opcao-remove{background:none;border:none;color:#4a5364;font-size:11.5px;font-weight:700;}
.opcao-remove:hover{color:#f87171;}

.item-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #1a2130;}
.item-row:last-of-type{border-bottom:none;}
.item-nome{font-size:13px;font-weight:600;}
.item-qtd{font-size:11.5px;color:#66707e;margin-top:1px;}
.item-macros{font-size:11px;color:#66707e;text-align:right;white-space:nowrap;}
.item-remove{background:none;border:none;color:#4a5364;font-size:14px;padding:2px 6px;line-height:1;}
.item-remove:hover{color:#f87171;}
.item-edit{background:none;border:none;color:#4a5364;font-size:13px;padding:2px 6px;line-height:1;cursor:pointer;}
.item-edit:hover{color:#f97316;}
.item-sub-btn{background:none;border:1px solid #1e2633;color:#9aa4b2;font-family:inherit;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:7px;cursor:pointer;flex-shrink:0;}
.item-sub-btn:hover{color:#f97316;border-color:rgba(249,115,22,.3);}

.add-item-row{display:flex;gap:8px;margin-top:10px;}
.add-item-row input:first-child{flex:1;}
.add-item-row input:nth-child(2){width:80px;flex:0 0 80px;}
.add-item-btn{flex:0 0 auto;background:#1e2633;border:none;color:#e5e9f0;font-size:12.5px;font-weight:700;padding:0 14px;border-radius:8px;}
.add-item-btn:hover{background:#2a3444;}

.add-opcao-btn{background:none;border:none;color:#66707e;font-size:12px;font-weight:700;padding:4px 0;margin-top:6px;}
.add-opcao-btn:hover{color:#f97316;}

.totais-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed #2a3444;}
.totais-row .t{font-size:11px;color:#66707e;}
.totais-row .t b{color:#e5e9f0;font-size:12.5px;}

.daily-card{position:sticky;bottom:16px;background:#10151f;border:1px solid rgba(249,115,22,.35);border-radius:14px;padding:16px 20px;margin-top:20px;box-shadow:0 8px 28px rgba(0,0,0,.35);}
.daily-title{font-size:12px;font-weight:800;color:#f97316;text-transform:uppercase;letter-spacing:.03em;margin-bottom:10px;}
.daily-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.daily-num{font-size:17px;font-weight:800;}
.daily-label{font-size:10.5px;color:#66707e;margin-top:2px;}

.btn{border:none;border-radius:10px;padding:11px 18px;font-size:13.5px;font-weight:700;cursor:pointer;}
.btn-primary{background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;}
.btn-secondary{background:#1e2633;color:#e5e9f0;}
.btn:disabled{opacity:.55;cursor:default;}
.btn-block{width:100%;}
.erro{color:#f87171;font-size:12.5px;margin-top:8px;}

.add-item-btn2{width:100%;background:none;border:1px dashed #2a3444;color:#66707e;font-size:12.5px;font-weight:700;padding:10px;border-radius:9px;margin-top:8px;}
.add-item-btn2:hover{border-color:rgba(249,115,22,.4);color:#f97316;}

.fp-overlay{position:fixed;inset:0;background:rgba(6,8,12,.7);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:200;overflow-y:auto;}
.fp-modal{background:#10151f;border:1px solid #1a2130;border-radius:16px;padding:22px;width:100%;max-width:480px;max-height:88vh;display:flex;flex-direction:column;}
.fp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.fp-title{font-size:15.5px;font-weight:800;}
.fp-close{width:28px;height:28px;background:#131a26;border:1px solid #1e2633;border-radius:8px;color:#9aa4b2;cursor:pointer;font-size:14px;line-height:1;}
.fp-search{width:100%;background:#0d1119;border:1px solid #1e2633;border-radius:9px;padding:11px 14px;color:#e5e9f0;font-size:13.5px;outline:none;}
.fp-body{overflow-y:auto;margin-top:12px;flex:1;}
.fp-section-label{font-size:11px;font-weight:800;color:#66707e;text-transform:uppercase;letter-spacing:.04em;margin:14px 0 8px;}
.fp-section-label:first-child{margin-top:0;}
.fp-result{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#131a26;border:1px solid #1e2633;border-radius:10px;padding:10px 12px;margin-bottom:7px;cursor:pointer;}
.fp-result:hover{border-color:rgba(249,115,22,.4);}
.fp-result-nome{font-size:13px;font-weight:700;}
.fp-result-sub{font-size:11px;color:#66707e;margin-top:2px;}
.fp-star{background:none;border:none;font-size:15px;cursor:pointer;color:#4a5364;flex-shrink:0;padding:2px 4px;}
.fp-star.on{color:#f5b942;}
.fp-empty{font-size:12.5px;color:#66707e;text-align:center;padding:24px 8px;}
.fp-warning{font-size:11.5px;color:#f5b942;background:rgba(245,185,66,.1);border:1px solid rgba(245,185,66,.3);border-radius:8px;padding:8px 11px;margin-bottom:10px;}
.fp-link-btn{background:none;border:none;color:#66707e;font-size:12px;font-weight:700;padding:6px 0;cursor:pointer;}
.fp-link-btn:hover{color:#f97316;}
.fp-qty-row{display:flex;gap:8px;margin-top:14px;}
.fp-qty-row input[type=number]{flex:0 0 90px;}
.fp-qty-row select{flex:1;}
.fp-macros-preview{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px dashed #2a3444;}
.fp-macros-preview .t{font-size:11px;color:#66707e;}
.fp-macros-preview .t b{color:#e5e9f0;font-size:12.5px;}
.fp-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.toggle-switch{width:44px;height:26px;border-radius:999px;background:#1e2633;border:none;position:relative;flex-shrink:0;padding:0;}
.toggle-switch.on{background:#f97316;}
.toggle-knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;}
.toggle-switch.on .toggle-knob{left:21px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-badge">E</div>
    <div class="logo-text">Elo <span>Fitness</span></div>
  </div>
  <a class="voltar" id="voltar-link" href="acervo.html">← Voltar pro acervo</a>
</div>

<div class="wrap">
  <div class="card" id="app">Carregando…</div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const dietaIdParam = params.get('dieta_id');
const clienteIdParam = params.get('cliente_id');
const clienteNomeParam = params.get('cliente_nome');
const app = document.getElementById('app');

const MEAL_DEFS = [
  { key: 'cafe', nome: 'Café da manhã', opcional: false },
  { key: 'lanche_manha', nome: 'Lanche da manhã', opcional: true },
  { key: 'almoco', nome: 'Almoço', opcional: false },
  { key: 'lanche_tarde', nome: 'Lanche da tarde', opcional: true },
  { key: 'jantar', nome: 'Jantar', opcional: false },
  { key: 'ceia', nome: 'Ceia', opcional: true }
];

const NIVEL_ATIVIDADE_OPCOES = [
  { key: 'sedentario', fator: 1.20 },
  { key: 'leve', fator: 1.375 },
  { key: 'moderado', fator: 1.55 },
  { key: 'muito_ativo', fator: 1.725 },
  { key: 'extremo', fator: 1.90 }
];

const OBJETIVO_CALORICO_OPCOES = [
  { key: 'emagrecer', percentual: 0.85 },
  { key: 'emagrecer_agressivo', percentual: 0.70 },
  { key: 'manter', percentual: 1.00 },
  { key: 'ganho_seco', percentual: 1.07 },
  { key: 'ganho_agressivo', percentual: 1.15 }
];

function calcularTMB(sexo, pesoKg, alturaCm, idade) {
  const base = 10 * pesoKg + 6.25 * alturaCm - 5 * idade;
  return sexo === 'M' ? base + 5 : base - 161;
}

let userId = null;
let clientes = [];
let dietaId = dietaIdParam || null;
let dietaNome = '';
let dietaMeta = '';
let dietaClienteId = clienteIdParam || '';
let dietaHabilitado = true;
let refeicoes = {}; // key -> { nome, opcoes: [{ nome, itens: [] }] }
let salvando = false;
let erroMsg = '';
let metaEnergetica = null; // { tmb, get, meta }

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function round1(n) { return Math.round(n * 10) / 10; }

function normalizarSemAcento(s) { return (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }

function novaRefeicao(nome) {
  return { nome, opcoes: [{ nome: 'Opção 1', itens: [] }] };
}

async function init() {
  if (clienteIdParam) {
    const link = document.getElementById('voltar-link');
    link.href = 'aluno-detalhe.html?cliente_id=' + clienteIdParam + (clienteNomeParam ? '&cliente_nome=' + encodeURIComponent(clienteNomeParam) : '');
    link.textContent = '← Voltar pro aluno';
  }

  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) return;
  userId = user.id;

  const [clsRes, anamneseRes] = await Promise.all([
    supabaseClient.from('clientes').select('id, nome').eq('trainer_id', userId).order('nome'),
    clienteIdParam ? supabaseClient.from('anamnese_respostas').select('*').eq('cliente_id', clienteIdParam).maybeSingle() : Promise.resolve({ data: null })
  ]);
  clientes = clsRes.data || [];

  const anamnese = anamneseRes.data;
  if (anamnese && anamnese.sexo && anamnese.peso_kg && anamnese.altura_cm && anamnese.idade) {
    const nivelSel = NIVEL_ATIVIDADE_OPCOES.find(o => o.key === anamnese.nivel_atividade);
    const objSel = OBJETIVO_CALORICO_OPCOES.find(o => o.key === anamnese.objetivo_calorico);
    const tmb = calcularTMB(anamnese.sexo, anamnese.peso_kg, anamnese.altura_cm, anamnese.idade);
    const get = nivelSel ? tmb * nivelSel.fator : null;
    const meta = get != null && objSel ? get * objSel.percentual : null;
    metaEnergetica = { tmb, get, meta };
  }

  if (dietaId) {
    const { data: dieta } = await supabaseClient.from('dietas').select('*').eq('id', dietaId).single();
    if (dieta) {
      dietaNome = dieta.nome || '';
      dietaMeta = dieta.meta_calorica || '';
      dietaClienteId = dieta.cliente_id || '';
      dietaHabilitado = dieta.habilitado !== false;
      (dieta.refeicoes || []).forEach(r => {
        const def = MEAL_DEFS.find(m => m.nome === r.nome);
        const key = def ? def.key : r.nome;
        refeicoes[key] = { nome: r.nome, opcoes: (r.opcoes && r.opcoes.length) ? r.opcoes : [{ nome: 'Opção 1', itens: [] }] };
      });
    }
  }

  MEAL_DEFS.forEach(def => {
    if (!def.opcional && !refeicoes[def.key]) refeicoes[def.key] = novaRefeicao(def.nome);
  });

  render();
}

// `food` aqui é um NormalizedFood (ver supabase/functions/_shared/food/types.ts)
// vindo da busca; `quantidade`/`unidade` é o que o nutricionista escolheu na
// tela (Partes 15-19). O item salvo mantém o formato antigo (nome,
// quantidade_g, kcal, proteina_g, carboidrato_g, gordura_g, fibra_g) —
// dietas antigas continuam lendo normalmente — e ganha campos novos e
// opcionais só pra exibição/auditoria (não usados em nenhum recálculo).
function buildItemFromFood(food, quantidade, unidade) {
  const nutrientes = computeNutrients(food, quantidade, unidade);
  if (!nutrientes) return null;
  const grams = toGrams(food, quantidade, unidade);
  return {
    nome: food.brandName ? (food.nome + ' — ' + food.brandName) : food.nome,
    // Fallback pra não perder a quantidade em display quando não há
    // conversão pra grama (ex.: líquido em ml sem densidade conhecida).
    quantidade_g: grams != null ? grams : quantidade,
    kcal: nutrientes.kcal,
    proteina_g: nutrientes.proteinaG,
    carboidrato_g: nutrientes.carboidratoG,
    gordura_g: nutrientes.gorduraG,
    fibra_g: nutrientes.fibraG,
    sodio_mg: nutrientes.sodioMg,
    quantidade: quantidade,
    unidade: unidade,
    food_source: food.source,
    food_source_id: food.sourceId || food.alimentoId || null
  };
}

function somaItens(itens) {
  return itens.reduce((acc, it) => {
    acc.kcal += it.kcal || 0; acc.proteina_g += it.proteina_g || 0;
    acc.carboidrato_g += it.carboidrato_g || 0; acc.gordura_g += it.gordura_g || 0;
    acc.fibra_g += it.fibra_g || 0;
    return acc;
  }, { kcal: 0, proteina_g: 0, carboidrato_g: 0, gordura_g: 0, fibra_g: 0 });
}

function somaDiaria() {
  const total = { kcal: 0, proteina_g: 0, carboidrato_g: 0, gordura_g: 0, fibra_g: 0 };
  MEAL_DEFS.forEach(def => {
    const r = refeicoes[def.key];
    if (!r || !r.opcoes.length) return;
    const s = somaItens(r.opcoes[0].itens);
    total.kcal += s.kcal; total.proteina_g += s.proteina_g;
    total.carboidrato_g += s.carboidrato_g; total.gordura_g += s.gordura_g; total.fibra_g += s.fibra_g;
  });
  return total;
}

function render() {
  app.innerHTML = '';

  const h = el('<div></div>');
  const hTop = el('<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;"></div>');
  hTop.appendChild(el('<h1>' + (dietaId ? 'Editar dieta' : 'Criar nova dieta') + '</h1>'));
  if (metaEnergetica) {
    const box = el('<div style="text-align:right;flex-shrink:0;"></div>');
    box.appendChild(el(
      '<div style="font-size:11px;font-weight:700;color:#66707e;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px;">TMB · GET · Meta calórica</div>'
    ));
    box.appendChild(el(
      '<div style="font-size:13.5px;font-weight:700;color:#f97316;white-space:nowrap;">' +
      Math.round(metaEnergetica.tmb) + ' kcal' +
      (metaEnergetica.get != null ? ' · ' + Math.round(metaEnergetica.get) + ' kcal' : '') +
      (metaEnergetica.meta != null ? ' · ' + Math.round(metaEnergetica.meta) + ' kcal' : '') +
      '</div>'
    ));
    hTop.appendChild(box);
  }
  h.appendChild(hTop);
  h.appendChild(el('<div class="sub">Busque o alimento, escolha a quantidade em g, ml, unidade ou medida caseira e os macros são calculados automaticamente.</div>'));
  app.appendChild(h);

  if (dietaClienteId) {
    const nomeCliente = (clientes.find(c => c.id === dietaClienteId) || {}).nome || clienteNomeParam || 'aluno';
    const box = el('<div style="display:flex;align-items:center;justify-content:space-between;gap:14px;background:#0d1119;border:1px solid #1a2130;border-radius:12px;padding:14px 16px;margin-bottom:20px;"></div>');
    box.appendChild(el(
      '<div><div style="font-size:13.5px;font-weight:700;">Visível para ' + nomeCliente + '</div>' +
      '<div class="sub" style="margin:2px 0 0;">' + (dietaHabilitado ? 'O aluno já vê essa dieta no app dele.' : 'Oculta — o aluno não vê essa dieta até você habilitar.') + '</div></div>'
    ));
    const toggleBtn = el('<button type="button" class="toggle-switch' + (dietaHabilitado ? ' on' : '') + '"><span class="toggle-knob"></span></button>');
    toggleBtn.addEventListener('click', async () => {
      dietaHabilitado = !dietaHabilitado;
      if (dietaId) {
        toggleBtn.disabled = true;
        await supabaseClient.from('dietas').update({ habilitado: dietaHabilitado }).eq('id', dietaId);
      }
      render();
    });
    box.appendChild(toggleBtn);
    app.appendChild(box);
  }

  const fieldRow = el('<div class="field-row"></div>');
  const nomeField = el('<div class="field"></div>');
  nomeField.appendChild(el('<label>Nome da dieta</label>'));
  const nomeInput = el('<input placeholder="Ex: Hipertrofia 2.800 kcal">');
  nomeInput.value = dietaNome;
  nomeInput.addEventListener('input', () => dietaNome = nomeInput.value);
  nomeField.appendChild(nomeInput);
  const metaField = el('<div class="field"></div>');
  metaField.appendChild(el('<label>Meta calórica / macros (opcional)</label>'));
  const metaInput = el('<input placeholder="Ex: 2.800 kcal · 180g PTN">');
  metaInput.value = dietaMeta;
  metaInput.addEventListener('input', () => dietaMeta = metaInput.value);
  metaField.appendChild(metaInput);
  fieldRow.appendChild(nomeField); fieldRow.appendChild(metaField);
  app.appendChild(fieldRow);

  if (!clienteIdParam) {
    const alunoField = el('<div class="field"></div>');
    alunoField.appendChild(el('<label>Aluno (opcional — sem escolher, fica como modelo na sua biblioteca)</label>'));
    const chipRow = el('<div class="chip-row"></div>');
    const semAluno = el('<button type="button" class="chip' + (!dietaClienteId ? ' sel' : '') + '">Sem aluno (modelo)</button>');
    semAluno.addEventListener('click', () => { dietaClienteId = ''; render(); });
    chipRow.appendChild(semAluno);
    clientes.forEach(c => {
      const chip = el('<button type="button" class="chip' + (dietaClienteId === c.id ? ' sel' : '') + '">' + c.nome + '</button>');
      chip.addEventListener('click', () => { dietaClienteId = c.id; render(); });
      chipRow.appendChild(chip);
    });
    alunoField.appendChild(chipRow);
    app.appendChild(alunoField);
  }

  MEAL_DEFS.forEach(def => renderMeal(def));

  const addMealRow = el('<div style="display:flex;gap:8px;flex-wrap:wrap;"></div>');
  MEAL_DEFS.filter(def => def.opcional && !refeicoes[def.key]).forEach(def => {

  const daily = somaDiaria();

  const dailyGrid = el('<div class="daily-grid"></div>');
  [
    ['kcal', 'Kcal', daily.kcal],

function renderMeal(def) {
  const r = refeicoes[def.key];
  if (!r) return;

  const meal = el('<div class="meal"></div>');
  const head = el('<div class="meal-head"></div>');
  head.appendChild(el('<div class="meal-nome">' + r.nome + '</div>'));
  if (def.opcional) {
    const rm = el('<button type="button" class="meal-remove">Remover refeição</button>');
    rm.addEventListener('click', () => { delete refeicoes[def.key]; render(); });
    head.appendChild(rm);
  }
  meal.appendChild(head);

  r.opcoes.forEach((opcao, oi) => meal.appendChild(renderOpcao(def.key, r, opcao, oi)));

  const addOpcaoBtn = el('<button type="button" class="add-opcao-btn">+ Adicionar opção (' + (r.opcoes.length + 1) + ')</button>');
  addOpcaoBtn.addEventListener('click', () => {
    r.opcoes.push({ nome: 'Opção ' + (r.opcoes.length + 1), itens: [] });
    render();
  });

  app.appendChild(meal);
}

function renderOpcao(mealKey, refeicao, opcao, oi) {
  const box = el('<div class="opcao' + (oi > 0 ? ' opcao-alt' : '') + '"></div>');

  }

  opcao.itens.forEach((it, ii) => {
    const row = el('<div class="item-row"></div>');
    const left = el('<div></div>');
    left.appendChild(el('<div class="item-nome">' + it.nome + '</div>'));
    const qtdLabel = (it.quantidade != null && it.unidade)
      ? it.quantidade + ' ' + foodMeasureLabel(it.unidade) + (it.unidade !== 'g' && it.unidade !== 'ml' && it.quantidade_g != null ? ' (' + it.quantidade_g + 'g)' : '')

    const subCount = (it.substituiveis || []).length;
    const subBtn = el('<button type="button" class="item-sub-btn" title="Alimentos substitutos equivalentes">Substituíveis' + (subCount ? ' (' + subCount + ')' : '') + '</button>');
    subBtn.addEventListener('click', () => abrirGerenciarSubstituiveis(it, render));
    right.appendChild(subBtn);
    const editBtn = el('<button type="button" class="item-edit" title="Editar quantidade">✎</button>');
    editBtn.addEventListener('click', () => abrirEditarItem(opcao, ii, render));
    right.appendChild(editBtn);
    const rmBtn = el('<button type="button" class="item-remove">×</button>');
    rmBtn.addEventListener('click', () => { opcao.itens.splice(ii, 1); render(); });
    right.appendChild(rmBtn);
    row.appendChild(right);
    box.appendChild(row);

    if (it.substituiveis && it.substituiveis.length) {
      const subList = el('<div style="margin:2px 0 6px 0;padding-left:4px;border-left:2px solid #1e2633;"></div>');
      it.substituiveis.forEach((s, si) => {
        const subRow = el('<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:3px 0 3px 10px;"></div>');
        const subQtdLabel = (s.quantidade != null && s.unidade)
          ? s.quantidade + ' ' + foodMeasureLabel(s.unidade)
          : s.quantidade_g + 'g';
        subRow.appendChild(el('<span style="font-size:11.5px;color:#9aa4b2;">↳ ' + s.nome + ' — ' + subQtdLabel + ' · ' + s.kcal + ' kcal</span>'));
        const subRmBtn = el('<button type="button" class="item-remove" style="font-size:11px;">×</button>');
        subRmBtn.addEventListener('click', () => { it.substituiveis.splice(si, 1); render(); });
        subRow.appendChild(subRmBtn);
        subList.appendChild(subRow);
      });
      box.appendChild(subList);
    }
  });

  const addBtn2 = el('<button type="button" class="add-item-btn2">+ Adicionar alimento</button>');
  addBtn2.addEventListener('click', () => abrirFoodPicker(opcao, render));
  box.appendChild(addBtn2);

  if (opcao.itens.length) {
    const s = somaItens(opcao.itens);
    const totRow = el('<div class="totais-row"></div>');
    [['Kcal', s.kcal], ['Proteínas', s.proteina_g], ['Carboidratos', s.carboidrato_g], ['Gorduras', s.gordura_g], ['Fibras', s.fibra_g]].forEach(([label, val]) => {
      const t = el('<div class="t">' + label + ': <b>' + round1(val) + (label === 'Kcal' ? '' : 'g') + '</b></div>');
      totRow.appendChild(t);
    });
    box.appendChild(totRow);
  }

  return box;
}

async function salvarDieta() {
  if (!dietaNome.trim()) { erroMsg = 'Dê um nome pra dieta.'; render(); return; }

  const refeicoesArr = MEAL_DEFS
    .filter(def => refeicoes[def.key])
    .map(def => ({
      nome: refeicoes[def.key].nome,
      opcoes: refeicoes[def.key].opcoes.map(o => ({ nome: o.nome, itens: o.itens }))
    }));

  const payload = {
    nome: dietaNome.trim(),
    cliente_id: dietaClienteId || null,
    meta_calorica: dietaMeta.trim() || null,
    refeicoes: refeicoesArr,
    habilitado: dietaHabilitado
  };

  let error, saved;
  if (dietaId) {
    ({ error } = await supabaseClient.from('dietas').update(payload).eq('id', dietaId));
    saved = { id: dietaId };
  } else {
    ({ data: saved, error } = await supabaseClient.from('dietas').insert({ ...payload, trainer_id: userId }).select().single());
  }

  if (error) { salvando = false; erroMsg = error.message; render(); return; }

  if (clienteIdParam) {

  }
}

async function fpFetchSearch(q) {
  try {
    const { data, error } = await supabaseClient.functions.invoke('food-search', { body: { q } });
    if (error) throw error;
    return { results: (data && data.results) || [], warning: (data && data.warnings && data.warnings[0]) || null };
  } catch (err) {
    // Parte 24: se a Edge Function estiver fora do ar (não só a FatSecret),
    // a base própria do app (cadastros do treinador + biblioteca padrão)
    // continua pesquisável direto via RLS, sem depender de nada externo.
    // Busca por PALAVRAS (não frase inteira) — mesmo motivo do backend:
    // "Pão, trigo, francês" não bate com ILIKE %pão francês% de uma vez só.
    const palavras = normalizarSemAcento(q.replace(/,/g, ' ')).split(/\s+/).filter(Boolean);
    if (!palavras.length) return { results: [], warning: 'edge_function_unavailable' };
    const orAlimentos = palavras.map((w) => 'nome.ilike.%' + w + '%,brand_name.ilike.%' + w + '%').join(',');
    const orTaco = palavras.map((w) => 'nome.ilike.%' + w + '%').join(',');
    const [ownRes, tacoRes] = await Promise.all([
      supabaseClient
        .from('alimentos')
        .select('id, nome, categoria, kcal, proteina_g, carboidrato_g, gordura_g, fibra_g, sodio_mg, source, source_id, brand_name, barcode, other_nutrients, default_unit, measures')
        .eq('trainer_id', userId)
        .or(orAlimentos)
        .limit(200),
      supabaseClient
        .from('taco_alimentos')
        .select('id, nome, categoria, kcal, proteina_g, carboidrato_g, gordura_g, fibra_g, sodio_mg, default_unit, measures')
        .or(orTaco)
        .limit(1000)
    ]);
    const combina = (nome, marca) => palavras.every((w) => normalizarSemAcento((nome || '') + ' ' + (marca || '')).includes(w));
    const results = (ownRes.data || []).filter((r) => combina(r.nome, r.brand_name)).slice(0, 30).map(rowToNormalizedApp)
      .concat((tacoRes.data || []).filter((r) => combina(r.nome)).slice(0, 30).map(rowToNormalizedTaco));
    return { results, warning: 'edge_function_unavailable' };
  }
}

const MEDIDA_SLUGS = ['unidade', 'fatia', 'colher_sopa', 'colher_cha', 'xicara', 'copo', 'concha'];

// Edita a quantidade/unidade de um alimento já adicionado à refeição, sem
// precisar excluir e adicionar de novo. Reaproveita as mesmas funções de
// cálculo do fluxo de adicionar (availableMeasures/computeNutrients/
// buildItemFromFood) — nenhuma lógica de conversão nova, mesmos dados das
// integrações já usadas. Prefere buscar o alimento de novo via food-get
// (usando food_source/food_source_id salvos no item) pra ter a lista de
// medidas mais atual; se o item for antigo e não tiver essa referência,
// reconstrói uma referência "por 100g/100ml" aproximada a partir dos
// valores já salvos, então a edição continua funcionando (só sem trocar de
// unidade nesse caso raro, já que não sabemos as medidas originais).
function abrirEditarItem(opcao, index, onSaved) {
  const it = opcao.itens[index];
  const overlay = el('<div class="fp-overlay"></div>');
  const modal = el('<div class="fp-modal"></div>');
  overlay.appendChild(modal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);

  const state = {
    qtd: it.quantidade != null ? it.quantidade : it.quantidade_g,
    unidade: it.unidade || 'g',
    food: null, erro: ''
  };

  function deriveFoodFromItem() {
    const grams = it.quantidade_g || 100;
    const f = grams > 0 ? (100 / grams) : 0;
    return {
      nome: it.nome, kcal: (it.kcal || 0) * f, proteinaG: (it.proteina_g || 0) * f,
      carboidratoG: (it.carboidrato_g || 0) * f, gorduraG: (it.gordura_g || 0) * f,
      fibraG: (it.fibra_g || 0) * f, sodioMg: (it.sodio_mg || 0) * f,
      isLiquid: it.unidade === 'ml', measures: []
    };
  }

  function renderLoading() {
    modal.innerHTML = '';
    const head = el('<div class="fp-head"></div>');
    head.appendChild(el('<div class="fp-title">Editar quantidade</div>'));
    const closeBtn = el('<button type="button" class="fp-close">×</button>');
    closeBtn.addEventListener('click', () => overlay.remove());
    head.appendChild(closeBtn);
    modal.appendChild(head);
    modal.appendChild(el('<div class="fp-empty">Carregando…</div>'));
  }

  async function carregarFood() {
    if (it.food_source && it.food_source_id) {
      try {
        const { data, error } = await supabaseClient.functions.invoke('food-get', { body: { source: it.food_source, source_id: it.food_source_id } });
        if (!error && data && data.food) { state.food = data.food; renderForm(); return; }
      } catch (err) { /* cai pro fallback abaixo */ }
    }
    state.food = deriveFoodFromItem();
    renderForm();
  }

  function renderForm() {
    modal.innerHTML = '';
    const head = el('<div class="fp-head"></div>');
    head.appendChild(el('<div class="fp-title">Editar quantidade</div>'));
    const closeBtn = el('<button type="button" class="fp-close">×</button>');
    closeBtn.addEventListener('click', () => overlay.remove());
    head.appendChild(closeBtn);
    modal.appendChild(head);

    modal.appendChild(el('<div style="font-size:14.5px;font-weight:800;">' + it.nome + '</div>'));

    const measures = availableMeasures(state.food);
    if (!measures.some((m) => m.unidade === state.unidade)) state.unidade = measures[0].unidade;

    const row = el('<div class="fp-qty-row"></div>');
    const qtdInput = el('<input type="number" min="0" step="any">');
    qtdInput.value = state.qtd;
    qtdInput.addEventListener('input', () => { state.qtd = qtdInput.value; renderPreview(); });
    const unidadeSelect = el('<select></select>');
    measures.forEach((m) => {
      const opt = el('<option value="' + m.unidade + '">' + foodMeasureLabel(m.unidade, m.label) + '</option>');
      if (m.unidade === state.unidade) opt.selected = true;
      unidadeSelect.appendChild(opt);
    });
    unidadeSelect.addEventListener('change', () => { state.unidade = unidadeSelect.value; renderPreview(); });
    row.appendChild(qtdInput); row.appendChild(unidadeSelect);
    modal.appendChild(row);

    const previewBox = el('<div></div>');
    modal.appendChild(previewBox);
    function renderPreview() {
      const n = computeNutrients(state.food, Number(state.qtd) || 0, state.unidade);
      previewBox.innerHTML = '';
      if (!n) { previewBox.appendChild(el('<div class="erro" style="margin-top:10px;">Sem conversão pra essa unidade.</div>')); return; }
      const box = el('<div class="fp-macros-preview"></div>');
      [['Kcal', n.kcal, ''], ['Proteínas', n.proteinaG, 'g'], ['Carboidratos', n.carboidratoG, 'g'], ['Gorduras', n.gorduraG, 'g'], ['Fibras', n.fibraG, 'g']]
        .forEach(([label, val, suf]) => box.appendChild(el('<div class="t">' + label + ': <b>' + val + suf + '</b></div>')));
      previewBox.appendChild(box);
    }
    renderPreview();

    if (state.erro) modal.appendChild(el('<div class="erro">' + state.erro + '</div>'));

    const actionsRow = el('<div style="display:flex;gap:8px;margin-top:16px;"></div>');
    const cancelBtn = el('<button type="button" class="btn btn-secondary" style="flex:1;">Cancelar</button>');
    cancelBtn.addEventListener('click', () => overlay.remove());
    const saveBtn = el('<button type="button" class="btn btn-primary" style="flex:1;">Salvar</button>');
    saveBtn.addEventListener('click', () => {
      const qtd = Number(state.qtd);
      if (!qtd || qtd <= 0) { state.erro = 'Informe uma quantidade válida.'; renderForm(); return; }
      const novoItem = buildItemFromFood(state.food, qtd, state.unidade);
      if (!novoItem) { state.erro = 'Sem conversão disponível pra essa unidade.'; renderForm(); return; }
      novoItem.substituiveis = it.substituiveis || [];
      opcao.itens[index] = novoItem;
      overlay.remove();
      if (onSaved) onSaved();
    });
    actionsRow.appendChild(cancelBtn); actionsRow.appendChild(saveBtn);
    modal.appendChild(actionsRow);
  }

  renderLoading();
  carregarFood();
}

function abrirFoodPicker(opcao, onAdded) {
  const state = {
    step: 'busca', query: '', results: [], favoritos: [], recentes: [], loading: false, warning: null,
    barcodeOpen: false, barcodeErro: '', formErro: '', selected: null, qtd: 100, unidade: 'g', customForm: null
  };

  const overlay = el('<div class="fp-overlay"></div>');
  const modal = el('<div class="fp-modal"></div>');
  overlay.appendChild(modal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) fechar(); });
  document.body.appendChild(overlay);

  let bodyEl = null; // container de resultados dentro do passo "busca" — atualizado sozinho pra não recriar o <input> (perderia foco/digitação a cada tecla)

  function fechar() { overlay.remove(); }

  fpCarregarFavoritosRecentes().then((r) => { state.favoritos = r.favoritos; state.recentes = r.recentes; if (bodyEl) renderResultsBody(); else renderModal(); });

  function buscar(q) {
    state.query = q;
    clearTimeout(fpDebounceTimer);
    if (!q.trim()) { state.results = []; state.warning = null; renderResultsBody(); return; }
    state.loading = true; renderResultsBody();
    fpDebounceTimer = setTimeout(async () => {
      const r = await fpFetchSearch(q.trim());
      if (state.query !== q) return; // resposta atrasada de uma busca já trocada
      state.results = r.results; state.warning = r.warning; state.loading = false; renderResultsBody();
    }, 400);
  }

  async function selecionar(food) {
    let full = food;
    if (food.source === 'FATSECRET' && (!food.measures || !food.measures.length)) {
      state.loading = true; renderModal();
      try {
        const { data, error } = await supabaseClient.functions.invoke('food-get', { body: { source: food.source, source_id: food.sourceId } });
        if (error || !data || !data.food) throw error || new Error('sem dados');
        full = data.food;
      } catch (err) {
        state.loading = false; state.formErro = 'Não deu pra carregar os detalhes desse alimento agora.'; renderModal(); return;
      }
    }
    state.selected = full;
    state.qtd = full.isLiquid ? 200 : 100;
    state.unidade = full.isLiquid ? 'ml' : 'g';
    state.step = 'quantidade';
    state.loading = false;
    state.formErro = '';
    renderModal();
  }

  function confirmarQuantidade() {
    const qtd = Number(state.qtd);
    if (!qtd || qtd <= 0) { state.formErro = 'Informe uma quantidade válida.'; renderModal(); return; }
    const item = buildItemFromFood(state.selected, qtd, state.unidade);
    if (!item) { state.formErro = 'Sem conversão disponível pra essa unidade.'; renderModal(); return; }
    opcao.itens.push(item);
    fpRegistrarRecente(Object.assign({}, state.selected, { alimentoId: state.selected.alimentoId }));
    fechar();
    if (onAdded) onAdded();
  }

  function hydrate(row) {
    const snap = row.snapshot || {};
    return Object.assign({}, snap, {
      id: row.source + ':' + row.source_id,
      source: row.source,
      sourceId: row.source_id,
      alimentoId: row.alimento_id || snap.alimentoId || null,
      nome: row.nome || snap.nome
    });
  }

  function isFavorito(food) {
    const sid = String(food.sourceId || food.alimentoId);
    return state.favoritos.some((f) => f.source === food.source && f.source_id === sid);
  }

  function renderResultRow(food, favorito) {
    const row = el('<div class="fp-result"></div>');
    const left = el('<div style="min-width:0;"></div>');
    left.appendChild(el('<div class="fp-result-nome">' + food.nome + (food.brandName ? ' — ' + food.brandName : '') + '</div>'));
    const subParts = [];
    if (food.kcal != null) subParts.push(round1(food.kcal) + ' kcal/100' + (food.isLiquid ? 'ml' : 'g'));
    subParts.push(food.source === 'APP' ? 'sua base' : (food.source === 'TBCA' ? 'TBCA' : 'FatSecret'));
    left.appendChild(el('<div class="fp-result-sub">' + subParts.join(' · ') + '</div>'));
    row.appendChild(left);

    const starBtn = el('<button type="button" class="fp-star' + (favorito ? ' on' : '') + '">' + (favorito ? '★' : '☆') + '</button>');
    starBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      await fpToggleFavorito(food, favorito);
      const r = await fpCarregarFavoritosRecentes();
      state.favoritos = r.favoritos; state.recentes = r.recentes;
      renderResultsBody();
    });
    row.appendChild(starBtn);

    row.addEventListener('click', () => selecionar(food));
    return row;
  }

  function renderResultsBody() {
    if (!bodyEl) return;
    bodyEl.innerHTML = '';

    if (state.warning === 'fatsecret_unavailable' || state.warning === 'fatsecret_unavailable_stale_cache' || state.warning === 'edge_function_unavailable') {
      bodyEl.appendChild(el('<div class="fp-warning">Não foi possível consultar produtos externos no momento. Mostrando só a sua base local.</div>'));
    }

    if (!state.query.trim()) {
      if (state.favoritos.length) {
        bodyEl.appendChild(el('<div class="fp-section-label">Favoritos</div>'));
        state.favoritos.forEach((f) => bodyEl.appendChild(renderResultRow(hydrate(f), true)));
      }
      if (state.recentes.length) {
        bodyEl.appendChild(el('<div class="fp-section-label">Recentes</div>'));
        state.recentes.forEach((r) => { const food = hydrate(r); bodyEl.appendChild(renderResultRow(food, isFavorito(food))); });
      }
      if (!state.favoritos.length && !state.recentes.length) {
        bodyEl.appendChild(el('<div class="fp-empty">Digite pra buscar um alimento.</div>'));
      }
    } else if (state.loading) {
      bodyEl.appendChild(el('<div class="fp-empty">Buscando…</div>'));
    } else if (!state.results.length) {
      bodyEl.appendChild(el('<div class="fp-empty">Nenhum alimento encontrado pra "' + state.query + '".</div>'));
    } else {
      state.results.forEach((f) => bodyEl.appendChild(renderResultRow(f, isFavorito(f))));
    }
  }

  // O <input> de busca só é criado UMA vez por passagem pelo passo "busca"
  // (abrirFoodPicker → renderModal → renderBusca). Digitar só atualiza
  // `bodyEl` via renderResultsBody(), nunca recria o campo — recriar a
  // cada tecla (via renderModal() cheio) derrubava o foco/composição do
  // input e perdia caracteres digitados rápido.
  function renderBusca() {
    const searchInput = el('<input class="fp-search" placeholder="Digite o alimento… (ex: pão, arroz, frango)" autocomplete="off">');
    searchInput.value = state.query;
    searchInput.addEventListener('input', () => buscar(searchInput.value));
    modal.appendChild(searchInput);
    setTimeout(() => searchInput.focus(), 0);

    bodyEl = el('<div class="fp-body"></div>');
    modal.appendChild(bodyEl);
    renderResultsBody();

    const footer = el('<div style="margin-top:6px;border-top:1px solid #1a2130;padding-top:10px;"></div>');
    const barcodeBtn = el('<button type="button" class="fp-link-btn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:3px;flex-shrink:0;"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg> Buscar por código de barras</button>');
    barcodeBtn.addEventListener('click', () => { state.barcodeOpen = !state.barcodeOpen; renderModal(); });
    footer.appendChild(barcodeBtn);

    if (state.barcodeOpen) {
      const row = el('<div style="display:flex;gap:8px;margin-top:8px;"></div>');
      const bcInput = el('<input placeholder="Código de barras (EAN/UPC)" style="flex:1;">');
      const bcBtn = el('<button type="button" class="btn btn-secondary" style="flex:0 0 auto;">Buscar</button>');
      bcBtn.addEventListener('click', async () => {
        const barcode = bcInput.value.trim();
        if (!barcode) return;
        state.loading = true; state.barcodeErro = ''; renderModal();
        const { data, error } = await supabaseClient.functions.invoke('food-barcode', { body: { barcode } });
        state.loading = false;
        if (error || !data || !data.food) { state.barcodeErro = 'Nenhum produto encontrado pra esse código.'; renderModal(); return; }
        selecionar(data.food);
      });
      row.appendChild(bcInput); row.appendChild(bcBtn);
      footer.appendChild(row);
      if (state.barcodeErro) footer.appendChild(el('<div class="erro">' + state.barcodeErro + '</div>'));
    }

    const customBtn = el('<button type="button" class="fp-link-btn" style="display:block;margin-top:6px;">+ Cadastrar alimento personalizado</button>');
    customBtn.addEventListener('click', () => {
      state.customForm = { nome: '', marca: '', categoria: '', barcode: '', porcaoQtd: '100', porcaoUnidade: 'g', kcal: '', proteina: '', carboidrato: '', gordura: '', fibra: '', sodio: '', medidaSlug: '' };
      state.step = 'personalizado'; state.formErro = '';
      renderModal();
    });
    footer.appendChild(customBtn);
    modal.appendChild(footer);
  }

  function renderQuantidade() {
    const food = state.selected;
    modal.appendChild(el('<div style="font-size:14.5px;font-weight:800;">' + food.nome + (food.brandName ? ' — ' + food.brandName : '') + '</div>'));

    if (food.source !== 'APP') {
      const promoteBtn = el('<button type="button" class="fp-link-btn" style="margin-top:6px;">+ Adicionar ao banco do app</button>');
      promoteBtn.addEventListener('click', async () => {
        promoteBtn.disabled = true;
        try {
          const saved = await fpPromoverParaApp(food);
          state.selected = Object.assign({}, food, { alimentoId: saved.alimentoId });
          promoteBtn.textContent = '✓ Adicionado ao banco do app';
        } catch (err) {
          promoteBtn.disabled = false;
        }
      });
      modal.appendChild(promoteBtn);
    }

    const measures = availableMeasures(food);
    const row = el('<div class="fp-qty-row"></div>');
    const qtdInput = el('<input type="number" min="0" step="any">');
    qtdInput.value = state.qtd;
    qtdInput.addEventListener('input', () => { state.qtd = qtdInput.value; renderPreview(); });
    const unidadeSelect = el('<select></select>');
    measures.forEach((m) => {
      const opt = el('<option value="' + m.unidade + '">' + foodMeasureLabel(m.unidade, m.label) + '</option>');
      if (m.unidade === state.unidade) opt.selected = true;
      unidadeSelect.appendChild(opt);
    });
    unidadeSelect.addEventListener('change', () => { state.unidade = unidadeSelect.value; renderPreview(); });
    row.appendChild(qtdInput); row.appendChild(unidadeSelect);
    modal.appendChild(row);

    const previewBox = el('<div></div>');
    modal.appendChild(previewBox);
    function renderPreview() {
      const n = computeNutrients(food, Number(state.qtd) || 0, state.unidade);
      previewBox.innerHTML = '';
      if (!n) { previewBox.appendChild(el('<div class="erro" style="margin-top:10px;">Sem conversão pra essa unidade.</div>')); return; }
      const box = el('<div class="fp-macros-preview"></div>');
      [['Kcal', n.kcal, ''], ['Proteínas', n.proteinaG, 'g'], ['Carboidratos', n.carboidratoG, 'g'], ['Gorduras', n.gorduraG, 'g'], ['Fibras', n.fibraG, 'g']]
        .forEach(([label, val, suf]) => box.appendChild(el('<div class="t">' + label + ': <b>' + val + suf + '</b></div>')));
      previewBox.appendChild(box);
    }
    renderPreview();

    if (state.formErro) modal.appendChild(el('<div class="erro">' + state.formErro + '</div>'));

    const actionsRow = el('<div style="display:flex;gap:8px;margin-top:16px;"></div>');
    const backBtn = el('<button type="button" class="btn btn-secondary" style="flex:1;">Voltar</button>');
    backBtn.addEventListener('click', () => { state.step = 'busca'; state.formErro = ''; renderModal(); });
    const confirmBtn = el('<button type="button" class="btn btn-primary" style="flex:1;">Adicionar</button>');
    confirmBtn.addEventListener('click', confirmarQuantidade);
    actionsRow.appendChild(backBtn); actionsRow.appendChild(confirmBtn);
    modal.appendChild(actionsRow);
  }

  function renderFormPersonalizado() {
    const f = state.customForm;

    function field(label, key, type) {
      const wrap = el('<div class="field"></div>');
      wrap.appendChild(el('<label>' + label + '</label>'));
      const input = el('<input' + (type ? ' type="' + type + '"' : '') + '>');
      input.value = f[key];
      input.addEventListener('input', () => { f[key] = input.value; });
      wrap.appendChild(input);
      return wrap;
    }

    modal.appendChild(field('Nome', 'nome'));
    const row1 = el('<div class="fp-form-grid"></div>');
    row1.appendChild(field('Marca (opcional)', 'marca'));
    row1.appendChild(field('Código de barras (opcional)', 'barcode'));
    modal.appendChild(row1);

    const row2 = el('<div class="fp-form-grid"></div>');
    row2.appendChild(field('Quantidade da porção', 'porcaoQtd', 'number'));
    const unidWrap = el('<div class="field"></div>');
    unidWrap.appendChild(el('<label>Unidade da porção</label>'));
    const unidSel = el('<select><option value="g">g</option><option value="ml">ml</option></select>');
    unidSel.value = f.porcaoUnidade;
    unidSel.addEventListener('change', () => { f.porcaoUnidade = unidSel.value; });
    unidWrap.appendChild(unidSel);
    row2.appendChild(unidWrap);
    modal.appendChild(row2);

    const row3 = el('<div class="fp-form-grid"></div>');
    row3.appendChild(field('Kcal (na porção acima)', 'kcal', 'number'));
    row3.appendChild(field('Proteína g', 'proteina', 'number'));
    modal.appendChild(row3);
    const row4 = el('<div class="fp-form-grid"></div>');
    row4.appendChild(field('Carboidrato g', 'carboidrato', 'number'));
    row4.appendChild(field('Gordura g', 'gordura', 'number'));
    modal.appendChild(row4);
    const row5 = el('<div class="fp-form-grid"></div>');
    row5.appendChild(field('Fibra g (opcional)', 'fibra', 'number'));
    row5.appendChild(field('Sódio mg (opcional)', 'sodio', 'number'));
    modal.appendChild(row5);

    const medWrap = el('<div class="field"></div>');
    medWrap.appendChild(el('<label>Medida caseira equivalente à porção acima (opcional)</label>'));
    const medSel = el('<select><option value="">Nenhuma</option></select>');
    MEDIDA_SLUGS.forEach((slug) => medSel.appendChild(el('<option value="' + slug + '">' + foodMeasureLabel(slug) + '</option>')));
    medSel.value = f.medidaSlug;
    medSel.addEventListener('change', () => { f.medidaSlug = medSel.value; });
    medWrap.appendChild(medSel);
    modal.appendChild(medWrap);

    if (state.formErro) modal.appendChild(el('<div class="erro">' + state.formErro + '</div>'));

    const actionsRow = el('<div style="display:flex;gap:8px;margin-top:14px;"></div>');
    const backBtn = el('<button type="button" class="btn btn-secondary" style="flex:1;">Voltar</button>');
    backBtn.addEventListener('click', () => { state.step = 'busca'; state.formErro = ''; renderModal(); });
    const saveBtn = el('<button type="button" class="btn btn-primary" style="flex:1;">Cadastrar e usar</button>');
    saveBtn.addEventListener('click', async () => {
      if (!f.nome.trim()) { state.formErro = 'Dê um nome pro alimento.'; renderModal(); return; }
      const porcao = Number(f.porcaoQtd);
      if (!porcao || porcao <= 0) { state.formErro = 'Informe a quantidade da porção.'; renderModal(); return; }
      const scale = 100 / porcao;
      const measures = f.medidaSlug ? [{
        unidade: f.medidaSlug, label: foodMeasureLabel(f.medidaSlug),
        grams: f.porcaoUnidade === 'g' ? porcao : undefined,
        ml: f.porcaoUnidade === 'ml' ? porcao : undefined
      }] : [];
      const payload = {
        trainer_id: userId, nome: f.nome.trim(), categoria: f.categoria.trim() || null,
        brand_name: f.marca.trim() || null, barcode: f.barcode.trim() || null,
        kcal: Number(f.kcal || 0) * scale, proteina_g: Number(f.proteina || 0) * scale,
        carboidrato_g: Number(f.carboidrato || 0) * scale, gordura_g: Number(f.gordura || 0) * scale,
        fibra_g: f.fibra ? Number(f.fibra) * scale : null, sodio_mg: f.sodio ? Number(f.sodio) * scale : null,
        default_unit: f.porcaoUnidade, measures: measures, source: 'APP'
      };
      const { data, error } = await supabaseClient.from('alimentos').insert(payload).select().single();
      if (error) { state.formErro = error.message; renderModal(); return; }
      selecionar(rowToNormalizedApp(data));
    });
    actionsRow.appendChild(backBtn); actionsRow.appendChild(saveBtn);
    modal.appendChild(actionsRow);
  }

  function renderModal() {
    modal.innerHTML = '';
    const head = el('<div class="fp-head"></div>');
    const titulo = state.step === 'quantidade' ? 'Quantidade' : (state.step === 'personalizado' ? 'Cadastrar alimento' : 'Adicionar alimento');
    head.appendChild(el('<div class="fp-title">' + titulo + '</div>'));
    const closeBtn = el('<button type="button" class="fp-close">×</button>');
    closeBtn.addEventListener('click', fechar);
    head.appendChild(closeBtn);
    modal.appendChild(head);

    if (state.step === 'busca') renderBusca();
    else if (state.step === 'quantidade') renderQuantidade();
    else renderFormPersonalizado();
  }

  renderModal();
}

// Fluxo de "Substituíveis": igual ao seletor de alimentos (abrirFoodPicker),
// mas escopado a UM item já salvo na refeição — em vez de perguntar a
// quantidade, sugere automaticamente quantos g/ml/unidade do substituto
// equivalem à kcal do alimento original (solveQuantityForKcal, js/food-measures.js),
// deixando o profissional revisar/ajustar antes de salvar. Empurra pra
// it.substituiveis — nunca pra opcao.itens, então nunca entra nos totais
// (somaItens só itera itens). Não modifica abrirFoodPicker.
function abrirGerenciarSubstituiveis(item, onChange) {
  const state = { step: 'lista', query: '', results: [], favoritos: [], recentes: [], loading: false, warning: null, selected: null, qtd: null, unidade: 'g', erro: '' };
  if (!item.substituiveis) item.substituiveis = [];

  const overlay = el('<div class="fp-overlay"></div>');
  const modal = el('<div class="fp-modal"></div>');
  overlay.appendChild(modal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) fechar(); });
  document.body.appendChild(overlay);

  let bodyEl = null;

  function fechar() { overlay.remove(); onChange(); }

  function buscar(q) {
    state.query = q;
    clearTimeout(fpDebounceTimer);
    if (!q.trim()) { state.results = []; state.warning = null; renderResultsBody(); return; }
    state.loading = true; renderResultsBody();
    fpDebounceTimer = setTimeout(async () => {
      const r = await fpFetchSearch(q.trim());
      if (state.query !== q) return;
      state.results = r.results; state.warning = r.warning; state.loading = false; renderResultsBody();
    }, 400);
  }

  async function selecionar(food) {
    let full = food;
    if (food.source === 'FATSECRET' && (!food.measures || !food.measures.length)) {
      state.loading = true; renderModal();
      try {
        const { data, error } = await supabaseClient.functions.invoke('food-get', { body: { source: food.source, source_id: food.sourceId } });
        if (error || !data || !data.food) throw error || new Error('sem dados');
        full = data.food;
      } catch (err) {
        state.loading = false; state.erro = 'Não deu pra carregar os detalhes desse alimento agora.'; renderModal(); return;
      }
    }
    state.selected = full;
    state.unidade = full.isLiquid ? 'ml' : 'g';
    const sugestao = solveQuantityForKcal(full, item.kcal || 0, state.unidade);
    state.qtd = sugestao != null ? sugestao : (full.isLiquid ? 200 : 100);
    state.step = 'quantidade';
    state.loading = false;
    state.erro = '';
    renderModal();
  }

  function confirmarSubstituto() {
    const qtd = Number(state.qtd);
    if (!qtd || qtd <= 0) { state.erro = 'Informe uma quantidade válida.'; renderModal(); return; }
    const novoSub = buildItemFromFood(state.selected, qtd, state.unidade);
    if (!novoSub) { state.erro = 'Sem conversão disponível pra essa unidade.'; renderModal(); return; }
    item.substituiveis.push(novoSub);
    state.step = 'lista';
    state.selected = null;
    renderModal();
  }

  function renderResultRow(food) {
    const row = el('<div class="fp-result"></div>');
    const left = el('<div style="min-width:0;"></div>');
    left.appendChild(el('<div class="fp-result-nome">' + food.nome + (food.brandName ? ' — ' + food.brandName : '') + '</div>'));
    const subParts = [];
    if (food.kcal != null) subParts.push(round1(food.kcal) + ' kcal/100' + (food.isLiquid ? 'ml' : 'g'));
    subParts.push(food.source === 'APP' ? 'sua base' : (food.source === 'TBCA' ? 'TBCA' : 'FatSecret'));
    left.appendChild(el('<div class="fp-result-sub">' + subParts.join(' · ') + '</div>'));
    row.appendChild(left);
    row.addEventListener('click', () => selecionar(food));
    return row;
  }

  function renderResultsBody() {
    if (!bodyEl) return;
    bodyEl.innerHTML = '';
    if (state.warning === 'fatsecret_unavailable' || state.warning === 'fatsecret_unavailable_stale_cache' || state.warning === 'edge_function_unavailable') {
      bodyEl.appendChild(el('<div class="fp-warning">Não foi possível consultar produtos externos no momento. Mostrando só a sua base local.</div>'));
    }
    if (!state.query.trim()) {
      if (state.favoritos.length) {
        bodyEl.appendChild(el('<div class="fp-section-label">Favoritos</div>'));
        state.favoritos.forEach((f) => bodyEl.appendChild(renderResultRow(hydrate(f))));
      }
      if (state.recentes.length) {
        bodyEl.appendChild(el('<div class="fp-section-label">Recentes</div>'));
        state.recentes.forEach((r) => bodyEl.appendChild(renderResultRow(hydrate(r))));
      }
      if (!state.favoritos.length && !state.recentes.length) {
        bodyEl.appendChild(el('<div class="fp-empty">Digite pra buscar um alimento substituto.</div>'));
      }
    } else if (state.loading) {
      bodyEl.appendChild(el('<div class="fp-empty">Buscando…</div>'));
    } else if (!state.results.length) {
      bodyEl.appendChild(el('<div class="fp-empty">Nenhum alimento encontrado pra "' + state.query + '".</div>'));
    } else {
      state.results.forEach((f) => bodyEl.appendChild(renderResultRow(f)));
    }
  }

  function renderListaStep() {
    modal.appendChild(el('<div style="font-size:14.5px;font-weight:800;">' + item.nome + '</div>'));
    modal.appendChild(el('<div style="font-size:12px;color:#66707e;margin-top:2px;">' + item.kcal + ' kcal — os substitutos abaixo entregam a mesma kcal, o aluno escolhe um, nunca soma ao total.</div>'));

    if (item.substituiveis.length) {
      const list = el('<div style="margin-top:12px;"></div>');
      item.substituiveis.forEach((s, si) => {
        const row = el('<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;background:#131a26;border:1px solid #1e2633;border-radius:10px;padding:9px 12px;margin-bottom:7px;"></div>');
        const qtdLabel = (s.quantidade != null && s.unidade) ? s.quantidade + ' ' + foodMeasureLabel(s.unidade) : s.quantidade_g + 'g';
        const info = el('<div></div>');
        info.appendChild(el('<div style="font-size:13px;font-weight:700;">' + s.nome + '</div>'));
        info.appendChild(el('<div style="font-size:11px;color:#66707e;margin-top:2px;">' + qtdLabel + ' · ' + s.kcal + ' kcal</div>'));
        row.appendChild(info);
        const rmBtn = el('<button type="button" class="item-remove">×</button>');
        rmBtn.addEventListener('click', () => { item.substituiveis.splice(si, 1); renderModal(); });
        row.appendChild(rmBtn);
        list.appendChild(row);
      });
      modal.appendChild(list);
    }

    const addBtn = el('<button type="button" class="btn btn-secondary" style="width:100%;margin-top:4px;">+ Adicionar substituível</button>');
    addBtn.addEventListener('click', () => { state.step = 'busca'; renderModal(); });
    modal.appendChild(addBtn);

    const doneBtn = el('<button type="button" class="btn btn-primary" style="width:100%;margin-top:8px;">Concluir</button>');
    doneBtn.addEventListener('click', fechar);
    modal.appendChild(doneBtn);
  }

  function renderBuscaStep() {
    const backBtn = el('<button type="button" class="fp-link-btn" style="margin-bottom:8px;">← Voltar</button>');
    backBtn.addEventListener('click', () => { state.step = 'lista'; renderModal(); });
    modal.appendChild(backBtn);

    const searchInput = el('<input class="fp-search" placeholder="Buscar alimento substituto… (ex: tapioca, batata-doce)" autocomplete="off">');
    searchInput.value = state.query;
    searchInput.addEventListener('input', () => buscar(searchInput.value));
    modal.appendChild(searchInput);
    setTimeout(() => searchInput.focus(), 0);

    bodyEl = el('<div class="fp-body"></div>');
    modal.appendChild(bodyEl);
    renderResultsBody();
  }

  function renderQuantidadeStep() {
    const food = state.selected;
    const backBtn = el('<button type="button" class="fp-link-btn" style="margin-bottom:8px;">← Voltar</button>');
    backBtn.addEventListener('click', () => { state.step = 'busca'; renderModal(); });
    modal.appendChild(backBtn);

    modal.appendChild(el('<div style="font-size:14.5px;font-weight:800;">' + food.nome + (food.brandName ? ' — ' + food.brandName : '') + '</div>'));
    modal.appendChild(el('<div style="font-size:11.5px;color:#66707e;margin-top:2px;">Quantidade sugerida pra equivaler a ' + (item.kcal || 0) + ' kcal — ajuste se quiser.</div>'));

    const measures = availableMeasures(food);
    const row = el('<div class="fp-qty-row"></div>');
    const qtdInput = el('<input type="number" min="0" step="any">');
    qtdInput.value = state.qtd;
    qtdInput.addEventListener('input', () => { state.qtd = qtdInput.value; renderPreview(); });
    const unidadeSelect = el('<select></select>');
    measures.forEach((m) => {
      const opt = el('<option value="' + m.unidade + '">' + foodMeasureLabel(m.unidade, m.label) + '</option>');
      if (m.unidade === state.unidade) opt.selected = true;
      unidadeSelect.appendChild(opt);
    });
    unidadeSelect.addEventListener('change', () => {
      state.unidade = unidadeSelect.value;
      const sugestao = solveQuantityForKcal(food, item.kcal || 0, state.unidade);
      if (sugestao != null) { state.qtd = sugestao; qtdInput.value = sugestao; }
      renderPreview();
    });
    row.appendChild(qtdInput); row.appendChild(unidadeSelect);
    modal.appendChild(row);

    const previewBox = el('<div></div>');
    modal.appendChild(previewBox);
    function renderPreview() {
      const n = computeNutrients(food, Number(state.qtd) || 0, state.unidade);
      previewBox.innerHTML = '';
      if (!n) { previewBox.appendChild(el('<div class="erro" style="margin-top:10px;">Sem conversão pra essa unidade.</div>')); return; }
      const box = el('<div class="fp-macros-preview"></div>');
      [['Kcal', n.kcal, ''], ['Proteínas', n.proteinaG, 'g'], ['Carboidratos', n.carboidratoG, 'g'], ['Gorduras', n.gorduraG, 'g'], ['Fibras', n.fibraG, 'g']]
        .forEach(([label, val, suf]) => box.appendChild(el('<div class="t">' + label + ': <b>' + val + suf + '</b></div>')));
      previewBox.appendChild(box);
    }
    renderPreview();

    if (state.erro) modal.appendChild(el('<div class="erro">' + state.erro + '</div>'));

    const confirmBtn = el('<button type="button" class="btn btn-primary" style="width:100%;margin-top:16px;">Salvar substituível</button>');
    confirmBtn.addEventListener('click', confirmarSubstituto);
    modal.appendChild(confirmBtn);
  }

  function renderModal() {
    modal.innerHTML = '';
    const head = el('<div class="fp-head"></div>');
    head.appendChild(el('<div class="fp-title">Substituíveis</div>'));
    const closeBtn = el('<button type="button" class="fp-close">×</button>');
    closeBtn.addEventListener('click', fechar);
    head.appendChild(closeBtn);
    modal.appendChild(head);

    if (state.loading && state.step === 'busca' && !state.selected) { modal.appendChild(el('<div class="fp-empty">Carregando…</div>')); return; }
    if (state.step === 'lista') renderListaStep();
    else if (state.step === 'busca') renderBuscaStep();
    else if (state.step === 'quantidade') renderQuantidadeStep();
  }

  fpCarregarFavoritosRecentes().then((r) => { state.favoritos = r.favoritos; state.recentes = r.recentes; if (bodyEl) renderResultsBody(); });
  renderModal();
}

init();
</script>
</body>
</html>
