<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aluno — Elo Fitness</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth-guard.js"></script>
<style>
html,body{margin:0;padding:0;background:#0a0d13;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e5e9f0;}
*{box-sizing:border-box;}
a{color:#f97316;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}::-webkit-scrollbar-thumb{background:#1e2633;border-radius:4px;}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid #171d29;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-badge{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#f97316,#ea580c);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:16px;}
.logo-text{font-size:17px;font-weight:800;}
.logo-text span{color:#f97316;}
.voltar{font-size:13px;font-weight:700;color:#9aa4b2;}
.voltar:hover{color:#e5e9f0;}

.wrap{max-width:920px;margin:0 auto;padding:32px 20px 80px;}
.card{background:#10151f;border:1px solid #1a2130;border-radius:16px;padding:28px;}
h1{font-size:20px;font-weight:800;margin:0 0 6px;}
.sub{font-size:13.5px;color:#9aa4b2;margin:0 0 24px;}

.aluno-header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px;}
.aluno-avatar{width:44px;height:44px;border-radius:50%;background:rgba(249,115,22,.15);color:#f97316;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;}
.badge{font-size:10px;font-weight:800;padding:3px 10px;border-radius:999px;display:inline-block;}
.badge-ativo{color:#4ade80;background:rgba(74,222,128,.12);}
.badge-inativo{color:#66707e;background:#131a26;}
.badge-convite-pendente{color:#facc15;background:rgba(250,204,21,.12);}
.badge-convite-aceito{color:#4ade80;background:rgba(74,222,128,.12);}
.badge-convite-expirado{color:#f87171;background:rgba(248,113,113,.12);}
.badge-convite-none{color:#66707e;background:#131a26;}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;border-bottom:1px solid #171d29;padding-bottom:0;}
.tab{padding:10px 16px;font-size:13.5px;font-weight:700;color:#9aa4b2;border-bottom:2px solid transparent;cursor:pointer;}
.tab.active{color:#f97316;border-color:#f97316;}

label{font-size:12px;font-weight:700;color:#9aa4b2;display:block;margin-bottom:6px;}
input,select,textarea{width:100%;background:#0d1119;border:1px solid #1e2633;border-radius:9px;padding:10px 13px;color:#e5e9f0;font-size:13.5px;outline:none;}
textarea{resize:vertical;min-height:52px;}
.counter{font-size:11px;color:#66707e;text-align:right;margin-top:3px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.field{margin-bottom:14px;}

.dias-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.dia-btn{display:flex;align-items:center;justify-content:space-between;background:#0d1119;border:1px solid #1e2633;color:#9aa4b2;font-size:12.5px;font-weight:600;padding:9px 11px;border-radius:8px;}
.dia-btn.sel{background:rgba(249,115,22,.1);border-color:rgba(249,115,22,.4);color:#f97316;}

.list-row{background:#0d1119;border:1px solid #1a2130;border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.list-row.clickable:hover{border-color:rgba(249,115,22,.45);}
.list-row-nome{font-size:14px;font-weight:700;}
.list-row-meta{font-size:12px;color:#66707e;margin-top:3px;}
.list-row-actions{display:flex;gap:6px;margin-top:10px;}

.ex-item{background:#131a26;border:1px solid #1e2633;border-radius:10px;padding:12px 14px;margin-bottom:8px;}
.ex-nome{font-size:13.5px;font-weight:700;}
.ex-meta{font-size:11.5px;color:#66707e;margin-top:2px;}

.btn{border:none;border-radius:10px;padding:11px 18px;font-size:13.5px;font-weight:700;cursor:pointer;}
.btn-primary{background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;}
.btn-secondary{background:#1e2633;color:#e5e9f0;}
.btn-outline{background:#131a26;border:1px solid rgba(249,115,22,.35);color:#f97316;}
.btn-ghost{background:none;border:none;color:#66707e;font-size:12.5px;font-weight:600;padding:4px 8px;}
.btn-ghost:hover{color:#f87171;}
.btn-wa{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);color:#4ade80;font-size:11.5px;font-weight:700;padding:7px 12px;border-radius:8px;white-space:nowrap;}
.btn-convite{background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.3);color:#f97316;font-size:11.5px;font-weight:700;padding:7px 12px;border-radius:8px;white-space:nowrap;}
.convite-link-box{display:flex;gap:8px;margin-top:10px;width:100%;}
.convite-link-box input{flex:1;min-width:0;font-size:12px;}
.btn:disabled{opacity:.55;cursor:default;}
.btn-block{width:100%;}

.empty{font-size:12.5px;color:#66707e;padding:20px 0;text-align:center;}
.erro{color:#f87171;font-size:12.5px;margin-top:8px;}
.form-box{background:#0d1119;border:1px dashed #1e2633;border-radius:12px;padding:18px;margin-top:14px;}
.actions-row{display:flex;gap:10px;margin-top:16px;}
.actions-row .btn{flex:1;}

.opt-group{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
.opt-card{background:#0d1119;border:1px solid #1a2130;border-radius:12px;padding:12px 14px;cursor:pointer;}
.opt-card:hover{border-color:rgba(249,115,22,.3);}
.opt-card.sel{background:rgba(249,115,22,.08);border-color:rgba(249,115,22,.5);}
.opt-nome{font-size:13.5px;font-weight:700;}
.opt-card.sel .opt-nome{color:#f97316;}
.opt-desc{font-size:12px;color:#66707e;margin-top:2px;}
.opt-fator{font-size:11px;color:#4a5364;margin-top:3px;font-weight:700;}

.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:6px 0 14px;}
.result-box{background:#0d1119;border:1px solid #1a2130;border-radius:12px;padding:16px;text-align:center;}
.result-num{font-size:22px;font-weight:800;color:#f97316;}
.result-label{font-size:11px;color:#66707e;margin-top:4px;}

.result-summary{font-size:12.5px;color:#9aa4b2;background:#0d1119;border:1px solid #1a2130;border-radius:10px;padding:12px 14px;}
.result-summary b{color:#e5e9f0;}

.warn-box{background:rgba(249,115,22,.08);border:1px solid rgba(249,115,22,.3);border-radius:12px;padding:14px 16px;font-size:12.5px;color:#e5e9f0;margin-bottom:14px;}
.sexo-row{display:flex;gap:8px;}
.sexo-row .chip{flex:1;text-align:center;background:#0d1119;border:1px solid #1e2633;color:#9aa4b2;font-size:13px;font-weight:700;padding:10px;border-radius:9px;cursor:pointer;}
.sexo-row .chip.sel{background:rgba(249,115,22,.1);border-color:rgba(249,115,22,.4);color:#f97316;}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-badge">E</div>
    <div class="logo-text">Elo <span>Fitness</span></div>
  </div>
  <a class="voltar" href="alunos.html">← Voltar pros alunos</a>
</div>

<div class="wrap">
  <div class="card" id="app">Carregando…</div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const clienteIdParam = params.get('cliente_id');
const clienteNomeParam = params.get('cliente_nome');
const tabParam = params.get('tab');
const DIAS_SEMANA = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
const app = document.getElementById('app');

const TABS = [
  ['anamnese', 'Anamnese'],
  ['treino', 'Treino'],
  ['energetico', 'TBM - GET'],
  ['dieta', 'Dieta'],
  ['cardio', 'Cardio'],
  ['fotos', 'Fotos'],
  ['feedback', 'Feedback'],
  ['agendamentos', 'Agendamentos']
];

const OBJETIVO_LABEL = { emagrecimento: 'Emagrecimento', hipertrofia: 'Hipertrofia', condicionamento: 'Condicionamento', saude: 'Saúde geral' };
const NIVEL_LABEL = { iniciante: 'Iniciante', intermediario: 'Intermediário', avancado: 'Avançado' };

const NIVEL_ATIVIDADE_OPCOES = [
  { key: 'sedentario', nome: 'Sedentário', desc: 'Pouco ou nenhum exercício.', fator: 1.20 },
  { key: 'leve', nome: 'Levemente ativo', desc: 'Exercício leve 1–3 dias/semana.', fator: 1.375 },
  { key: 'moderado', nome: 'Moderadamente ativo', desc: 'Exercício moderado 3–5 dias/semana.', fator: 1.55 },
  { key: 'muito_ativo', nome: 'Muito ativo', desc: 'Exercício pesado 6–7 dias/semana.', fator: 1.725 },
  { key: 'extremo', nome: 'Extremamente ativo', desc: 'Exercício muito pesado e/ou trabalho físico.', fator: 1.90 }
];

const OBJETIVO_CALORICO_OPCOES = [
  { key: 'emagrecer', nome: 'Emagrecer', desc: '−15%', percentual: 0.85 },
  { key: 'emagrecer_agressivo', nome: 'Emagrecer Agressivo', desc: '−30%', percentual: 0.70 },
  { key: 'manter', nome: 'Manter peso', desc: '0%', percentual: 1.00 },
  { key: 'ganho_seco', nome: 'Ganhos Secos', desc: '+7%', percentual: 1.07 },
  { key: 'ganho_agressivo', nome: 'Ganhar Peso Agressivo', desc: '+15%', percentual: 1.15 }
];

const ESTADO_ATUAL_OPCOES = [
  { key: 'magro', nome: 'Magro' },
  { key: 'magro_gordura_moderada', nome: 'Magro com gordura moderada' },
  { key: 'falso_magro', nome: 'Falso magro (skinny fat)' },
  { key: 'acima_peso', nome: 'Muito acima do peso' }
];

function calcularTMB(sexo, pesoKg, alturaCm, idade) {
  const base = 10 * pesoKg + 6.25 * alturaCm - 5 * idade;
  return sexo === 'M' ? base + 5 : base - 161;
}

let userId = null;
let cliente = null;
let exerciciosLib = [];
let tecnicasLib = [];
let treinos = [];
let dietaList = [];
let cardioList = [];
let agendamentosList = [];
let anamnese = null;
let fotosList = [];
let feedbacksList = [];
let convite = null;
let conviteLinkAberto = false;
let activeTab = tabParam || 'treino';

let taDetalheId = '';
let taDetalheExercicios = [];
let taAddExOpen = false;

let cardioFormOpen = false;
let cardioEditId = '';

let anamneseFormOpen = false;

let agFormOpen = false;

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function iniciais(nome) {
  return (nome || '?').trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase();
}

function diasLabel(dias) {
  if (!dias || !dias.length) return 'Sem dias definidos';
  return dias.slice().sort().map(d => DIAS_SEMANA[d].slice(0, 3)).join(', ');
}

async function init() {
  if (!clienteIdParam) { window.location.href = 'alunos.html'; return; }

  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) return;
  userId = user.id;

  const { data: cl } = await supabaseClient.from('clientes').select('*').eq('id', clienteIdParam).eq('trainer_id', userId).maybeSingle();
  if (!cl) { window.location.href = 'alunos.html'; return; }
  cliente = cl;

  const [exsRes, tecsRes, trRes, dietaRes, cardioRes, anamneseRes, fotosRes, feedbacksRes, agRes, convRes] = await Promise.all([
    supabaseClient.from('exercicios').select('id, nome').eq('trainer_id', userId).order('nome'),
    supabaseClient.from('tecnicas_avancadas').select('id, nome, observacao').eq('trainer_id', userId).order('created_at'),
    supabaseClient.from('treinos').select('*').eq('cliente_id', clienteIdParam).order('created_at', { ascending: false }),
    supabaseClient.from('dietas').select('*').eq('cliente_id', clienteIdParam).order('created_at', { ascending: false }),
    supabaseClient.from('cardio_protocolos').select('*').eq('cliente_id', clienteIdParam).order('created_at', { ascending: false }),
    supabaseClient.from('anamnese_respostas').select('*').eq('cliente_id', clienteIdParam).maybeSingle(),
    supabaseClient.from('fotos_evolucao').select('*').eq('cliente_id', clienteIdParam).order('created_at', { ascending: false }),
    supabaseClient.from('feedbacks_treino').select('*').eq('cliente_id', clienteIdParam).order('created_at', { ascending: false }),
    supabaseClient.from('agendamentos').select('*').eq('cliente_id', clienteIdParam).order('data_lembrete', { ascending: true }),
    supabaseClient.from('convites').select('*').eq('cliente_id', clienteIdParam).order('created_at', { ascending: false }).limit(1).maybeSingle()
  ]);
  exerciciosLib = exsRes.data || [];
  tecnicasLib = tecsRes.data || [];
  treinos = trRes.data || [];
  dietaList = dietaRes.data || [];
  cardioList = cardioRes.data || [];
  anamnese = anamneseRes.data || null;
  const fotosRaw = fotosRes.data || [];
  if (fotosRaw.length) {
    const { data: signed } = await supabaseClient.storage.from('fotos-evolucao').createSignedUrls(fotosRaw.map(f => f.url), 60 * 60 * 24 * 7);
    fotosList = fotosRaw.map((f, i) => ({ ...f, url: (signed && signed[i] && signed[i].signedUrl) || '' }));
  } else {
    fotosList = [];
  }
  feedbacksList = feedbacksRes.data || [];
  agendamentosList = agRes.data || [];
  convite = convRes.data || null;

  render();
}

function render() {
  app.innerHTML = '';
  app.appendChild(renderHeader());
  app.appendChild(renderTabs());
  if (!cliente.auth_user_id && (activeTab === 'treino' || activeTab === 'dieta')) {
    app.appendChild(el(
      '<div style="background:rgba(250,204,21,.08);border:1px solid rgba(250,204,21,.25);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:12.5px;color:#facc15;">' +
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:3px;flex-shrink:0;"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg> ' + cliente.nome + ' ainda não aceitou o convite de acesso — nada do que você montar aqui aparece pra ele até o cadastro dele ser concluído. Convide ou reenvie o convite no topo da página.' +
      '</div>'
    ));
  }
  const body = el('<div></div>');
  if (activeTab === 'treino') renderTreinoTab(body);
  else if (activeTab === 'dieta') renderDietaTab(body);
  else if (activeTab === 'cardio') renderCardioTab(body);
  else if (activeTab === 'anamnese') renderAnamneseTab(body);
  else if (activeTab === 'energetico') renderEnergeticoTab(body);
  else if (activeTab === 'fotos') renderFotosTab(body);
  else if (activeTab === 'feedback') renderFeedbackTab(body);
  else if (activeTab === 'agendamentos') renderAgendamentosTab(body);
  app.appendChild(body);
}

function renderAnamneseTab(container) {
  if (anamneseFormOpen) { renderAnamneseForm(container); return; }

  if (!anamnese) {
    container.appendChild(el('<div class="empty">Aguardando resposta do aluno. Assim que ele preencher a anamnese, as respostas aparecem aqui.</div>'));
    const preencherBtn = el('<button type="button" class="btn btn-outline btn-block">Preencher sexo, idade, altura e peso</button>');
    preencherBtn.addEventListener('click', () => { anamneseFormOpen = true; render(); });
    container.appendChild(preencherBtn);
    return;
  }
  const linha = (label, valor) => el(
    '<div class="list-row"><div class="list-row-meta" style="text-transform:uppercase;letter-spacing:.04em;font-size:10.5px;">' + label + '</div>' +
    '<div class="list-row-nome" style="margin-top:4px;">' + (valor || '—') + '</div></div>'
  );
  container.appendChild(linha('Objetivo', OBJETIVO_LABEL[anamnese.objetivo] || anamnese.objetivo));
  container.appendChild(linha('Nível de experiência', NIVEL_LABEL[anamnese.nivel] || anamnese.nivel));
  container.appendChild(linha('Sexo', anamnese.sexo === 'M' ? 'Masculino' : anamnese.sexo === 'F' ? 'Feminino' : null));
  container.appendChild(linha('Idade / Altura / Peso', [
    anamnese.idade ? anamnese.idade + ' anos' : null,
    anamnese.altura_cm ? anamnese.altura_cm + ' cm' : null,
    anamnese.peso_kg ? anamnese.peso_kg + ' kg' : null
  ].filter(Boolean).join(' · ') || null));
  container.appendChild(linha('Lesões / condições médicas', anamnese.lesoes));
  container.appendChild(linha('Medicamentos em uso', anamnese.medicamentos));
  container.appendChild(linha('Restrições alimentares', anamnese.restricoes));
  container.appendChild(el('<div class="sub" style="margin-top:6px;">Respondido em ' + new Date(anamnese.respondido_em).toLocaleDateString('pt-BR') + '</div>'));

  const editBtn = el('<button type="button" class="btn btn-outline btn-block" style="margin-top:14px;">Editar sexo, idade, altura e peso</button>');
  editBtn.addEventListener('click', () => { anamneseFormOpen = true; render(); });
  container.appendChild(editBtn);
}

function renderAnamneseForm(container) {
  const box = el('<div class="form-box"></div>');
  box.appendChild(el('<div class="sub" style="margin:0 0 16px;">Esses 4 dados alimentam automaticamente a calculadora de TMB/GET na aba Energético.</div>'));

  let sexoVal = anamnese ? (anamnese.sexo || '') : '';
  const sexoWrap = el('<div style="margin-bottom:14px;"></div>');
  sexoWrap.appendChild(el('<label>Sexo</label>'));
  const sexoRow = el('<div class="sexo-row"></div>');
  const chipM = el('<div class="chip' + (sexoVal === 'M' ? ' sel' : '') + '">Masculino</div>');
  const chipF = el('<div class="chip' + (sexoVal === 'F' ? ' sel' : '') + '">Feminino</div>');
  chipM.addEventListener('click', () => { sexoVal = 'M'; chipM.classList.add('sel'); chipF.classList.remove('sel'); });
  chipF.addEventListener('click', () => { sexoVal = 'F'; chipF.classList.add('sel'); chipM.classList.remove('sel'); });
  sexoRow.appendChild(chipM); sexoRow.appendChild(chipF);
  sexoWrap.appendChild(sexoRow);
  box.appendChild(sexoWrap);

  const row = el('<div class="field-row"></div>');
  const idade = el('<input type="number" min="0" placeholder="Ex: 28">');
  idade.value = anamnese && anamnese.idade != null ? anamnese.idade : '';
  const colIdade = el('<div></div>'); colIdade.appendChild(el('<label>Idade (anos)</label>')); colIdade.appendChild(idade);
  const altura = el('<input type="number" min="0" placeholder="Ex: 175">');
  altura.value = anamnese && anamnese.altura_cm != null ? anamnese.altura_cm : '';
  const colAltura = el('<div></div>'); colAltura.appendChild(el('<label>Altura (cm)</label>')); colAltura.appendChild(altura);
  row.appendChild(colIdade); row.appendChild(colAltura);
  box.appendChild(row);

  const peso = el('<input type="number" min="0" step="0.1" placeholder="Ex: 78.5">');
  peso.value = anamnese && anamnese.peso_kg != null ? anamnese.peso_kg : '';
  box.appendChild(el('<label>Peso (kg)</label>')); box.appendChild(peso);

  const erro = el('<div class="erro" style="display:none;"></div>');
  box.appendChild(erro);

  const actions = el('<div class="actions-row"></div>');
  const cancelBtn = el('<button type="button" class="btn btn-secondary">Cancelar</button>');
  cancelBtn.addEventListener('click', () => { anamneseFormOpen = false; render(); });
  const salvarBtn = el('<button type="button" class="btn btn-primary">Salvar</button>');
  salvarBtn.addEventListener('click', async () => {
    if (!sexoVal) { erro.textContent = 'Selecione o sexo.'; erro.style.display = ''; return; }
    if (!idade.value || !altura.value || !peso.value) { erro.textContent = 'Preencha idade, altura e peso.'; erro.style.display = ''; return; }
    salvarBtn.disabled = true; salvarBtn.textContent = 'Salvando…';
    const payload = {
      cliente_id: clienteIdParam, trainer_id: userId,
      sexo: sexoVal, idade: Number(idade.value), altura_cm: Number(altura.value), peso_kg: Number(peso.value)
    };
    const { error } = await supabaseClient.from('anamnese_respostas').upsert(payload, { onConflict: 'cliente_id' });
    if (error) { erro.textContent = error.message; erro.style.display = ''; salvarBtn.disabled = false; salvarBtn.textContent = 'Salvar'; return; }
    const { data } = await supabaseClient.from('anamnese_respostas').select('*').eq('cliente_id', clienteIdParam).maybeSingle();
    anamnese = data || null;
    anamneseFormOpen = false;
    render();
  });
  actions.appendChild(cancelBtn); actions.appendChild(salvarBtn);
  box.appendChild(actions);
  container.appendChild(box);
}

function renderEnergeticoTab(container) {
  const dadosCompletos = anamnese && anamnese.sexo && anamnese.idade && anamnese.altura_cm && anamnese.peso_kg;

  if (!dadosCompletos) {
    const warn = el('<div class="warn-box">Preencha sexo, idade, altura e peso do aluno pra calcular a TMB, o GET e a Meta Calórica.</div>');
    container.appendChild(warn);
    const irBtn = el('<button type="button" class="btn btn-outline btn-block">Preencher na aba Anamnese</button>');
    irBtn.addEventListener('click', () => { activeTab = 'anamnese'; anamneseFormOpen = true; render(); });
    container.appendChild(irBtn);
    return;
  }

  const salvarCampo = async (campo, valor) => {
    const payload = { cliente_id: clienteIdParam, trainer_id: userId, [campo]: valor };
    const { error } = await supabaseClient.from('anamnese_respostas').upsert(payload, { onConflict: 'cliente_id' });
    if (!error) anamnese[campo] = valor;
    render();
  };

  const renderGrupo = (titulo, opcoes, campo, mostrarExtra) => {
    container.appendChild(el('<label style="margin-top:2px;">' + titulo + '</label>'));
    const grupo = el('<div class="opt-group"></div>');
    opcoes.forEach(op => {
      const sel = anamnese[campo] === op.key;
      const card = el('<div class="opt-card' + (sel ? ' sel' : '') + '"></div>');
      card.appendChild(el('<div class="opt-nome">' + op.nome + '</div>'));
      if (op.desc) card.appendChild(el('<div class="opt-desc">' + op.desc + '</div>'));
      if (mostrarExtra && op.fator) card.appendChild(el('<div class="opt-fator">Fator ' + op.fator.toFixed(3).replace(/0+$/, '').replace(/\.$/, '') + '</div>'));
      card.addEventListener('click', () => salvarCampo(campo, op.key));
      grupo.appendChild(card);
    });
    container.appendChild(grupo);
  };

  container.appendChild(el('<div class="sub" style="margin:0 0 4px;">Atividade e Objetivos</div>'));
  renderGrupo('Nível de Atividade', NIVEL_ATIVIDADE_OPCOES, 'nivel_atividade', true);
  renderGrupo('Objetivo', OBJETIVO_CALORICO_OPCOES, 'objetivo_calorico', false);
  renderGrupo('Estado Atual', ESTADO_ATUAL_OPCOES, 'estado_atual', false);

  const nivelSel = NIVEL_ATIVIDADE_OPCOES.find(o => o.key === anamnese.nivel_atividade);
  const objSel = OBJETIVO_CALORICO_OPCOES.find(o => o.key === anamnese.objetivo_calorico);
  const estadoSel = ESTADO_ATUAL_OPCOES.find(o => o.key === anamnese.estado_atual);

  const tmb = calcularTMB(anamnese.sexo, anamnese.peso_kg, anamnese.altura_cm, anamnese.idade);
  const get = nivelSel ? tmb * nivelSel.fator : null;
  const meta = get != null && objSel ? get * objSel.percentual : null;

  container.appendChild(el('<div class="sub" style="margin:18px 0 4px;">Resultados da Sua Dieta</div>'));
  const grid = el('<div class="result-grid"></div>');
  [
    ['Taxa Metabólica Basal (TMB)', Math.round(tmb) + ' kcal'],
    ['Gasto Energético Total (TDEE)', get != null ? Math.round(get) + ' kcal' : '—'],
    ['Meta Calórica', meta != null ? Math.round(meta) + ' kcal' : '—']
  ].forEach(([label, val]) => {
    const box = el('<div class="result-box"></div>');
    box.appendChild(el('<div class="result-num">' + val + '</div>'));
    box.appendChild(el('<div class="result-label">' + label + '</div>'));
    grid.appendChild(box);
  });
  container.appendChild(grid);

  container.appendChild(el(
    '<div class="result-summary">' +
    'Nível de Atividade: <b>' + (nivelSel ? nivelSel.nome : 'não selecionado') + '</b><br>' +
    'Objetivo: <b>' + (objSel ? objSel.nome : 'não selecionado') + '</b><br>' +
    'Estado Atual: <b>' + (estadoSel ? estadoSel.nome : 'não selecionado') + '</b>' +
    '</div>'
  ));
}

function conviteStatusInfo() {
  if (cliente.auth_user_id) return { label: 'Cadastro concluído', cls: 'badge-convite-aceito', acao: null };
  if (!convite) return { label: 'Convite não enviado', cls: 'badge-convite-none', acao: 'Convidar aluno por e-mail' };
  const expirado = convite.expires_at && new Date(convite.expires_at) < new Date();
  if (expirado) return { label: 'Convite expirado', cls: 'badge-convite-expirado', acao: 'Reenviar convite' };
  return { label: 'Aguardando cadastro', cls: 'badge-convite-pendente', acao: 'Reenviar convite' };
}

  const nome = cliente.nome || clienteNomeParam || 'Aluno';

  if (conviteLinkAberto && convite) {
    const link = window.location.origin + window.location.pathname.replace('aluno-detalhe.html', '') + 'convite.html?token=' + convite.token;
    const box = el(

async function gerarConviteCliente() {
  if (!cliente.email) { alert('Esse aluno ainda não tem e-mail cadastrado.'); return; }
  const { data, error } = await supabaseClient.from('convites')
    .insert({ trainer_id: userId, cliente_id: cliente.id, email: cliente.email })
    .select().single();
  if (error) { alert('Não foi possível gerar o convite: ' + error.message); return; }
  convite = data;
  conviteLinkAberto = true;
  render();
}

function notificarCliente() {
  if (!cliente.telefone) { alert('Esse aluno ainda não tem telefone cadastrado.'); return; }
  let digits = cliente.telefone.replace(/\D/g, '');
  if (digits.length <= 11) digits = '55' + digits;

let taDetalheCargas = {}; // treino_exercicio_id -> serie_index -> [{data, carga}, ...] desc por data
let taDetalheFeitosHoje = {}; // treino_exercicio_id -> true (marcado hoje pelo aluno)
let taDetalheExecucoes = []; // [{data, created_at}, ...] desc por data — histórico de "finalizar treino" deste treino

const TA_HOJE_ISO = new Date().toISOString().slice(0, 10);

async function openTaDetalhe(treinoId) {
  taDetalheId = treinoId;
  taAddExOpen = false;
  const { data } = await supabaseClient
    .from('treino_exercicios')
    .select('*, exercicios(nome)')
    .eq('treino_id', treinoId)
    .order('ordem', { ascending: true });
  taDetalheExercicios = data || [];
  taDetalheCargas = {};
  taDetalheFeitosHoje = {};
  const { data: execs } = await supabaseClient
    .from('treino_execucoes')
    .select('data, created_at')
    .eq('treino_id', treinoId)
    .order('data', { ascending: false });
  taDetalheExecucoes = execs || [];
  if (taDetalheExercicios.length) {
    const [{ data: cargas }, { data: feitosHoje }] = await Promise.all([
      supabaseClient.from('serie_cargas').select('treino_exercicio_id, serie_index, carga, data')
        .in('treino_exercicio_id', taDetalheExercicios.map(te => te.id)).order('data', { ascending: false }),
      supabaseClient.from('treino_exercicio_execucoes').select('treino_exercicio_id')
        .in('treino_exercicio_id', taDetalheExercicios.map(te => te.id)).eq('data', TA_HOJE_ISO)
    ]);
    (cargas || []).forEach(c => {
      const porExercicio = taDetalheCargas[c.treino_exercicio_id] || (taDetalheCargas[c.treino_exercicio_id] = {});
      const lista = porExercicio[c.serie_index] || (porExercicio[c.serie_index] = []);
      if (lista.length < 2) lista.push(c);
    });
    (feitosHoje || []).forEach(r => { taDetalheFeitosHoje[r.treino_exercicio_id] = true; });
  }
  render();
}

function renderStatusTreino() {
  if (!taDetalheExecucoes.length) return null;
  const box = el('<div style="background:#0d1119;border:1px solid #1e2633;border-radius:12px;padding:14px 16px;margin-bottom:16px;"></div>');
  const ultima = taDetalheExecucoes[0];
  const fmtData = (d) => new Date(d + 'T00:00:00').toLocaleDateString('pt-BR');
  const fmtHora = (ts) => new Date(ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  const destaque = ultima.data === TA_HOJE_ISO
    ? '✓ Treino finalizado hoje às ' + fmtHora(ultima.created_at)
    : '✓ Última finalização: ' + fmtData(ultima.data) + ' às ' + fmtHora(ultima.created_at);
  box.appendChild(el('<div style="font-size:13px;font-weight:800;color:#4ade80;">' + destaque + '</div>'));
  if (taDetalheExecucoes.length > 1) {
    const historico = taDetalheExecucoes.slice(1, 6).map(e => fmtData(e.data)).join(' · ');
    box.appendChild(el('<div style="font-size:11.5px;color:#66707e;margin-top:4px;">Histórico: ' + historico + '</div>'));
  }
  const feedbacksDoTreino = feedbacksList.filter(f => f.treino_id === taDetalheId);
  if (feedbacksDoTreino.length) {
    const fbWrap = el('<div style="margin-top:10px;padding-top:10px;border-top:1px solid #1a2130;"></div>');
    feedbacksDoTreino.slice(0, 3).forEach(f => {
      fbWrap.appendChild(el(
        '<div style="font-size:12px;color:#9aa4b2;margin-top:4px;"><b style="color:#c7ccd6;">Feedback (' + fmtData(f.created_at.slice(0, 10)) + '):</b> ' + (f.comentario || '—') + '</div>'
      ));
    });
    box.appendChild(fbWrap);
  }
  return box;
}

// "Série N — texto — atual (anterior: X)": só aparece quando o aluno já
// registrou pelo menos uma carga naquela série; nunca inventa um valor.
function renderCargasSerieList(te) {
  const cargasPorSerie = taDetalheCargas[te.id];
  if (!cargasPorSerie || !Object.keys(cargasPorSerie).length) return null;
  const linhas = (te.series || '').split('\n').map(s => s.trim()).filter(Boolean);
  const wrap = el('<div style="margin-top:8px;padding-top:8px;border-top:1px dashed #1e2633;display:flex;flex-direction:column;gap:3px;"></div>');
  let algumaLinha = false;
  linhas.forEach((texto, si) => {
    const historico = cargasPorSerie[si];
    if (!historico || !historico.length) return;
    algumaLinha = true;
    const atual = historico[0];
    const anterior = historico[1];
    const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    let txt = 'Série ' + (si + 1) + ' — ' + texto + ' — Carga utilizada: <b style="color:#4ade80;">' + esc(atual.carga) + '</b>';
    if (anterior && anterior.carga !== atual.carga) txt += ' <span style="color:#66707e;">(anterior: ' + esc(anterior.carga) + ')</span>';
    wrap.appendChild(el('<div style="font-size:11.5px;color:#9aa4b2;">' + txt + '</div>'));
  });
  return algumaLinha ? wrap : null;
}

function renderTaDetalhe(container) {
  const treino = treinos.find(t => t.id === taDetalheId) || {};
  const head = el('<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;"><div style="font-size:15px;font-weight:800;">' + (treino.nome || '') + '</div></div>');
  const back = el('<button type="button" class="btn-ghost" style="color:#9aa4b2;">← Voltar aos treinos</button>');
  back.addEventListener('click', () => { taDetalheId = ''; render(); });
  head.appendChild(back);
  container.appendChild(head);

  const statusTreino = renderStatusTreino();
  if (statusTreino) container.appendChild(statusTreino);

  if (!taDetalheExercicios.length) {
    container.appendChild(el('<div class="empty">Nenhum exercício adicionado ainda.</div>'));
  }
  taDetalheExercicios.forEach(te => {
    const tec = tecnicasLib.find(t => t.id === te.tecnica_avancada);
    const feitoHoje = !!taDetalheFeitosHoje[te.id];
    const item = el(
      '<div class="ex-item">' +
        '<div class="ex-nome">' + (feitoHoje ? '<span style="color:#4ade80;">☑</span> ' : '<span style="color:#4a5364;">☐</span> ') + ((te.exercicios || {}).nome || 'Exercício') + '</div>' +
        '<div class="ex-meta">' + (te.series || 'sem séries definidas') + ' · ' + (te.intervalo_descanso || 'sem descanso definido') + ' · ' + (tec ? tec.nome : 'Sem técnica avançada') + '</div>' +
      '</div>'
    );
    const cargasList = renderCargasSerieList(te);
    if (cargasList) item.appendChild(cargasList);
    container.appendChild(item);
  });

  if (taAddExOpen) {
    const box = el('<div class="form-box"></div>');
    const select = el('<select><option value="">Selecione…</option></select>');
    exerciciosLib.forEach(ex => select.appendChild(el('<option value="' + ex.id + '">' + ex.nome + '</option>')));
    box.appendChild(el('<label>Exercício</label>'));
    box.appendChild(select);

    const series = el('<textarea rows="2" placeholder="Ex: 3x12, 4x8-10, 3x15" maxlength="250" style="margin-top:14px;"></textarea>');
    box.appendChild(el('<label style="margin-top:14px;">Séries</label>'));
    box.appendChild(series);

    const descanso = el('<textarea rows="2" placeholder="Ex: 60s, 1-2min" maxlength="50" style="margin-top:14px;"></textarea>');
    box.appendChild(el('<label style="margin-top:14px;">Intervalo de descanso</label>'));
    box.appendChild(descanso);

    const tecnica = el('<select style="margin-top:14px;"><option value="nenhuma">Nenhuma técnica avançada</option></select>');
    tecnicasLib.forEach(t => {
      const opt = el('<option></option>');
      opt.value = t.id;
      opt.textContent = t.nome;
      tecnica.appendChild(opt);
    });
    box.appendChild(el('<label style="margin-top:14px;">Técnica avançada</label>'));
    box.appendChild(tecnica);

    const erro = el('<div class="erro" style="display:none;"></div>');
    box.appendChild(erro);

    const actions = el('<div class="actions-row"></div>');
    const cancelBtn = el('<button type="button" class="btn btn-secondary">Cancelar</button>');
    cancelBtn.addEventListener('click', () => { taAddExOpen = false; render(); });
    const salvarBtn = el('<button type="button" class="btn btn-primary">Adicionar</button>');
    salvarBtn.addEventListener('click', async () => {
      if (!select.value) { erro.textContent = 'Escolha um exercício.'; erro.style.display = ''; return; }
      salvarBtn.disabled = true; salvarBtn.textContent = 'Salvando…';
      const { error } = await supabaseClient.from('treino_exercicios').insert({
        treino_id: taDetalheId, exercicio_id: select.value,
        series: series.value.trim() || null, intervalo_descanso: descanso.value.trim() || null,
        tecnica_avancada: tecnica.value
      });
      if (error) { erro.textContent = error.message; erro.style.display = ''; salvarBtn.disabled = false; salvarBtn.textContent = 'Adicionar'; return; }
      taAddExOpen = false;
      await openTaDetalhe(taDetalheId);
    });
    actions.appendChild(cancelBtn); actions.appendChild(salvarBtn);
    box.appendChild(actions);
    container.appendChild(box);
  } else {
    const addBtn = el('<button type="button" class="btn btn-outline btn-block">+ Adicionar Exercício</button>');
    addBtn.addEventListener('click', () => { taAddExOpen = true; render(); });
    container.appendChild(addBtn);
  }
}

function montarDietaUrl(dietaId) {
  let url = 'montar-dieta.html?cliente_id=' + clienteIdParam;
  if (clienteNomeParam) url += '&cliente_nome=' + encodeURIComponent(clienteNomeParam);
  if (dietaId) url += '&dieta_id=' + dietaId;
  return url;
}

function resumoRefeicao(r) {
  if (r.opcoes && r.opcoes.length) {
    return r.opcoes[0].itens.map(it => it.nome + ' (' + it.quantidade_g + 'g)').join(', ') || 'Sem alimentos ainda';
  }
  return r.itens || '';
}

function renderDietaTab(container) {
  if (!dietaList.length) {
    container.appendChild(el('<div class="empty">Nenhuma dieta atribuída a esse aluno ainda.</div>'));

  dietaList.forEach(d => {
    const row = el(

      '</div>'

    (d.refeicoes || []).forEach(r => {
      row.appendChild(el('<div class="ex-item"><div class="ex-nome">' + r.nome + '</div><div class="ex-meta">' + resumoRefeicao(r) + '</div></div>'));

    const actions = el('<div class="list-row-actions"></div>');

    const delBtn = el('<button type="button" class="btn-ghost">Excluir</button>');

      render();
    });
    actions.appendChild(editBtn); actions.appendChild(delBtn);
    row.appendChild(actions);
    container.appendChild(row);
  });

  const novoBtn = el('<a class="btn btn-outline btn-block" style="margin-top:6px;display:block;text-align:center;" href="' + montarDietaUrl() + '">+ Criar dieta</a>');
  container.appendChild(novoBtn);
}

// ---------- CARDIO ----------

function renderCardioTab(container) {
  if (cardioFormOpen) { renderCardioForm(container); return; }

  if (!cardioList.length) {
    container.appendChild(el('<div class="empty">Nenhum protocolo de cardio cadastrado ainda.</div>'));
  }
  cardioList.forEach(c => {
    const row = el(
      '<div class="list-row">' +
        '<div class="list-row-nome">' + (c.tipo || 'Cardio') + '</div>' +
        '<div class="list-row-meta">' + [
          c.duracao_min ? c.duracao_min + ' min' : null,
          c.frequencia_semanal ? c.frequencia_semanal + 'x por semana' : null,
          c.intensidade ? 'intensidade ' + c.intensidade : null
        ].filter(Boolean).join(' · ') + '</div>' +
        (c.observacoes ? '<div class="list-row-meta" style="margin-top:6px;">' + c.observacoes + '</div>' : '') +
        (c.cardio_opcional ? '<div class="list-row-meta" style="margin-top:6px;color:#f97316;">Cardio opcional: ' + c.cardio_opcional + '</div>' : '') +
      '</div>'
    );
    const actions = el('<div class="list-row-actions"></div>');
    const editBtn = el('<button type="button" class="btn-ghost" style="color:#9aa4b2;">Editar</button>');
    editBtn.addEventListener('click', () => { cardioEditId = c.id; cardioFormOpen = true; render(); });
    const delBtn = el('<button type="button" class="btn-ghost">Excluir</button>');
    delBtn.addEventListener('click', async () => {
      if (!window.confirm('Excluir esse protocolo de cardio?')) return;
      await supabaseClient.from('cardio_protocolos').delete().eq('id', c.id);
      cardioList = cardioList.filter(x => x.id !== c.id);
      render();
    });
    actions.appendChild(editBtn); actions.appendChild(delBtn);
    row.appendChild(actions);
    container.appendChild(row);
  });

  const novoBtn = el('<button type="button" class="btn btn-outline btn-block" style="margin-top:6px;">+ Novo protocolo de cardio</button>');
  novoBtn.addEventListener('click', () => { cardioEditId = ''; cardioFormOpen = true; render(); });
  container.appendChild(novoBtn);
}

function renderCardioForm(container) {
  const editando = cardioList.find(c => c.id === cardioEditId);
  const box = el('<div class="form-box"></div>');

  const tipo = el('<input type="text" placeholder="Ex: Esteira, bike, HIIT">');
  tipo.value = editando ? (editando.tipo || '') : '';
  box.appendChild(el('<label>Tipo</label>')); box.appendChild(tipo);

  const row = el('<div class="field-row" style="margin-top:14px;"></div>');
  const duracao = el('<input type="number" min="0" placeholder="Ex: 30">');
  duracao.value = editando && editando.duracao_min != null ? editando.duracao_min : '';
  const freq = el('<input type="number" min="0" placeholder="Ex: 3">');
  freq.value = editando && editando.frequencia_semanal != null ? editando.frequencia_semanal : '';
  const colA = el('<div></div>'); colA.appendChild(el('<label>Duração (min)</label>')); colA.appendChild(duracao);
  const colB = el('<div></div>'); colB.appendChild(el('<label>Frequência semanal</label>')); colB.appendChild(freq);
  row.appendChild(colA); row.appendChild(colB);
  box.appendChild(row);

  const intensidade = el('<input type="text" placeholder="Ex: leve, moderada, intensa" style="margin-top:14px;">');
  intensidade.value = editando ? (editando.intensidade || '') : '';
  box.appendChild(el('<label style="margin-top:14px;">Intensidade</label>')); box.appendChild(intensidade);

  const obsRow = el('<div class="field-row" style="margin-top:14px;"></div>');
  const obs = el('<textarea rows="3" placeholder="Observações"></textarea>');
  obs.value = editando ? (editando.observacoes || '') : '';
  const colObs = el('<div></div>'); colObs.appendChild(el('<label>Observações</label>')); colObs.appendChild(obs);
  const cardioOpcional = el('<textarea rows="3" placeholder="Ex: HIIT extra aos sábados, caminhada complementar…"></textarea>');
  cardioOpcional.value = editando ? (editando.cardio_opcional || '') : '';
  const colCardioOpcional = el('<div></div>'); colCardioOpcional.appendChild(el('<label>Cardio opcional</label>')); colCardioOpcional.appendChild(cardioOpcional);
  obsRow.appendChild(colObs); obsRow.appendChild(colCardioOpcional);
  box.appendChild(obsRow);

  const erro = el('<div class="erro" style="display:none;"></div>');
  box.appendChild(erro);

  const actions = el('<div class="actions-row"></div>');
  const cancelBtn = el('<button type="button" class="btn btn-secondary">Cancelar</button>');
  cancelBtn.addEventListener('click', () => { cardioFormOpen = false; render(); });
  const salvarBtn = el('<button type="button" class="btn btn-primary">' + (editando ? 'Salvar alterações' : 'Criar protocolo') + '</button>');
  salvarBtn.addEventListener('click', async () => {
    if (!tipo.value.trim()) { erro.textContent = 'Digite o tipo de cardio.'; erro.style.display = ''; return; }
    salvarBtn.disabled = true; salvarBtn.textContent = 'Salvando…';
    const payload = {
      tipo: tipo.value.trim(),
      duracao_min: duracao.value ? Number(duracao.value) : null,
      frequencia_semanal: freq.value ? Number(freq.value) : null,
      intensidade: intensidade.value.trim() || null,
      observacoes: obs.value.trim() || null,
      cardio_opcional: cardioOpcional.value.trim() || null
    };
    let error;
    if (editando) {
      ({ error } = await supabaseClient.from('cardio_protocolos').update(payload).eq('id', editando.id));
    } else {
      ({ error } = await supabaseClient.from('cardio_protocolos').insert({ ...payload, trainer_id: userId, cliente_id: clienteIdParam }));
    }
    if (error) { erro.textContent = error.message; erro.style.display = ''; salvarBtn.disabled = false; salvarBtn.textContent = editando ? 'Salvar alterações' : 'Criar protocolo'; return; }
    const { data } = await supabaseClient.from('cardio_protocolos').select('*').eq('cliente_id', clienteIdParam).order('created_at', { ascending: false });
    cardioList = data || [];
    cardioFormOpen = false;
    render();
  });
  actions.appendChild(cancelBtn); actions.appendChild(salvarBtn);
  box.appendChild(actions);
  container.appendChild(box);
}

// ---------- FOTOS ----------

function renderFotosTab(container) {
  const inicial = fotosList.filter(f => f.tipo === 'inicial');
  const evolucao = fotosList.filter(f => f.tipo === 'evolucao');

  if (!fotosList.length) {
    container.appendChild(el('<div class="empty">Nenhuma foto enviada ainda. As fotos aparecem aqui assim que o aluno enviar pela anamnese ou pelo app.</div>'));
    return;
  }

  const galeria = (titulo, lista) => {
    if (!lista.length) return;
    container.appendChild(el('<div class="sub" style="margin:0 0 10px;font-weight:700;color:#e5e9f0;">' + titulo + '</div>'));
    const grid = el('<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:22px;"></div>');
    lista.forEach(f => {
      grid.appendChild(el('<img src="' + f.url + '" style="width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;border:1px solid #1e2633;">'));
    });
    container.appendChild(grid);
  };

  galeria('Fotos iniciais (anamnese)', inicial);
  galeria('Evolução', evolucao);
}

// ---------- FEEDBACK ----------

function renderFeedbackRow(f, treinoNome) {
  return el(
    '<div class="list-row">' +
      '<div class="list-row-nome">' + (treinoNome || (f.humor || 'Sem humor registrado') + (f.rpe ? ' · RPE ' + f.rpe : '')) + '</div>' +
      '<div class="list-row-meta">' + new Date(f.created_at).toLocaleDateString('pt-BR') + '</div>' +
      (f.comentario ? '<div class="list-row-meta" style="margin-top:6px;">' + f.comentario + '</div>' : '') +
    '</div>'
  );
}

function renderFeedbackTab(container) {
  if (!feedbacksList.length) {
    container.appendChild(el('<div class="empty">Nenhum feedback enviado ainda.</div>'));
    return;
  }
  const gerais = feedbacksList.filter(f => !f.treino_id);
  const porTreino = feedbacksList.filter(f => f.treino_id);

  container.appendChild(el('<div class="sub" style="margin-bottom:10px;">Feedback geral (aba Evolução do aluno)</div>'));
  if (!gerais.length) {
    container.appendChild(el('<div class="empty">Nenhum feedback geral ainda.</div>'));
  }
  gerais.forEach(f => container.appendChild(renderFeedbackRow(f)));

  container.appendChild(el('<div class="sub" style="margin:22px 0 10px;">Feedback de cada treino</div>'));
  if (!porTreino.length) {
    container.appendChild(el('<div class="empty">Nenhum feedback de treino ainda.</div>'));
  }
  porTreino.forEach(f => {
    const treino = treinos.find(t => t.id === f.treino_id);
    container.appendChild(renderFeedbackRow(f, treino ? treino.nome : 'Treino removido'));
  });
}

// ---------- AGENDAMENTOS ----------

const TIPOS_AGENDAMENTO = [
  ['revisao_treino', 'Revisão de treino'],
  ['revisao_dieta', 'Revisão de dieta'],
  ['reavaliacao', 'Reavaliação'],
  ['outro', 'Outro']
];

function renderAgendamentosTab(container) {
  container.appendChild(el('<div class="sub" style="margin-bottom:16px;">Lembretes só visíveis pra você — o aluno não vê essa aba.</div>'));

  if (agFormOpen) { renderAgendamentoForm(container); return; }

  if (!agendamentosList.length) {
    container.appendChild(el('<div class="empty">Nenhum agendamento criado ainda.</div>'));
  }
  agendamentosList.forEach(ag => {
    const tipoLabel = (TIPOS_AGENDAMENTO.find(t => t[0] === ag.tipo) || [, ag.tipo || ''])[1];
    const row = el(
      '<div class="list-row" style="opacity:' + (ag.concluido ? '.55' : '1') + ';">' +
        '<div class="list-row-nome">' + ag.titulo + (ag.concluido ? ' ✓' : '') + '</div>' +
        '<div class="list-row-meta">' + tipoLabel + ' · ' + new Date(ag.data_lembrete + 'T00:00:00').toLocaleDateString('pt-BR') + '</div>' +
        (ag.observacoes ? '<div class="list-row-meta" style="margin-top:6px;">' + ag.observacoes + '</div>' : '') +
      '</div>'
    );
    const actions = el('<div class="list-row-actions"></div>');
    const toggleBtn = el('<button type="button" class="btn-ghost" style="color:#9aa4b2;">' + (ag.concluido ? 'Reabrir' : 'Concluir') + '</button>');
    toggleBtn.addEventListener('click', async () => {
      await supabaseClient.from('agendamentos').update({ concluido: !ag.concluido }).eq('id', ag.id);
      ag.concluido = !ag.concluido;
      render();
    });
    const delBtn = el('<button type="button" class="btn-ghost">Excluir</button>');
    delBtn.addEventListener('click', async () => {
      if (!window.confirm('Excluir esse agendamento?')) return;
      await supabaseClient.from('agendamentos').delete().eq('id', ag.id);
      agendamentosList = agendamentosList.filter(x => x.id !== ag.id);
      render();
    });
    actions.appendChild(toggleBtn); actions.appendChild(delBtn);
    row.appendChild(actions);
    container.appendChild(row);
  });

  const novoBtn = el('<button type="button" class="btn btn-outline btn-block" style="margin-top:6px;">+ Novo agendamento</button>');
  novoBtn.addEventListener('click', () => { agFormOpen = true; render(); });
  container.appendChild(novoBtn);
}

function renderAgendamentoForm(container) {
  const box = el('<div class="form-box"></div>');

  const titulo = el('<input type="text" placeholder="Ex: Revisar treino de pernas">');
  box.appendChild(el('<label>Título</label>')); box.appendChild(titulo);

  const row = el('<div class="field-row" style="margin-top:14px;"></div>');
  const tipo = el('<select></select>');
  TIPOS_AGENDAMENTO.forEach(([v, l]) => tipo.appendChild(el('<option value="' + v + '">' + l + '</option>')));
  const data = el('<input type="date">');
  const colA = el('<div></div>'); colA.appendChild(el('<label>Tipo</label>')); colA.appendChild(tipo);
  const colB = el('<div></div>'); colB.appendChild(el('<label>Data</label>')); colB.appendChild(data);
  row.appendChild(colA); row.appendChild(colB);
  box.appendChild(row);

  const obs = el('<textarea rows="3" placeholder="Observações" style="margin-top:14px;"></textarea>');
  box.appendChild(el('<label style="margin-top:14px;">Observações</label>')); box.appendChild(obs);

  const erro = el('<div class="erro" style="display:none;"></div>');
  box.appendChild(erro);

  const actions = el('<div class="actions-row"></div>');
  const cancelBtn = el('<button type="button" class="btn btn-secondary">Cancelar</button>');
  cancelBtn.addEventListener('click', () => { agFormOpen = false; render(); });
  const salvarBtn = el('<button type="button" class="btn btn-primary">Criar agendamento</button>');
  salvarBtn.addEventListener('click', async () => {
    if (!titulo.value.trim()) { erro.textContent = 'Digite um título.'; erro.style.display = ''; return; }
    if (!data.value) { erro.textContent = 'Escolha uma data.'; erro.style.display = ''; return; }
    salvarBtn.disabled = true; salvarBtn.textContent = 'Salvando…';
    const { error } = await supabaseClient.from('agendamentos').insert({
      trainer_id: userId, cliente_id: clienteIdParam, titulo: titulo.value.trim(),
      tipo: tipo.value, data_lembrete: data.value, observacoes: obs.value.trim() || null
    });
    if (error) { erro.textContent = error.message; erro.style.display = ''; salvarBtn.disabled = false; salvarBtn.textContent = 'Criar agendamento'; return; }
    const { data: rows } = await supabaseClient.from('agendamentos').select('*').eq('cliente_id', clienteIdParam).order('data_lembrete', { ascending: true });
    agendamentosList = rows || [];
    agFormOpen = false;
    render();
  });
  actions.appendChild(cancelBtn); actions.appendChild(salvarBtn);
  box.appendChild(actions);
  container.appendChild(box);
}

init();
</script>
