<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Admin — Elo Fitness</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<style>
:root{
  --bg:#0a0d13; --bg-sidebar:#0d1119; --bg-card:#10151f; --bg-hover:#141a26; --bg-ativo:#1e2633;
  --borda:#171d29; --borda-forte:#1a2130; --borda-aviso:#3a2418;
  --texto:#e5e9f0; --texto-2:#9aa4b2; --texto-3:#c4cad4; --texto-4:#66707e;
  --status-azul:#60a5fa; --status-verde:#4ade80;
}
html[data-tema="claro"]{
  --bg:#f4f5f7; --bg-sidebar:#eef0f3; --bg-card:#ffffff; --bg-hover:#e9ebef; --bg-ativo:#d5dae2;
  --borda:#e4e7ec; --borda-forte:#dfe3e9; --borda-aviso:#fdece3;
  --texto:#10151f; --texto-2:#5b6472; --texto-3:#3a4452; --texto-4:#7c8593;
  --status-azul:#2563eb; --status-verde:#16a34a;
}
html,body{margin:0;padding:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--texto);}
*{box-sizing:border-box;}
a{color:#f97316;text-decoration:none;}
button,select{font-family:inherit;cursor:pointer;}

.shell{display:flex;min-height:100vh;}

.sidebar{width:240px;flex:none;background:var(--bg-sidebar);border-right:1px solid var(--borda);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 20px;}
.logo-badge{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#f97316,#ea580c);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px;flex:none;}
.logo-text{font-size:16px;font-weight:800;}
.logo-text span{color:#f97316;}
.nav-group-label{font-size:10.5px;font-weight:800;color:var(--texto-4);text-transform:uppercase;letter-spacing:.06em;padding:14px 10px 6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--texto-3);cursor:pointer;margin-bottom:1px;}
.nav-item:hover{background:var(--bg-hover);}
.nav-item.active{background:rgba(249,115,22,.12);color:#f97316;}
.nav-item .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7;flex:none;}
.sidebar-foot{margin-top:auto;padding-top:10px;}
.sidebar-foot .sair-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--texto-3);cursor:pointer;text-decoration:none;}
.sidebar-foot .sair-item:hover{background:var(--bg-hover);color:#f87171;}
.sidebar-foot .conta{display:flex;align-items:center;gap:10px;padding:14px 10px 0;border-top:1px solid var(--borda);margin-top:10px;}
.sidebar-foot .conta-avatar{width:34px;height:34px;flex:none;border-radius:50%;background:rgba(249,115,22,.15);color:#f97316;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
.sidebar-foot .conta-info{min-width:0;}
.sidebar-foot .conta-badge{font-size:10px;font-weight:800;color:#f97316;text-transform:uppercase;letter-spacing:.04em;}
.sidebar-foot .conta-email{font-size:11.5px;color:var(--texto-4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.main{flex:1;min-width:0;}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:22px 28px 18px;border-bottom:1px solid var(--borda);flex-wrap:wrap;}
.topbar h1{font-size:20px;font-weight:800;margin:0 0 4px;}
.topbar .sub{font-size:12.5px;color:var(--texto-2);}
.topbar-controls{display:flex;align-items:center;gap:8px;flex:none;}
.period-group{display:flex;background:var(--bg-card);border:1px solid var(--borda-forte);border-radius:9px;padding:3px;}
.period-btn{background:none;border:none;color:var(--texto-2);font-size:12px;font-weight:700;padding:6px 12px;border-radius:6px;}
.period-btn.active{background:var(--bg-ativo);color:var(--texto);}
.btn-export{background:var(--bg-card);border:1px solid var(--borda-forte);color:var(--texto);font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:9px;}
.btn-export:hover{background:var(--borda);}

.wrap{max-width:1160px;padding:24px 28px 80px;}
h2{font-size:13px;font-weight:800;color:var(--texto-2);text-transform:uppercase;letter-spacing:.04em;margin:26px 0 12px;}
h2:first-of-type{margin-top:0;}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;}
.card{background:var(--bg-card);border:1px solid var(--borda-forte);border-radius:14px;padding:16px 18px;}
.card.warn{border-color:var(--borda-aviso);}
.card.highlight{border-color:#f97316;}
.card .label{font-size:11px;font-weight:800;color:var(--texto-2);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px;}
.card.warn .label{color:#f97316;}
.card .val{font-size:24px;font-weight:800;}
.card .delta{font-size:11.5px;color:var(--texto-4);margin-top:6px;}

.panel{background:var(--bg-card);border:1px solid var(--borda-forte);border-radius:14px;padding:20px 22px;margin-top:14px;}
.panel h3{font-size:14.5px;font-weight:800;margin:0 0 2px;}
.panel .panel-sub{font-size:12px;color:var(--texto-2);margin-bottom:16px;}

.empty-panel{padding:48px 24px;text-align:center;color:var(--texto-4);font-size:13.5px;}
.empty-panel strong{display:block;color:var(--texto-2);font-size:14.5px;margin-bottom:6px;}

table{width:100%;border-collapse:collapse;}
th,td{text-align:left;padding:10px 12px;font-size:13px;border-bottom:1px solid var(--borda);}
th{color:var(--texto-2);font-size:11px;text-transform:uppercase;letter-spacing:.03em;font-weight:700;}
tr:last-child td{border-bottom:none;}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;}
.badge-trial{background:rgba(96,165,250,.15);color:var(--status-azul);}
.badge-ativo{background:rgba(74,222,128,.15);color:var(--status-verde);}
.badge-inadimplente{background:rgba(249,115,22,.15);color:#f97316;}
.badge-isento{background:rgba(154,164,178,.15);color:var(--texto-2);}
.bar-track{background:var(--borda-forte);border-radius:999px;height:6px;width:100px;overflow:hidden;display:inline-block;vertical-align:middle;}
.bar-fill{height:100%;background:#f97316;}
.funnel-row{margin-bottom:16px;}
.funnel-row:last-child{margin-bottom:0;}
.funnel-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
.funnel-top b{font-weight:700;}
.funnel-track{background:var(--borda);border-radius:6px;height:8px;overflow:hidden;}
.funnel-fill{height:100%;background:#f97316;border-radius:6px;}
.funnel-note{font-size:11.5px;color:var(--texto-4);margin-top:4px;}
.msg{padding:40px;text-align:center;color:var(--texto-2);font-size:14px;}
</style>
</head>
<body>

<div class="shell">
  <div class="sidebar">
    <div class="logo">
      <div class="logo-badge">E</div>
      <div class="logo-text">Elo <span>Fitness</span></div>
    </div>
    <div class="nav-group-label">Visão geral</div>
    <div class="nav-item" data-page="dashboard"><span class="dot"></span>Dashboard</div>
    <div class="nav-item" data-page="receita"><span class="dot"></span>Receita</div>
    <div class="nav-item" data-page="usuarios"><span class="dot"></span>Usuários</div>
    <div class="nav-group-label">Crescimento</div>
    <div class="nav-item" data-page="afiliados"><span class="dot"></span>Afiliados</div>
    <div class="nav-group-label">Plataforma</div>
    <div class="nav-item" data-page="operacao"><span class="dot"></span>Operação</div>
    <div class="sidebar-foot">
      <a href="#" id="btn-sair" class="sair-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg>
        Sair
      </a>
      <div class="conta">
        <div class="conta-avatar" id="admin-avatar">A</div>
        <div class="conta-info">
          <div class="conta-badge">Admin</div>
          <div class="conta-email" id="admin-email">—</div>
        </div>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div>
        <h1 id="page-title">Painel Admin</h1>
        <div class="sub" id="page-sub"></div>
      </div>
      <div class="topbar-controls">
        <div class="period-group" id="period-group">
          <button class="period-btn" data-period="7">7d</button>
          <button class="period-btn active" data-period="30">30d</button>
          <button class="period-btn" data-period="90">90d</button>
          <button class="period-btn" data-period="365">12m</button>
        </div>
        <button class="btn-export" id="btn-export">Exportar CSV</button>
      </div>
    </div>
    <div class="wrap" id="app">
      <div class="msg">Carregando…</div>
    </div>
  </div>
</div>

<script>
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function fmtBRL(n) {
  return 'R$ ' + Number(n || 0).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?=,))/g, '.');
}
function fmtPct(n) {
  return Number(n || 0).toFixed(1).replace('.', ',') + '%';
}
function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function monthKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
const MESES_ABREV = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
function last12Months() {
  const out = [];
  const now = new Date();
  for (let i = 11; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    out.push({ key: monthKey(d), label: MESES_ABREV[d.getMonth()] });
  }
  return out;
}

const STATE = { periodDays: 30, page: 'dashboard', raw: null, usuariosSubTab: 'personal' };

async function init() {
  const app = document.getElementById('app');
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) { window.location.href = 'adm.html'; return; }

  const { data: eu } = await supabaseClient.from('admins').select('email').eq('id', user.id).maybeSingle();
  if (!eu) {
    app.innerHTML = '';
    app.appendChild(el('<div class="msg">Acesso restrito ao administrador.</div>'));
    document.querySelectorAll('.topbar-controls, .sidebar').forEach(function (n) { n.style.display = 'none'; });
    return;
  }
  document.getElementById('admin-email').textContent = eu.email;
  document.getElementById('admin-avatar').textContent = (eu.email || '?')[0].toUpperCase();
  document.getElementById('btn-sair').addEventListener('click', async function (e) {
    e.preventDefault();
    await supabaseClient.auth.signOut();
    window.location.href = 'adm.html';
  });

  document.querySelectorAll('.nav-item').forEach(function (item) {
    item.addEventListener('click', function () {
      STATE.page = item.getAttribute('data-page');
      document.querySelectorAll('.nav-item').forEach(function (n) { n.classList.remove('active'); });
      item.classList.add('active');
      render();
    });
  });
  document.querySelectorAll('.period-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      STATE.periodDays = Number(btn.getAttribute('data-period'));
      document.querySelectorAll('.period-btn').forEach(function (n) { n.classList.remove('active'); });
      btn.classList.add('active');
      render();
    });
  });
  document.querySelector('.nav-item[data-page="dashboard"]').classList.add('active');
  document.getElementById('btn-export').addEventListener('click', exportCSV);

  await carregarDados();
  render();
}

async function carregarDados() {
  const [trainersRes, planosRes, assinPagRes, clientesRes, treinosRes, agendamentosRes, pagamentosRes] = await Promise.all([
    supabaseClient.from('trainers').select('id, nome, email, status_assinatura, plano_id, trial_termina_em, created_at'),
    supabaseClient.from('planos_assinatura').select('id, nome, valor'),
    supabaseClient.from('assinatura_pagamentos').select('trainer_id, valor, status, data_pagamento'),
    supabaseClient.from('clientes').select('id, trainer_id, status, created_at'),
    supabaseClient.from('treinos').select('id, trainer_id, cliente_id'),
    supabaseClient.from('agendamentos').select('id, trainer_id'),
    supabaseClient.from('pagamentos').select('trainer_id, valor, data'),
  ]);

  STATE.raw = {
    trainers: trainersRes.data || [],
    planos: planosRes.data || [],
    assinaturaPagamentos: assinPagRes.data || [],
    clientes: clientesRes.data || [],
    treinos: treinosRes.data || [],
    agendamentos: agendamentosRes.data || [],
    pagamentos: pagamentosRes.data || [],
  };
}

function periodCutoff() {
  const d = new Date();
  d.setDate(d.getDate() - STATE.periodDays);
  return d;
}

function render() {
  const titles = {
    dashboard: ['Dashboard', 'Financeiro, profissionais e alunos da plataforma, tudo em um lugar'],
    receita: ['Receita', 'Faturamento consolidado da plataforma, MRR e desempenho por plano'],
    usuarios: ['Usuários', 'Profissionais e alunos da plataforma'],
    afiliados: ['Afiliados', 'Parceiros, links rastreados e comissões a pagar'],
    operacao: ['Operação', 'Saúde e consumo da plataforma'],
  };
  document.getElementById('page-title').textContent = titles[STATE.page][0];
  document.getElementById('page-sub').textContent = titles[STATE.page][1];

  const app = document.getElementById('app');
  app.innerHTML = '';
  if (STATE.page === 'dashboard') return renderDashboardOverview(app);
  if (STATE.page === 'receita') return renderReceita(app);
  if (STATE.page === 'usuarios') return renderUsuariosPage(app);
  if (STATE.page === 'afiliados') return renderEmptyFeature(app, 'Afiliados', 'Ainda não existe programa de indicação/afiliados no Elo Fitness — nenhuma tabela ou fluxo de comissão foi criado. Essa tela está reservada no menu, mas precisa ser desenhada e construída antes de mostrar dados aqui.');
  if (STATE.page === 'operacao') return renderEmptyFeature(app, 'Operação', 'Ainda não existe rastreamento de custo/consumo de IA nem alertas automáticos da plataforma — não há tabela de log de operações hoje. Essa tela está reservada no menu, mas precisa de instrumentação nova antes de mostrar dados aqui.');
}

function renderEmptyFeature(app, nome, texto) {
  const panel = el('<div class="panel"></div>');
  panel.appendChild(el('<div class="empty-panel"><strong>' + esc(nome) + ' ainda não existe no backend</strong>' + esc(texto) + '</div>'));
  app.appendChild(panel);
}

function deltaText(atual, anterior) {
  if (!anterior) return atual > 0 ? 'sem comparação (período anterior zerado)' : '—';
  const pct = ((atual - anterior) / anterior) * 100;
  const seta = pct >= 0 ? '▲' : '▼';
  return seta + ' ' + Math.abs(pct).toFixed(1).replace('.', ',') + '% vs período anterior';
}

function renderDashboardOverview(app) {
  const raw = STATE.raw;
  const cutoffAtual = periodCutoff();
  const cutoffAnterior = new Date(cutoffAtual);
  cutoffAnterior.setDate(cutoffAnterior.getDate() - STATE.periodDays);

  const confirmados = raw.assinaturaPagamentos.filter(function (p) { return ['CONFIRMED', 'RECEIVED'].includes(p.status); });
  function somaPeriodo(de, ate) {
    return confirmados.filter(function (p) {
      if (!p.data_pagamento) return false;
      const d = new Date(p.data_pagamento + 'T00:00:00');
      return d >= de && (!ate || d < ate);
    }).reduce(function (s, p) { return s + Number(p.valor); }, 0);
  }
  const receitaAtual = somaPeriodo(cutoffAtual, null);
  const receitaAnterior = somaPeriodo(cutoffAnterior, cutoffAtual);

  function contarClientes(de, ate) {
    return raw.clientes.filter(function (c) {
      if (!c.created_at) return false;
      const d = new Date(c.created_at);
      return d >= de && (!ate || d < ate);
    }).length;
  }
  const novosAtual = contarClientes(cutoffAtual, null);
  const novosAnterior = contarClientes(cutoffAnterior, cutoffAtual);

  const planosById = {};
  raw.planos.forEach(function (p) { planosById[p.id] = p; });
  const trainersAtivos = raw.trainers.filter(function (t) { return t.status_assinatura === 'ativo'; });
  const trainersTrial = raw.trainers.filter(function (t) { return t.status_assinatura === 'trial'; });
  const trainersInadimplentes = raw.trainers.filter(function (t) { return t.status_assinatura === 'inadimplente'; });
  const trainersIsentos = raw.trainers.filter(function (t) { return t.status_assinatura === 'isento'; });
  const mrr = trainersAtivos.reduce(function (s, t) { return s + (planosById[t.plano_id] ? Number(planosById[t.plano_id].valor) : 0); }, 0);
  const ticketMedio = trainersAtivos.length ? mrr / trainersAtivos.length : 0;
  const alunosAtivos = raw.clientes.filter(function (c) { return c.status === 'ativo'; });

  app.appendChild(el('<h2>Resumo do período</h2>'));
  const cards = el('<div class="cards"></div>');
  cards.appendChild(el(cardHTML('MRR atual', fmtBRL(mrr), true)));
  cards.appendChild(el(cardHTML('Receita no período', fmtBRL(receitaAtual), false, deltaText(receitaAtual, receitaAnterior))));
  cards.appendChild(el(cardHTML('Ticket médio', fmtBRL(ticketMedio))));
  cards.appendChild(el(cardHTML('Novos alunos', String(novosAtual), false, deltaText(novosAtual, novosAnterior))));
  cards.appendChild(el(cardHTML('Alunos ativos', String(alunosAtivos.length), false, raw.clientes.length + ' no total')));
  cards.appendChild(el(cardHTML('Personal ativos', String(trainersAtivos.length), false, raw.trainers.length + ' cadastrados no total')));
  app.appendChild(cards);

  const months = last12Months();
  const receitaMensal = months.map(function (m) {
    return confirmados.filter(function (p) { return p.data_pagamento && p.data_pagamento.slice(0, 7) === m.key; }).reduce(function (s, p) { return s + Number(p.valor); }, 0);
  });
  const alunosMensal = months.map(function (m) {
    return raw.clientes.filter(function (c) { return c.created_at && c.created_at.slice(0, 7) === m.key; }).length;
  });

  const chartsRow = el('<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;"></div>');
  const painelReceita = el('<div class="panel" style="margin-top:0;"><h3>Receita mensal</h3><div class="panel-sub">Últimos 12 meses</div></div>');
  painelReceita.appendChild(lineChart(months.map(function (m) { return m.label; }), [{ label: 'Receita', color: '#f97316', values: receitaMensal }]));
  chartsRow.appendChild(painelReceita);
  const painelAlunos = el('<div class="panel" style="margin-top:0;"><h3>Novos alunos por mês</h3><div class="panel-sub">Últimos 12 meses</div></div>');
  painelAlunos.appendChild(lineChart(months.map(function (m) { return m.label; }), [{ label: 'Novos alunos', color: '#60a5fa', values: alunosMensal }]));
  chartsRow.appendChild(painelAlunos);
  app.appendChild(chartsRow);

  const statusPanel = el('<div class="panel"><h3>Profissionais por status</h3><div class="panel-sub">Distribuição da base de trainers</div></div>');
  const totalTrainers = raw.trainers.length || 1;
  [
    ['Ativo', trainersAtivos.length, '#4ade80'],
    ['Trial', trainersTrial.length, '#60a5fa'],
    ['Inadimplente', trainersInadimplentes.length, '#f97316'],
    ['Isento', trainersIsentos.length, '#9aa4b2'],
  ].forEach(function (row) {
    const pct = (row[1] / totalTrainers) * 100;
    statusPanel.appendChild(el(
      '<div style="margin-bottom:10px;"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;"><span>' + row[0] + '</span><b>' + row[1] + ' · ' + fmtPct(pct) + '</b></div>' +
      '<div class="funnel-track"><div class="funnel-fill" style="width:' + pct.toFixed(1) + '%;background:' + row[2] + '"></div></div></div>'
    ));
  });
  app.appendChild(statusPanel);

  renderAlertas(app, raw);

  const alunosPorTrainer = {};
  raw.clientes.forEach(function (c) { alunosPorTrainer[c.trainer_id] = (alunosPorTrainer[c.trainer_id] || 0) + 1; });
  renderRankingPersonais(app, raw, alunosPorTrainer, 5);

  const linkRow = el('<div style="display:flex;gap:16px;font-size:12.5px;color:#66707e;margin-top:16px;">Ver detalhe completo:</div>');
  ['receita', 'usuarios'].forEach(function (pagina) {
    const link = el('<a href="#" style="color:#f97316;font-weight:700;margin-left:8px;">' + esc(titlesLabel(pagina)) + '</a>');
    link.addEventListener('click', function (e) {
      e.preventDefault();
      STATE.page = pagina;
      document.querySelectorAll('.nav-item').forEach(function (n) { n.classList.toggle('active', n.getAttribute('data-page') === pagina); });
      render();
    });
    linkRow.appendChild(link);
  });
  app.appendChild(linkRow);
}

function titlesLabel(pagina) {
  return { receita: 'Receita', usuarios: 'Usuários' }[pagina] || pagina;
}

function renderAlertas(app, raw) {
  const hoje = dataLocalStr();
  const d5 = new Date();
  d5.setDate(d5.getDate() + 5);
  const em5dias = d5.getFullYear() + '-' + String(d5.getMonth() + 1).padStart(2, '0') + '-' + String(d5.getDate()).padStart(2, '0');

  const trialVencendo = raw.trainers.filter(function (t) { return t.status_assinatura === 'trial' && t.trial_termina_em && t.trial_termina_em >= hoje && t.trial_termina_em <= em5dias; });
  const trialVencido = raw.trainers.filter(function (t) { return t.status_assinatura === 'trial' && t.trial_termina_em && t.trial_termina_em < hoje; });
  const inadimplentes = raw.trainers.filter(function (t) { return t.status_assinatura === 'inadimplente'; });
  const clientesComTreino = {};
  raw.treinos.forEach(function (tr) { if (tr.cliente_id) clientesComTreino[tr.cliente_id] = true; });
  const alunosSemTreino = raw.clientes.filter(function (c) { return c.status === 'ativo' && !clientesComTreino[c.id]; });
  const trainersComAluno = {};
  raw.clientes.forEach(function (c) { trainersComAluno[c.trainer_id] = true; });
  const trainersSemAluno = raw.trainers.filter(function (t) { return ['trial', 'ativo'].includes(t.status_assinatura) && !trainersComAluno[t.id]; });

  const nomeOuEmail = function (t) { return t.nome || t.email; };
  const itens = [];
  if (trialVencido.length) itens.push({ nivel: 'critico', texto: trialVencido.length + ' profissional(is) com trial vencido, ainda sem plano: ' + trialVencido.map(nomeOuEmail).join(', ') });
  if (inadimplentes.length) itens.push({ nivel: 'critico', texto: inadimplentes.length + ' profissional(is) inadimplente(s): ' + inadimplentes.map(nomeOuEmail).join(', ') });
  if (trialVencendo.length) itens.push({ nivel: 'atencao', texto: trialVencendo.length + ' profissional(is) com trial vencendo em até 5 dias: ' + trialVencendo.map(nomeOuEmail).join(', ') });
  if (alunosSemTreino.length) itens.push({ nivel: 'atencao', texto: alunosSemTreino.length + ' aluno(s) ativo(s) sem nenhum treino cadastrado' });
  if (trainersSemAluno.length) itens.push({ nivel: 'info', texto: trainersSemAluno.length + ' profissional(is) sem nenhum aluno cadastrado ainda' });

  const panel = el('<div class="panel"><h3>Alertas</h3><div class="panel-sub">Pontos que provavelmente precisam da sua atenção</div></div>');
  if (!itens.length) {
    panel.appendChild(el('<div class="empty-panel">Nada fora do normal por enquanto.</div>'));
  } else {
    itens.forEach(function (it) {
      const cor = it.nivel === 'critico' ? '#f87171' : (it.nivel === 'atencao' ? '#f97316' : '#60a5fa');
      panel.appendChild(el(
        '<div style="padding:10px 0;border-bottom:1px solid #171d29;font-size:13px;display:flex;gap:10px;align-items:flex-start;">' +
        '<span style="width:8px;height:8px;border-radius:50%;background:' + cor + ';margin-top:5px;flex:none;"></span>' +
        '<span>' + esc(it.texto) + '</span></div>'
      ));
    });
  }
  app.appendChild(panel);
}

function renderReceita(app) {
  const raw = STATE.raw;
  const planosById = {};
  raw.planos.forEach(function (p) { planosById[p.id] = p; });

  const ativos = raw.trainers.filter(function (t) { return t.status_assinatura === 'ativo'; });
  const inadimplentes = raw.trainers.filter(function (t) { return t.status_assinatura === 'inadimplente'; });

  const mrr = ativos.reduce(function (s, t) { return s + (planosById[t.plano_id] ? Number(planosById[t.plano_id].valor) : 0); }, 0);
  const arr = mrr * 12;
  const ticketMedio = ativos.length ? mrr / ativos.length : 0;
  const inadimplenciaPct = (ativos.length + inadimplentes.length) ? (inadimplentes.length / (ativos.length + inadimplentes.length)) * 100 : 0;

  const cutoff = periodCutoff();
  const confirmados = raw.assinaturaPagamentos.filter(function (p) { return ['CONFIRMED', 'RECEIVED'].includes(p.status); });
  const receitaPeriodo = confirmados
    .filter(function (p) { return p.data_pagamento && new Date(p.data_pagamento + 'T00:00:00') >= cutoff; })
    .reduce(function (s, p) { return s + Number(p.valor); }, 0);

  app.appendChild(el('<h2>Financeiro</h2>'));
  const cards = el('<div class="cards"></div>');
  cards.appendChild(el(cardHTML('MRR atual', fmtBRL(mrr), true)));
  cards.appendChild(el(cardHTML('ARR projetado', fmtBRL(arr), false, 'run rate anualizado (MRR × 12)')));
  cards.appendChild(el(cardHTML('Receita no período', fmtBRL(receitaPeriodo), false, 'cobranças confirmadas via Asaas')));
  cards.appendChild(el(cardHTML('Ticket médio', fmtBRL(ticketMedio), false, 'por profissional ativo')));
  cards.appendChild(el(cardHTML('Inadimplência', fmtPct(inadimplenciaPct), false, inadimplentes.length + ' profissional(is) em atraso', true)));
  app.appendChild(cards);

  const months = last12Months();
  const monthlyTotals = months.map(function (m) {
    return confirmados
      .filter(function (p) { return p.data_pagamento && p.data_pagamento.slice(0, 7) === m.key; })
      .reduce(function (s, p) { return s + Number(p.valor); }, 0);
  });

  const chartPanel = el('<div class="panel"><h3>Receita recorrente mensal</h3><div class="panel-sub">Total confirmado por mês · últimos 12 meses</div></div>');
  chartPanel.appendChild(lineChart(months.map(function (m) { return m.label; }), [{ label: 'Assinaturas', color: '#f97316', values: monthlyTotals }]));
  app.appendChild(chartPanel);

  const totalReceita = monthlyTotals.reduce(function (a, b) { return a + b; }, 0) || receitaPeriodo;
  const compPanel = el('<div class="panel"><h3>Composição da receita</h3><div class="panel-sub">Única fonte de receita hoje: assinatura do profissional</div></div>');
  compPanel.appendChild(el(
    '<div class="bar-track" style="width:100%;height:8px;margin-bottom:10px;"><div class="bar-fill" style="width:100%"></div></div>' +
    '<div style="display:flex;justify-content:space-between;font-size:13px;"><span>Assinaturas de personais</span><b>' + fmtBRL(totalReceita) + ' · 100%</b></div>'
  ));
  app.appendChild(compPanel);

  renderHistoricoPagamentos(app, raw);
}

function renderHistoricoPagamentos(app, raw) {
  const trainersById = {};
  raw.trainers.forEach(function (t) { trainersById[t.id] = t; });
  const cutoff = periodCutoff();
  const rows = raw.assinaturaPagamentos
    .filter(function (p) { return p.data_pagamento && new Date(p.data_pagamento + 'T00:00:00') >= cutoff; })
    .sort(function (a, b) { return (b.data_pagamento || '').localeCompare(a.data_pagamento || ''); })
    .slice(0, 50);

  const panel = el('<div class="panel"><h3>Histórico de pagamentos (Asaas)</h3><div class="panel-sub">Cobranças no período selecionado</div></div>');
  if (!rows.length) {
    panel.appendChild(el('<div class="empty-panel">Nenhum pagamento registrado no período.</div>'));
  } else {
    const table = el('<table><thead><tr><th>Data</th><th>Profissional</th><th>Valor</th><th>Status</th></tr></thead><tbody></tbody></table>');
    const tbody = table.querySelector('tbody');
    rows.forEach(function (p) {
      const t = trainersById[p.trainer_id];
      tbody.appendChild(el(
        '<tr><td>' + new Date(p.data_pagamento + 'T00:00:00').toLocaleDateString('pt-BR') + '</td>' +
        '<td>' + esc(t ? (t.nome || t.email) : '—') + '</td>' +
        '<td>' + fmtBRL(p.valor) + '</td><td>' + esc(p.status) + '</td></tr>'
      ));
    });
    panel.appendChild(table);
  }
  app.appendChild(panel);
}

function badgeClass(status) { return 'badge badge-' + status; }

function renderGestaoAssinaturas(app, raw) {
  const planosById = {};
  raw.planos.forEach(function (p) { planosById[p.id] = p; });

  const panel = el('<div class="panel"><h3>Gestão de assinaturas</h3><div class="panel-sub">Trocar de plano ou estender o trial manualmente</div></div>');
  const table = el('<table><thead><tr><th>Nome</th><th>E-mail</th><th>Status</th><th>Plano</th><th>Trial até</th><th>Ações</th></tr></thead><tbody></tbody></table>');
  const tbody = table.querySelector('tbody');
  if (!raw.trainers.length) {
    tbody.appendChild(el('<tr><td colspan="6" style="text-align:center;color:#66707e;">Nenhum profissional cadastrado.</td></tr>'));
  }
  raw.trainers.forEach(function (t) {
    const vitalicio = t.status_assinatura === 'isento';
    const tr = el('<tr></tr>');
    tr.appendChild(el('<td>' + esc(t.nome || '—') + '</td>'));
    tr.appendChild(el('<td>' + esc(t.email) + '</td>'));
    tr.appendChild(el('<td><span class="' + badgeClass(t.status_assinatura) + '">' + (vitalicio ? 'Vitalício' : esc(t.status_assinatura)) + '</span></td>'));
    tr.appendChild(el('<td>' + (vitalicio ? '—' : (t.plano_id && planosById[t.plano_id] ? esc(planosById[t.plano_id].nome) : '—')) + '</td>'));
    tr.appendChild(el('<td>' + (vitalicio ? '—' : (t.trial_termina_em ? new Date(t.trial_termina_em + 'T00:00:00').toLocaleDateString('pt-BR') : '—')) + '</td>'));

    const tdAcoes = el('<td style="white-space:nowrap;"></td>');

    const btnVitalicio = el('<button class="btn-export" style="padding:5px 10px;font-size:12px;">' + (vitalicio ? 'Remover vitalício' : 'Tornar vitalício') + '</button>');
    btnVitalicio.addEventListener('click', function () {
      if (vitalicio) {
        if (!confirm('Remover o acesso vitalício de ' + (t.nome || 'esse profissional') + '? Ele volta a precisar de um plano/trial normal.')) return;
        removerVitalicio(t);
      } else {
        if (!confirm('Dar acesso vitalício (grátis, sem cobrança) pra ' + (t.nome || 'esse profissional') + '?')) return;
        tornarVitalicio(t);
      }
    });
    tdAcoes.appendChild(btnVitalicio);

    const selectPlano = el('<select style="background:#0d1119;border:1px solid #1e2633;border-radius:7px;padding:5px 8px;color:#e5e9f0;font-size:12px;margin-left:8px;"></select>');
    selectPlano.appendChild(el('<option value="">Trocar plano…</option>'));
    raw.planos.forEach(function (p) { selectPlano.appendChild(el('<option value="' + p.id + '">' + esc(p.nome) + '</option>')); });
    selectPlano.addEventListener('change', function (e) {
      const planoId = e.target.value;
      if (!planoId) return;
      const planoNome = planosById[planoId] ? planosById[planoId].nome : '';
      if (!confirm('Trocar o plano de ' + (t.nome || 'esse profissional') + ' pra "' + planoNome + '"?')) { e.target.value = ''; return; }
      trocarPlano(t, planoId);
    });
    tdAcoes.appendChild(selectPlano);

    const inputDias = el('<input type="number" placeholder="dias" style="width:56px;margin-left:8px;background:#0d1119;border:1px solid #1e2633;border-radius:7px;padding:5px 6px;color:#e5e9f0;font-size:12px;">');
    const btnEstender = el('<button class="btn-export" style="padding:5px 10px;font-size:12px;margin-left:6px;">Estender trial</button>');
    btnEstender.addEventListener('click', function () {
      const dias = parseInt(inputDias.value, 10);
      if (!dias || dias <= 0) { alert('Informe quantos dias adicionar ao trial.'); return; }
      if (!confirm('Estender o trial de ' + (t.nome || 'esse profissional') + ' em ' + dias + ' dia(s)?')) return;
      estenderTrial(t, dias);
    });
    tdAcoes.appendChild(inputDias);
    tdAcoes.appendChild(btnEstender);

    tr.appendChild(tdAcoes);
    tbody.appendChild(tr);
  });
  panel.appendChild(table);
  app.appendChild(panel);
}

async function estenderTrial(trainer, dias) {
  const base = trainer.trial_termina_em && trainer.trial_termina_em >= dataLocalStr() ? trainer.trial_termina_em : dataLocalStr();
  const [y, m, d] = base.split('-').map(Number);
  const nova = new Date(y, m - 1, d + dias);
  const novaStr = nova.getFullYear() + '-' + String(nova.getMonth() + 1).padStart(2, '0') + '-' + String(nova.getDate()).padStart(2, '0');
  const { error } = await supabaseClient.functions.invoke('admin-atualizar-trainer', {
    body: { trainer_id: trainer.id, trial_termina_em: novaStr, status_assinatura: 'trial' },
  });
  if (error) { alert('Não foi possível atualizar: ' + error.message); return; }
  await carregarDados();
  render();
}

function dataLocalStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

async function trocarPlano(trainer, planoId) {
  // assinatura_valida_ate precisa ir junto — sem isso o bloqueio de
  // assinatura usa o trial_termina_em antigo (geralmente já vencido) como
  // data de corte e a pessoa aparece bloqueada mesmo tendo acabado de
  // ganhar um plano. Dá 1 ano, prazo generoso pra um ajuste manual do admin.
  const daqui1Ano = new Date();
  daqui1Ano.setFullYear(daqui1Ano.getFullYear() + 1);
  const validaAteStr = daqui1Ano.getFullYear() + '-' + String(daqui1Ano.getMonth() + 1).padStart(2, '0') + '-' + String(daqui1Ano.getDate()).padStart(2, '0');
  const { error } = await supabaseClient.functions.invoke('admin-atualizar-trainer', {
    body: { trainer_id: trainer.id, plano_id: planoId, status_assinatura: 'ativo', assinatura_valida_ate: validaAteStr },
  });
  if (error) { alert('Não foi possível atualizar: ' + error.message); return; }
  await carregarDados();
  render();
}

async function tornarVitalicio(trainer) {
  const { error } = await supabaseClient.functions.invoke('admin-atualizar-trainer', {
    body: { trainer_id: trainer.id, status_assinatura: 'isento' },
  });

}

async function removerVitalicio(trainer) {

  });

function renderRankingPersonais(app, raw, alunosPorTrainer, limite) {
  limite = limite || 10;
  const planosById = {};
  raw.planos.forEach(function (p) { planosById[p.id] = p; });
  const cutoff = periodCutoff();
  const recebidoPorTrainer = {};
  raw.pagamentos.forEach(function (p) {
    if (!p.data || new Date(p.data + 'T00:00:00') < cutoff) return;
    recebidoPorTrainer[p.trainer_id] = (recebidoPorTrainer[p.trainer_id] || 0) + Number(p.valor);
  });
  const clientesPorTrainerAtivos = {};
  raw.clientes.forEach(function (c) {
    if (c.status !== 'ativo') return;
    clientesPorTrainerAtivos[c.trainer_id] = (clientesPorTrainerAtivos[c.trainer_id] || 0) + 1;
  });

  const ranking = raw.trainers
    .map(function (t) {
      const alunos = alunosPorTrainer[t.id] || 0;
      const ativos = clientesPorTrainerAtivos[t.id] || 0;
      return {
        nome: t.nome || t.email,
        plano: t.plano_id && planosById[t.plano_id] ? planosById[t.plano_id].nome : '—',
        alunos: alunos,
        recebido: recebidoPorTrainer[t.id] || 0,
        pctAtivos: alunos ? (ativos / alunos) * 100 : 0,
      };
    })
    .filter(function (r) { return r.alunos > 0; })
    .sort(function (a, b) { return b.alunos - a.alunos; })
    .slice(0, limite);

  const panel = el('<div class="panel"><h3>Personais em destaque</h3><div class="panel-sub">Top ' + limite + ' por alunos vinculados</div></div>');
  if (!ranking.length) {
    panel.appendChild(el('<div class="empty-panel">Nenhum profissional com aluno cadastrado ainda.</div>'));
  } else {
    const table = el('<table><thead><tr><th>Personal</th><th>Plano</th><th>Alunos</th><th>Recebido no período</th><th>Alunos ativos</th></tr></thead><tbody></tbody></table>');
    const tbody = table.querySelector('tbody');
    ranking.forEach(function (r) {
      tbody.appendChild(el(
        '<tr><td>' + esc(r.nome) + '</td><td>' + esc(r.plano) + '</td><td>' + r.alunos + '</td><td>' + fmtBRL(r.recebido) + '</td>' +
        '<td><span class="bar-track"><span class="bar-fill" style="width:' + r.pctAtivos.toFixed(0) + '%"></span></span> ' + fmtPct(r.pctAtivos) + '</td></tr>'
      ));
    });
    panel.appendChild(table);
    STATE._lastRanking = ranking;
  }
  app.appendChild(panel);
}

function cardHTML(label, val, highlight, delta, warn) {
  return '<div class="card' + (warn ? ' warn' : (highlight ? ' highlight' : '')) + '">' +
    '<div class="label">' + esc(label) + '</div>' +
    '<div class="val"' + (highlight ? ' style="color:#f97316"' : (warn ? ' style="color:#f97316"' : '')) + '>' + val + '</div>' +
    (delta ? '<div class="delta">' + esc(delta) + '</div>' : '') +
    '</div>';
}

function lineChart(labels, series) {
  const w = 1080, h = 260, padL = 40, padR = 10, padT = 10, padB = 26;
  const allVals = series.reduce(function (a, s) { return a.concat(s.values); }, [0]);
  const max = Math.max.apply(null, allVals) || 1;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const stepX = labels.length > 1 ? plotW / (labels.length - 1) : 0;

  function pathFor(values) {
    return values.map(function (v, i) {
      const x = padL + i * stepX;
      const y = padT + plotH - (v / max) * plotH;
      return (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
  }

  let svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:260px;display:block;">';
  [0, 0.5, 1].forEach(function (f) {
    const y = padT + plotH * f;
    svg += '<line x1="' + padL + '" y1="' + y + '" x2="' + (w - padR) + '" y2="' + y + '" stroke="#1a2130" stroke-width="1"/>';
    svg += '<text x="4" y="' + (y + 4) + '" font-size="10" fill="#66707e">' + fmtCompact(max * (1 - f)) + '</text>';
  });
  series.forEach(function (s) {
    svg += '<path d="' + pathFor(s.values) + '" fill="none" stroke="' + s.color + '" stroke-width="2.5"/>';
    s.values.forEach(function (v, i) {
      const x = padL + i * stepX, y = padT + plotH - (v / max) * plotH;
      svg += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="2.5" fill="' + s.color + '"/>';
    });
  });
  labels.forEach(function (lab, i) {
    const x = padL + i * stepX;
    svg += '<text x="' + x.toFixed(1) + '" y="' + (h - 6) + '" font-size="10" fill="#66707e" text-anchor="middle">' + esc(lab) + '</text>';
  });
  svg += '</svg>';
  if (series.length > 1) {
    const legend = el('<div style="display:flex;gap:16px;justify-content:flex-end;margin-bottom:6px;font-size:12px;color:#9aa4b2;"></div>');
    series.forEach(function (s) {
      legend.appendChild(el('<span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:' + s.color + ';margin-right:6px;"></span>' + esc(s.label) + '</span>'));
    });
    const wrapper = document.createElement('div');
    wrapper.appendChild(legend);
    wrapper.appendChild(el(svg));
    return wrapper;
  }
  return el(svg);
}

function fmtCompact(n) {
  if (n >= 1000) return (n / 1000).toFixed(0) + 'k';
  return String(Math.round(n));
}

function exportCSV() {
  let rows = [];
  if (['dashboard', 'usuarios'].includes(STATE.page) && STATE._lastRanking) {
    rows.push(['Personal', 'Plano', 'Alunos', 'Recebido no período', 'Alunos ativos %']);
    STATE._lastRanking.forEach(function (r) {
      rows.push([r.nome, r.plano, r.alunos, r.recebido.toFixed(2), r.pctAtivos.toFixed(1)]);
    });
  } else {
    alert('Nada para exportar nesta tela ainda.');
    return;
  }
  const csv = rows.map(function (r) { return r.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'painel-adm-' + STATE.page + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

init();
