html,body{margin:0;padding:0;background:#0a0d13;font-family:'Plus Jakarta Sans',sans-serif;color:#e5e9f0;}

<div style="min-height:100vh;background:#0a0d13;display:flex;align-items:center;justify-content:center;padding:32px 16px;">
  <div style="width:100%;max-width:420px;">
    <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:28px;">
      <div style="width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#f97316,#ea580c);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:19px;">P</div>
      <div style="font-size:21px;font-weight:800;">Performa <span style="color:#f97316;">AI</span></div>
    </div>

    <div style="background:#10151f;border:1px solid #1a2130;border-radius:18px;padding:28px 26px;">
      <div style="display:flex;background:#0d1119;border:1px solid #1e2633;border-radius:11px;padding:3px;margin-bottom:22px;">
        <button sc-camel-on-click="{{ setPersonal }}" style="flex:1;border:none;font-family:inherit;font-size:13px;font-weight:700;padding:10px;border-radius:9px;cursor:pointer;background:{{ personalBg }};color:{{ personalColor }};">Sou personal</button>
        <button sc-camel-on-click="{{ setAluno }}" style="flex:1;border:none;font-family:inherit;font-size:13px;font-weight:700;padding:10px;border-radius:9px;cursor:pointer;background:{{ alunoBg }};color:{{ alunoColor }};">Sou aluno</button>
      </div>

      <div style="font-size:18px;font-weight:800;margin-bottom:4px;">{{ tituloLogin }}</div>
      <div style="font-size:13px;color:#9aa4b2;margin-bottom:20px;">{{ subtituloLogin }}</div>

      <div style="display:flex;flex-direction:column;gap:12px;">
        <div style="{{ nomeFieldDisplay }}">
          <label style="font-size:12px;font-weight:700;color:#9aa4b2;display:block;margin-bottom:6px;">Nome</label>
          <input value="{{ nome }}" sc-camel-on-change="{{ onNomeChange }}" placeholder="Seu nome" style="width:100%;background:#0d1119;border:1px solid #1e2633;border-radius:9px;padding:11px 14px;color:#e5e9f0;font-family:inherit;font-size:13.5px;outline:none;">
        </div>
        <div>
          <label style="font-size:12px;font-weight:700;color:#9aa4b2;display:block;margin-bottom:6px;">E-mail</label>
          <input value="{{ email }}" sc-camel-on-change="{{ onEmailChange }}" placeholder="{{ emailPlaceholder }}" style="width:100%;background:#0d1119;border:1px solid #1e2633;border-radius:9px;padding:11px 14px;color:#e5e9f0;font-family:inherit;font-size:13.5px;outline:none;">
        </div>
        <div>
          <label style="font-size:12px;font-weight:700;color:#9aa4b2;display:block;margin-bottom:6px;">Senha</label>
          <input type="password" value="{{ senha }}" sc-camel-on-change="{{ onSenhaChange }}" placeholder="••••••••" style="width:100%;background:#0d1119;border:1px solid #1e2633;border-radius:9px;padding:11px 14px;color:#e5e9f0;font-family:inherit;font-size:13.5px;outline:none;">
        </div>
      </div>

      <div style="{{ erroDisplay }}color:#f87171;font-size:12.5px;margin-top:12px;">{{ erro }}</div>

      <button sc-camel-on-click="{{ onEntrarClick }}" style="display:block;text-align:center;width:100%;margin-top:18px;background:linear-gradient(135deg,#f97316,#ea580c);border:none;color:#fff;font-family:inherit;font-size:14px;font-weight:700;padding:12px;border-radius:10px;cursor:pointer;">{{ botaoLabel }}</button>
      <div style="text-align:center;margin-top:12px;"><span style="font-size:12px;color:#66707e;cursor:pointer;">Esqueci minha senha</span></div>
    </div>

    <div style="{{ criarContaDisplay }}text-align:center;margin-top:18px;font-size:12px;color:#66707e;">{{ criarContaTexto }} <span sc-camel-on-click="{{ toggleModo }}" style="color:#f97316;font-weight:700;cursor:pointer;">{{ criarContaLink }}</span></div>

    <div style="{{ acessoRapidoDisplay }}margin-top:22px;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
        <div style="flex:1;height:1px;background:#1a2130;"></div>
        <span style="font-size:11px;color:#66707e;font-weight:700;">ACESSO RÁPIDO · TESTE</span>
        <div style="flex:1;height:1px;background:#1a2130;"></div>
      </div>
      <div style="display:flex;gap:10px;">
        <button id="qa-savera" style="flex:1;background:#10151f;border:1px solid #1a2130;color:#e5e9f0;font-family:inherit;font-size:12.5px;font-weight:700;padding:11px;border-radius:9px;cursor:pointer;">Entrar como Savera</button>
        <button id="qa-vinicius" style="flex:1;background:#10151f;border:1px solid #1a2130;color:#e5e9f0;font-family:inherit;font-size:12.5px;font-weight:700;padding:11px;border-radius:9px;cursor:pointer;">Entrar como Vinícius</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:480}}">
class Component extends DCLogic {
  state = { perfil: 'personal', modo: 'login', nome: '', email: '', senha: '', erro: '', carregando: false };

  async onEntrarClick() {
    const { perfil, modo, nome, email, senha } = this.state;
    if (!email || !senha) {
      this.setState({ erro: 'Preencha e-mail e senha.' });
      return;
    }
    this.setState({ carregando: true, erro: '' });

    if (modo === 'cadastro') {
      const { error } = await supabaseClient.auth.signUp({
        email, password: senha, options: { data: { nome } }
      });
      if (error) {
        this.setState({ carregando: false, erro: error.message });
        return;
      }
      this.setState({ carregando: false, erro: 'Conta criada! Verifique seu e-mail para confirmar, depois faça login.', modo: 'login' });
      return;
    }

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
    if (error) {
      const msg = error.message === 'Email not confirmed'
        ? 'Confirme seu e-mail antes de entrar (verifique sua caixa de entrada).'
        : 'E-mail ou senha inválidos.';
      this.setState({ carregando: false, erro: msg });
      return;
    }
    window.location.href = perfil === 'personal' ? 'dashboard.html' : 'app-aluno.html';
  }

  renderVals() {
    const perfil = this.state.perfil;
    const isPersonal = perfil === 'personal';
    const isCadastro = this.state.modo === 'cadastro';

    return {
      personalBg: isPersonal ? '#1e2633' : 'transparent', personalColor: isPersonal ? '#e5e9f0' : '#66707e',
      alunoBg: !isPersonal ? '#1e2633' : 'transparent', alunoColor: !isPersonal ? '#e5e9f0' : '#66707e',
      setPersonal: () => this.setState({ perfil: 'personal' }),
      setAluno: () => this.setState({ perfil: 'aluno', modo: 'login' }),
      tituloLogin: isCadastro ? 'Criar conta de personal trainer' : (isPersonal ? 'Entrar como personal trainer' : 'Entrar como aluno'),
      subtituloLogin: isPersonal ? 'Acesse seu painel de alunos, produtos e financeiro' : 'Acesse seu treino, dieta e evolução',
      emailPlaceholder: isPersonal ? 'personal@demo.com' : 'aluno@demo.com',
      nome: this.state.nome, email: this.state.email, senha: this.state.senha,
      nomeFieldDisplay: isCadastro ? '' : 'display:none;',
      onNomeChange: (e) => this.setState({ nome: e.target.value }),
      onEmailChange: (e) => this.setState({ email: e.target.value }),
      onSenhaChange: (e) => this.setState({ senha: e.target.value }),
      onEntrarClick: () => this.onEntrarClick(),
      botaoLabel: this.state.carregando ? 'Aguarde…' : (isCadastro ? 'Criar conta' : 'Entrar'),
      erro: this.state.erro,
      erroDisplay: this.state.erro ? '' : 'display:none;',
      criarContaDisplay: isPersonal ? '' : 'display:none;',
      criarContaTexto: isCadastro ? 'Já tem conta?' : 'Não tem conta?',
      criarContaLink: isCadastro ? 'Entrar' : 'Criar conta grátis',
      toggleModo: () => this.setState({ modo: isCadastro ? 'login' : 'cadastro', erro: '' }),
      acessoRapidoDisplay: ''
    };
  }
}
</script>
<script>
(function(){
  var CONTAS = {
    'qa-savera': { email: 'savera.personal@gmail.com', senha: 'Savera2026!', destino: 'dashboard.html' },
    'qa-vinicius': { email: 'vinicius.aluno@gmail.com', senha: 'Vinicius2026!', destino: 'app-aluno.html' }
  };
  var emAndamento = false;

  document.addEventListener('click', async function(e){
    var btn = e.target.closest && e.target.closest('#qa-savera, #qa-vinicius');
    if (!btn || emAndamento) return;
    var conta = CONTAS[btn.id];
    if (!conta) return;
    emAndamento = true;
    var original = btn.textContent;
    btn.textContent = 'Entrando…';
    var { error } = await supabaseClient.auth.signInWithPassword({ email: conta.email, password: conta.senha });
    if (error) {
      emAndamento = false;
      btn.textContent = original;
      alert('Acesso rápido falhou: ' + error.message);
      return;
    }
    window.location.href = conta.destino;
  }, true);
})();
</script>
